name: SV_MEMBER_MONTHLY
description: 'Phase-1 회원 월별 실적 SV(base FMM). 활성: 납입/청구 총액·납부율(공64)·미납회원 감소율(공80)·개발/중단
  총건. 시간=전체가능. 회비 지표는 HAS_BILLING=TRUE 전제 권장. 회원상태/성별/구분은 현재 스냅샷 기준(과거월도 현재값). 비활성(적재
  대기): 캠페인/납입방식/후원사업/사유별 분해(FK=0), 활동/누계/미납 카운트 비율(ACTIVE_CNT=0), 신규기존 분해(NEF=0),
  지역/연령대(dim 공란).'
tables:
  - name: FMM
    synonyms:
      - 회원 월별 실적
      - 월간 회원 팩트
    description: "회원 월별 스냅샷 팩트(grain=월×회원, 40.05M · 실측 유일 → PK). 회비/개발/중단 월 롤업."
    base_table:
      database: GN_DW
      schema: GOLD
      table: FACT_MEMBER_MONTHLY
    primary_key:
      columns:
        - MONTH_KEY
        - MEMBER_DK
    dimensions:
      - name: HAS_BILLING
        synonyms:
          - 회비출처여부
          - 청구대상
        description: TRUE=회비(billing) 원천 존재 행. 회비 지표는 TRUE 전제 권장.
        expr: fmm.HAS_BILLING
        data_type: BOOLEAN
    metrics:
      - name: PAYMENT_RATE
        synonyms:
          - 납부율
          - 수납율
        description: "공64 납부율(%) = 납입회비 ÷ 청구금액 ×100. 비율(N, 재집계 금지)."
        expr: "SUM(fmm.PAID_FEE) / NULLIF(SUM(fmm.BILLED_AMT), 0) * 100"
        access_modifier: public_access
      - name: TOTAL_BILLED_AMT
        synonyms:
          - 청구금액
          - 청구액 총액
        description: "청구금액 합계(원, 재청구 중복 포함). F(가산)."
        expr: SUM(fmm.BILLED_AMT)
        access_modifier: public_access
      - name: TOTAL_DEV_CNT
        synonyms:
          - 개발건
          - 개발 총건
          - 신규개발수
        description: 개발(신규 후원) 건수 합계. F(가산). FME 월 롤업(A1).
        expr: SUM(fmm.DEV_CNT)
        access_modifier: public_access
      - name: TOTAL_PAID_FEE
        synonyms:
          - 납입회비
          - 납입회비 총액
          - 수납액
        description: 납입회비 합계(원). F(가산).
        expr: SUM(fmm.PAID_FEE)
        access_modifier: public_access
      - name: TOTAL_STOP_CNT
        synonyms:
          - 중단건
          - 중단 총건
          - 해지건
        description: 중단(해지) 건수 합계. F(가산). FME 월 롤업(A1).
        expr: SUM(fmm.STOP_CNT)
        access_modifier: public_access
      - name: UNPAID_MEMBERS_BOM
        synonyms:
          - 월초 미납회원수
        description: 월초(BOM) 미납 회원 고유수. D(distinct). 다월 합산 금지.
        expr: COUNT(DISTINCT CASE WHEN fmm.UNPAID_FLAG_BOM THEN fmm.MEMBER_DK END)
        access_modifier: public_access
      - name: UNPAID_MEMBERS_EOM
        synonyms:
          - 월말 미납회원수
        description: 월말(EOM) 미납 회원 고유수. D(distinct). 다월 합산 금지.
        expr: COUNT(DISTINCT CASE WHEN fmm.UNPAID_FLAG_EOM THEN fmm.MEMBER_DK END)
        access_modifier: public_access
      - name: UNPAID_REDUCTION_RATE
        synonyms:
          - 미납회원 감소율
        description: 공80 미납회원 감소율(%) = (월초미납−월말미납) ÷ 월초미납 ×100. 비율(N).
        expr: "(COUNT(DISTINCT CASE WHEN fmm.UNPAID_FLAG_BOM THEN fmm.MEMBER_DK END)\n\
          \       - COUNT(DISTINCT CASE WHEN fmm.UNPAID_FLAG_EOM THEN fmm.MEMBER_DK\
          \ END))\n      / NULLIF(COUNT(DISTINCT CASE WHEN fmm.UNPAID_FLAG_BOM THEN\
          \ fmm.MEMBER_DK END), 0) * 100"
        access_modifier: public_access
  - name: MEMBER
    synonyms:
      - 회원
      - 회원속성
    description: 회원 현재 스냅샷(SCD2 IS_CURRENT). 불변/현재 속성 전용. fan-out 차단용 helper 뷰.
    base_table:
      database: GN_DW
      schema: SERVING
      table: DIM_MEMBER_CURRENT
    primary_key:
      columns:
        - MEMBER_DK
    dimensions:
      - name: GENDER
        synonyms:
          - 성별코드
        description: 성별 원천 코드값(F/M/U). 표기·집계는 GENDER_NAME(여성/남성) 사용 권장.
        expr: member.GENDER
        data_type: VARCHAR(16777216)
      - name: MEMBER_STATUS
        synonyms:
          - 회원상태코드
          - 상태코드
        description: 회원상태 원천 코드값(1~12). 표기·집계는 MEMBER_STATUS_NAME/MEMBER_STATUS_GROUP
          사용 권장.
        expr: member.MEMBER_STATUS
        data_type: VARCHAR(16777216)
      - name: MEMBER_TYPE
        synonyms:
          - 회원구분코드
          - 구분코드
        description: 회원구분 원천 코드값(1/2/3). 표기·집계는 MEMBER_TYPE_NAME(개인/기업/단체) 사용 권장.
        expr: member.MEMBER_TYPE
        data_type: VARCHAR(16777216)
      - name: MEMBER_TYPE_NAME
        synonyms:
          - 회원구분
          - 구분
          - 회원유형
          - 개인기업단체
        description: '회원구분명(한글): 개인/기업/단체. 원천 코드 MM018. 코드가 아닌 이 라벨로 집계·표기.'
        expr: member.MEMBER_TYPE_NAME
        data_type: VARCHAR(16777216)
      - name: MEMBER_STATUS_NAME
        synonyms:
          - 회원상태
          - 상태
          - 회원현황
        description: '회원상태명(한글): 활동회원/신규미납1~5/장기미납1~5/후원중단. 현재 스냅샷 기준. 원천 코드 MM010.
          코드가 아닌 이 라벨로 집계·표기.'
        expr: member.MEMBER_STATUS_NAME
        data_type: VARCHAR(16777216)
      - name: MEMBER_STATUS_GROUP
        synonyms:
          - 회원상태분류
          - 상태분류
          - 상태대분류
          - 정상미납중단
        description: '회원상태 대분류: 정상(활동)/미납(신규·장기미납)/중단(후원중단)/미상. 요약 집계용.'
        expr: member.MEMBER_STATUS_GROUP
        data_type: VARCHAR(16777216)
      - name: GENDER_NAME
        synonyms:
          - 성별
          - 성
          - 남녀
        description: '성별명(한글): 여성/남성/미상. 코드가 아닌 이 라벨로 집계·표기.'
        expr: member.GENDER_NAME
        data_type: VARCHAR(16777216)
  - name: MONTH
    synonyms:
      - 월
      - 조회월
      - 기간
    description: 월 차원(DIM_DATE 월 grain DISTINCT). fan-out 차단용 helper 뷰.
    base_table:
      database: GN_DW
      schema: SERVING
      table: DIM_MONTH
    primary_key:
      columns:
        - MONTH_KEY
    dimensions:
      - name: CAL_MONTH
        synonyms:
          - 월
          - 몇월
        description: 월(1~12)
        expr: month.MONTH
        data_type: "NUMBER(2,0)"
      - name: CAL_QUARTER
        synonyms:
          - 분기
        description: 분기(1~4)
        expr: month.QUARTER
        data_type: "NUMBER(1,0)"
      - name: CAL_YEAR
        synonyms:
          - 연도
          - 년
          - 해
        description: 조회 연도
        expr: month.YEAR
        data_type: "NUMBER(4,0)"
      - name: MONTH_KEY
        synonyms:
          - 연월
          - 조회연월
        description: YYYYMM 정수
        expr: month.MONTH_KEY
        data_type: "NUMBER(6,0)"
relationships:
  - name: FMM_TO_MEMBER
    left_table: FMM
    right_table: MEMBER
    relationship_columns:
      - left_column: MEMBER_DK
        right_column: MEMBER_DK
  - name: FMM_TO_MONTH
    left_table: FMM
    right_table: MONTH
    relationship_columns:
      - left_column: MONTH_KEY
        right_column: MONTH_KEY
