tools:
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_budget
    description: '예산 팩트(FBD, grain=월×세세목). 원천=ERP 예산·실적 원장(GN_DW.BRONZE_ERP.BDGT_ACMSLT_LEDGER, 파일 업로드 적재). 활성 지표: 편성예산(월)·집행예산(ERP)·집행율. 차원: 연/월, 세세목명·예산구분. 예산 편성/집행/집행율 질문의 기본 도구. ⚠집행예산은 적재가 진행된 월까지만 값이 있어 연 합계 집행율은 분모 과대 — 집행 존재 월만 분모에 포함할 것. 비활성(적재 대기): 연 편성예산, 모금성비용, 조직/캠페인별, ROI.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_ad
    description: '광고 실적 팩트(WIDE_AD_COMBINED = FAP 코어 + 디지털·방송 위성 1:1 pre-join). 원천=대행사 일별 리포트(GN_DW.BRONZE_AGENCY: DGT_AD_CMPGN_DTLS·VIDEO_AD_CMPGN_DTLS·REBRDC_AD_CMPGN_DTLS) + GA4(외부 Python 적재로 GN_DW.SILVER.BIGQUERY_REFINED_DATA 에 직접 적재된다 — BRONZE_BIGQUERY 는 테이블이 없다). 활성 지표: 광고비·노출수·클릭수·CTR(공9)·CVR(공10)·CRM개발건·개발단가(공7, 디지털)·조회수·매체잠재고객수 / 인바운드콜·방송횟수(방송) / 재방송개발건·재방송개발회원·재방송 개발단가(공8, REBROADCAST 전용). 차원: 실적일·연/월/분기, 출처유형(DIGITAL/VIDEO/REBROADCAST)·기기유형(M/PC/(해당없음))·광고유형·소재유형·페이지유형·광고그룹(디지털)·채널사·시간대·프로그램·스팟유형·CM위치·재방유형(방송). ⚠디지털/방송 measure 상호배타 — AD_SOURCE_TYPE 필터 필수. ⚠개발단가(공7)는 원천 포맷 변경 이후 구간 산출 불가(경계 연월은 조회로 확인). ⚠개발건수·개발단가(공8)는 REBROADCAST 전용(VIDEO 원천에 개발 컬럼 부재) — 방송 전체 지표 아님. ⚠전환콜은 원천이 전건 비어 미노출. ⚠예산(analyst_budget)과 원천이 달라 교차 집계 불가. [2026-08-06 O45] 차원 추가: **마케팅캠페인명 · 개발캠페인 수(팬아웃 경고축)** — \U0001F534 **마케팅캠페인별 광고비·노출·클릭·CTR·개발단가 분해가 가능해졌다**(종전 \"캠페인별 분해 불가\" 서술은 회수됐다). \u26a0\ufe0f 마케팅캠페인 축으로 그루핑하면 미도달 광고행이 (미매핑)으로 모여 **캠페인별 합계 < 전체 합계**다 — 총계는 축 없이 답한다. \U0001F534 여전히 불가: **소재별 분해**(소재 연결키 부재) · **개발캠페인(개별 캠페인명)별 분해**(광고비 배분 규칙 부재 —
      「개발캠페인 수」 축이 그 배수를 보여준다). \U0001F534 광고비 \u00f7 CRM 개발실적(회원 팩트) 형태의 개발단가는 cross-fact 라 불가하며 이 도구의 개발단가는 **대행사 리포트 기준**이다.'
- tool_spec:
