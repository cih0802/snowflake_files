    description: '서비스 발송 팩트(FSE, grain=일×회원×서비스). 원천=CRM(UMS 발송) → GN_DW.BRONZE_CRM. 전사 요약용: 발송수, 발송 대상 고유 회원수. 차원: 발송일·연·월, 서비스구분·채널, **발송상태 라벨(축A)**·**통신사 도달결과 라벨(축B)**. 전사 발송 규모 요약 질문에 사용. 🔴 발송결과를 물으면 **코드축이 아니라 라벨축**으로 답하고, **두 축을 섞거나 합산하지 않는다**(축A=우리 발송 시스템 상태 · 축B=통신사 도달 결과). 🔴 라벨 NULL 은 결측이 아니라 채널별 사전 라벨 부재·원천 부재이므로 **성공/실패·도달률을 전 채널 기준으로 단정하지 말고 채널과 NULL 버킷을 함께 밝힌다**.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_ml_dvlp_forecast
    description: 'ML 개발금액 예측 5종 통합(grain=기준월×계열유형×계열×예측월). 원천=GN_DW.ML → SERVING.ML_DVLP_FORECAST_V. 🔴🔴 **예측치이며 실적이 아니다** — 예산·광고·회원 실적 measure 와 한 표에 합산하지 말 것. 🔴 머신러닝은 **테스트 단계**다. 🔴🔴 **단위는 만원이다** — 예산·회비 등 원 단위 지표와 섞으면 10,000배 오차가 난다. 활성 지표: 예측 개발액·신뢰구간 상/하한·월평균 예측액·예측 개월수·계열수. 차원: 기준월(모델 실행월)·**계열유형(TOTAL 전사·DEPT 부서·SPNSR_BSNS 후원사업·NEW_OLD 신규기존·CAMPAIGN 캠페인)**·계열코드·계열명·예측월. "연도말 개발 예측"·"부서별 개발 전망"·"후원사업별 개발 예측"·"신규/기존 개발 예측"·"캠페인별 월별 개발액 예측" 류 질문에 사용. 🔴🔴 **계열유형을 반드시 고정하거나 그룹에 넣는다** — 넣지 않으면 같은 개발 활동을 여러 축으로 겹쳐 세어 과대가 된다. 🔴🔴 **유형별 합계는 서로 일치하지 않는다**(계열별 독립 예측) — 부서 합·후원사업 합·신규기존 합이 전사 예측과 다르다. 한 유형으로 다른 유형을 검산하지 말고, 불일치 지적에는 이 구조를 설명하며 임의로 비례배분해 맞추지 않는다. 🔴 기준월과 예측월은 다른 축이며 여러 기준월 합산은 중복계상이다. ⚠️ 음수 예측치가 존재한다(감액·해지 반영) — 오류로 처리하거나 0 으로 바꾸지 말 것. ⚠️ 캠페인 계열은 일부 캠페인만 예측 대상이다. 🔴 **개발 목표·달성율은 이 도구에 없다** — 목표는 회원 도메인 어시스턴트(AGENT_MEMBER) 소관이며 예측을 목표로 나눠 달성율을 만들지 말 것.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_ml_ltv_forecast
    description: 'ML LTV 월별 예측 2종(grain=기준월×LTV유형×계열×예측월). 원천=GN_DW.ML → SERVING.ML_LTV_FORECAST_V. 🔴🔴 예측치이며 실적이 아니다. 🔴 머신러닝은 테스트 단계다. 🔴 단위는 원이다(개발금액 예측의 만원과 다르다). 활성 지표: LTV 예측 평균·합계·신뢰구간·예측 개월수·계열수. 차원: 기준월·**LTV유형**·계열코드·계열명·예측월. "채널별 LTV 예측"·"캠페인별 후원 LTV 전망"·"회원평균 LTV 예측" 류 질문에 사용. 🔴🔴 **LTV유형을 반드시 하나로 고정한다** — ''UCMPGN_AVG_MEMBER''는 **상위캠페인(채널)의 회원 1인당 평균 LTV**이고 ''CMPGN_TOTAL''은 **일반 캠페인의 후원 총액 LTV**다. 의미·자리수가 다르고 **계열 집합이 서로 전혀 겹치지 않는다**(실측 교집합 0) ⇒ 두 유형을 한 표에 섞거나 순위를 함께 매기면 반드시 틀린다. 🔴 「채널별 LTV」 질문은 UCMPGN 유형으로 답한다 — 요건 문서는 두 예측을 모두 「채널(상위캠페인) 단위」로 적었으나 실제로 상위캠페인인 것은 UCMPGN 쪽뿐이다. 🔴 **회원평균 유형에서는 LTV 를 합산하지 않는다**(1인당 평균의 합은 의미가 없다) — 평균 지표를 쓴다. 🔴 스코어 형태(계열당 1행)는 analyst_ml_ltv_score 이며 grain 이 달라 한 표에 합치지 않는다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_ml_ltv_score
    description: 'ML LTV 스코어 2종(grain=기준월×LTV유형×계열 · 계열당 1행). 원천=GN_DW.ML → SERVING.ML_LTV_SCORE_V. 🔴🔴 예측 기반 산출이며 회계 실적이 아니다. 🔴 머신러닝은 테스트 단계다. 🔴 단위는 원이다. 활성 지표: LTV 평균·최대·과거 누적금액·미래 예측금액·월평균 예측/실적·평균 활동개월·계열수. 차원: 기준월·LTV유형·계열코드·계열명. "채널 LTV 순위"·"LTV 가 높은 캠페인"·"LTV 스코어" 류 질문에 사용. 🔴🔴 **LTV유형을 하나로 고정한다**(상위캠페인 회원평균 ↔ 일반캠페인 후원총액 · 계열 집합 교집합 0). 🔴 **analyst_ml_ltv_forecast 와 한 표에 합치지 않는다** — 이 도구는 계열당 1행이고 그쪽은 계열당 예측월 다수라 분모가 달라 조용히 틀린다. 월별 추이가 필요하면 그쪽으로 라우팅한다. ⚠️ 월평균 실적 컬럼이 있으나 **실적 정본이 아니다** — 회비·월실적 실적은 회원 도메인 어시스턴트 소관이다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_ml_feature_importance
    description: 'ML 요인분석(피처 중요도) 2종(grain=기준월×분석유형×피처). 원천=GN_DW.ML → SERVING.ML_FEATURE_IMPORTANCE_V. 🔴🔴 **측정 대상이 데이터가 아니라 모델이다** — 값은 0~1 기여도이며 금액·건수·회원수가 아니다(분석유형 내 합계=1). 다른 도구의 measure 와 같은 표에 넣으면 업무 수치로 오독된다. 🔴 머신러닝은 테스트 단계다. 활성 지표: 기여도 합계·평균·최대·피처수. 차원: 기준월·**분석유형**(CHANNEL_NEW_SPNSR 신규 후원 유치 요인 · DVLP_INC 증액 개발 요인)·피처명·순위·피처유형. "신규 후원 유치 요인"·"증액 개발 요인"·"어떤 요인이 중요한가" 류 질문에 사용. 🔴🔴 **분석유형을 하나로 고정한다** — 유형 내 기여도 합계가 1 이므로 섞으면 합계가 1 을 넘고 순위가 뒤섞인다. 🔴🔴 **인과로 답하지 않는다** — 「이 요인을 늘리면 신규 후원이 늘어난다」가 아니라 「모델이 이 요인에 가장 큰 상대 중요도를 부여했다」로 표현한다. 🔴🔴 **피처 목록은 사람이 지정한 후보다**(피처유형 전건 ''user_provided'') — 「데이터 분석으로 발견한 요인」이라 답하지 말고, 지정되지 않은 요인을 「중요하지 않다」고 말할 수 없음을 밝힌다. 🔴 상위 요인은 순위로 정렬한다.'
