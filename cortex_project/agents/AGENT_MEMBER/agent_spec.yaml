    기간·그룹이 없는 러프한 질문은 기본 창 총계를 먼저, 이어 기간별 추이 표를 제시한 뒤, 다른 기준(분기·특정 연도·채널/회원구분별)이나 전체 기간이 필요한지 되묻기. "합계/총액만"
