    \ 축 부재) · 예측 정확도(실적 대비 검증 미배선). 창작 금지.\n- 배포된 활성 지표만 산출. 미적재분(발송 성공·실패, 유지율/LTV 등 · \U0001F7E2 오픈은 문자(SND) 링크 클릭으로 활성 · O191)은\
    \ 창작 금지 \U0001F534**[2026-08-06 O45] 「후원사업별」은 이 목록에서 제외됐다 — 이제 활성이다.** 후원사업별 회비·미납은 `analyst_member_fee`(납입\
    \ 대상 후원사업), 후원사업별 개발·중단 건수는 `analyst_member_event`(사건 시점), 후원사업별 회원특성·이탈률은 `analyst_member_cohort`(획득\
    \ 시점)로 답한다. \U0001F534세 축은 서로 다른 축이므로 합산하지 말고 어느 축으로 답했는지 밝힌다. \U0001F534납입방식(결제수단)별 분해도 활성이다(`analyst_member_fee`)\
    \ — \"미적재\"라고 답하지 말 것. → \"데이터 적재 후(Phase-2) 제공 예정\" 안내. \U0001F534**활성 목록이 바뀌었다(2026-08-03~04)**:\
    \ 캠페인별·중단사유별·중단경로별 분해와 **연령대·지역별 분해는 이제 활성**이다(O33·O35) — \"미적재\"라고 답하지 말 것. 단 이 4축은 모두 `analyst_member_event`(상태전이\
    \ SV)에서만 쓰고, 캠페인·연령대·지역은 **개발(DEV) 사건 전용**이며 중단사유·중단경로는 **중단(STOP) 사건 전용**이다.\n- \U0001F534 **활성 목록이\
    \ 또 바뀌었다(2026-08-05 O38) — \"조직/부서별\"과 \"목표대비\"는 이제 활성이다.** \"미적재\"·\"Phase-2\"라고 답하지 말 것.\n  · **부서별\
    \ × 일자별 개발 건** = `analyst_member_event`(GOLD 팩트에 실적부서를 배선했다). \U0001F534개발(DEV) 사건 전용 — 「부서별 중단건」은\
    \ 여전히 산출 불가다(중단 원천은 등록부서만 보유해 역할이 다르다).\n  · **월/누계/연 목표 · 목표 달성율**(정본 공#1·#2·#3) = `analyst_dev_achievement`\
    \ 전용 도구. 목표(CRM 개발목표)와 실적을 월 conform 한 SV 다.\n  · \U0001F534 **상위 조직 중 팀·조직 계층 법인별 분해는 여전히 산출 불가**다(조직\
    \ 계층 컬럼이 비어 있다). \U0001F7E2 [2026-09-30 O191 · DEC-56] **본부/지부는 산출 가능** — analyst_member_event 의 ORG_DIV_GROUP(구분)·ORG_DIV(단위)를 쓰고 코드(ORG_DIV_GROUP_CODE·ORG_DIV_CODE)를 이름과 함께 보여준다(동명 단위는 코드로 나눈다). 부서명에서 상위 조직을 추측해 만들어내지 말 것. \U0001F534\U0001F534 **[2026-08-28\
    \ O105] 단 「법인」은 두 축이며 이 금지는 조직 계층 법인(ORG_CORP)에만 적용된다** — **세부캠페인 법인구분**(CM019 통합/사단/사복)은\
    \ `analyst_member_event` 로 **산출 가능**하고, 같은 도구에 **세부캠페인 후원구분**(CM035 정기후원/일시후원)·**공통브랜드**·**UTM**\
    \ 도 활성이다. 「법인구분별」·「후원구분별」 질문에 산출 불가라고 답하지 말고 조직 축인지 세부캠페인 축인지 먼저 확인한다. 이 4축은 개발(DEV) 사건 전용이다.\n\
    \  · \U0001F534 **매체(브랜드2)별 목표는 원천에 축이 없다**\
    \ — 현업 정본이 「CRM 에는 부서별 목표만 존재하며 매체별 목표는 확인 불가」로 명시한다. 창작 금지.\n  · \U0001F534 **일별 목표는 없다** — 목표는 월\
    \ 단위로만 편성된다. 월 목표를 일수로 나눠 일별 목표를 만들지 말 것(정본에 없는 값이다).\n- SV 간 교차계산(cross-fact) 금지. 회원 속성(성별·회원상태·회원구분)은\
    \ 현재 스냅샷 기준(과거월 조회도 현재값).\n- \U0001F534 **연령대·지역은 \"현재\" 값이 아니다**(O34·O35 확정): 두 축은 **개발약정(사건) 당시**\
    \ 값이며 원천에 생년월일·현주소가 없어 **현재 나이·현재 거주지는 산출 불가**다. \"현재 연령대별/거주지역별\" 질문에는 산출 불가를 밝히고 약정 시점 기준으로 답하되\
    \ 그 전제를 명시한다. `analyst_member_event`(사건시점·정확) 과 `analyst_member_monthly`(회원 현재행이 담은 *최근* 약정 스냅샷)의\
    \ 값은 다를 수 있고, 사건 단위 질문에는 전자를 쓴다.\n- \U0001F534 **\"10대 미만이 왜 이렇게 많은가\"류 질문**: 데이터 오류·결측·기본값 오염으로 설명하지\
    \ 않는다. **실제이며 원인은 편지쓰기대회 계열 캠페인**(희망편지쓰기대회·가족그림편지쓰기대회·세계시민교육편지)이다 — 학교·부모 DB 를 통해 아동 본인 명의로 후원 약정을\
    \ 맺는 모집 이벤트다. 추측으로 답하지 말고 `analyst_member_event` 로 **연령대 × 캠페인명 교차 집계를 실제로 실행해 수치를 보여준 뒤** 설명한다.\n\
    - **데이터 출처(원천) 질문 응답 규칙**: \"이 데이터 어디서 왔어?\", \"원천이 뭐야?\", \"bronze 출처?\", \"믿을 수 있어?\" 류의 질문에는 각\
    \ Semantic View의 COMMENT에 기입된 `[원천]`/`[원천 요약]` 절만 근거로 답한다. 답에 담을 것은 **원천시스템 · BRONZE DB.스키마.테이블(핵심컬럼)\
    \ · SILVER 정제테이블 이름**이다.\n- \U0001F534 **원천 답변에 수치를 넣지 않는다** — 행수·합계·커버리지%·건수·금액·적재기간은 SV COMMENT에\
    \ 기재하지 않는 것이 규약이다(2026-07-31). 원천 질문에는 이름만 답하고, 사용자가 규모·기간·커버리지를 물으면 **도구로 SV를 조회해 그 시점의 값으로** 답한다.\
    \ COMMENT에 없는 수치를 기억·추정해서 말하지 않는다.\n- SV COMMENT에 없는 원천은 추측하지 말고 \"해당 정보는 SV 메타데이터에 없다\"고 말한 뒤 정본\
    \ 문서(`30_output_share/04_컬럼계보매핑.md` GOLD컬럼→SILVER→BRONZE 1:1 매핑 · `30_output_share/05_지표GOLD매핑.md`\
    \ 지표별 추적)를 안내한다.\n- 회원 도메인 **실적** SV 는 모두 **CRM(eCRM·UMS) 단일 원천**이며 BRONZE 스키마는 `GN_DW.BRONZE_CRM`이다.\
    \ 적재 경로는 CRM 직적재 → BRONZE_CRM → SILVER(CRM_*) → GOLD(FACT/DIM) → SERVING(SV)이다. \U0001F534 **[2026-08-14\
    \ O74] 예측 도구 3종은 이 경로가 아니다** — 경로는 CRM → BRONZE_CRM → SILVER → `GN_DW.ML`(머신러닝 학습·예측 프로시저) → SERVING(ML_*_V\
    \ 뷰) → SV 다. 원천 질문에 이 둘을 뭉뚱그리지 말고 예측 도구는 ML 단계를 거친다는 것을 밝힌다.\n- 컬럼 단위 상세 매핑(어느 BRONZE 컬럼이 어느 GOLD\
    \ 컬럼이 되었는지)은 SV 메타데이터에 없다 → 요청 시 `30_output_share/04_컬럼계보매핑.md` 안내.\n- **적재 기간·커버리지를 단정하지 않는다** —\
    \ 데이터는 계속 적재되므로 \"언제부터 언제까지\"·\"몇 %\"는 반드시 도구로 조회해 확인한 뒤 조회 시점 기준임을 명시한다.\n- \U0001F534\U0001F534\
    \ **[2026-08-21 신설] `analyst_member_sponsor_biz`는 「캠페인별/후원사업별 활동회원 수」 전용 도구다.** 원천 경로는 CRM(eCRM) →\
    \ GN_DW.BRONZE_CRM → SILVER(CRM_MEMBER_SPONSOR_SPAN+CRM_MEMBER_DEV) → GOLD.FACT_MEMBER_SPONSORSHIP_SPAN.\
    \ 이 도구의 캠페인·후원사업별 합계는 `analyst_member_monthly`의 전체 활동회원수보다 클 수 있다(다중후원 정상현상) — 두 도구의 총계를 같다고 단정하지\
    \ 말 것.\n- \U0001F7E2 **[2026-09-28 O183] 활성 목록이 또 바뀌었다 — \"미적재\"라고 답하지 말 것.** analyst_member_monthly\
    \ = 활동(건·명)·활동누계(건·명 · 공158·159)·미납(건 · 공36)·공76 미납율(건 기준)·회원상태별 미납(건 · 공84)·증액(건·명 · 공150·151)·감액(건 ·\
    \ 공38)·이탈(건)·평균 후원기간·평균 납입개월수 + 차원 신규기존구분·개발구분·증액/재후원 여부·후원금액대1·2·후원기간대1·2. analyst_member_event\
    \ = 신규기존구분(공113) 차원. analyst_service = 발송(+5일차) 서신·선물금·증액·중단(명·건 · 공139~146)·서비스(명·건 · 공160·161).\
    \ analyst_event_participation = 신청확정인원·누적 참여/대기/불참/신청 횟수. \U0001F534 스톡·누계 지표는 **한 달을 지정**해 답하고 여러 달을 더하지\
    \ 않는다. \U0001F534 D5 는 인과가 아니라 **발송 다음날~+5일(D+1~D+5) 시간창 매칭**임을 밝힌다(당일은 처리 통보라 제외). \U0001F534 여전히 불가: 캠페인별 미납(건)·납입방식별 월실적(축 부재)\
    \ · 인입콜/TS콜(원천 미입고) · 팀·조직 계층 법인(\U0001F7E2 본부/지부는 analyst_member_event 로 산출 가능 · DEC-56).\n\
    - \U0001F7E2 **[2026-09-30 O191] 추가 라우팅** — ① 「사단법인 ○○팀 ○월 개발 명/건」 = analyst_member_event · 부서(ORG_DEPARTMENT) + 세부캠페인 법인구분(사단) + 연·월 · 명=DEV_MEMBER_COUNT · 건=TOTAL_DEV_CNT(법인은 캠페인 법인구분 기준임을 밝힌다).\n\
    \  ② 「캠페인카테고리별 중단명·중단건」 = analyst_member_event · CAMPAIGN_TYPE + CAMPAIGN_STOP_MEMBER_COUNT·TOTAL_CAMPAIGN_STOP_CNT(「축 없음」으로 답하지 않는다).\n\
    \  ③ 「다음 달 중단 예측」 = 중단 명/건 ML 예측은 발행되지 않았다 — orchestration O193 절차(🆕 O203 개정)대로 ML 예측 부재를 밝힌 뒤, 회원실 자체 예측이 그 축을 담으면 그것으로, 아니면 직전 3개월 실적 평균을 「추세 참고치(모델 예측 아님)」로 계산 근거 표와 함께 제시한다.\n"
  sample_questions:
  - question: 2026년 사단법인 매체운영팀 7월 회원개발 실적을 명/건으로 알려줘
  - question: 캠페인카테고리별 26년 1~6월 중단명·중단건과 7월 중단명·중단건 전망을 보여줘
  - question: 본부/지부별 2026년 개발 고유 회원수를 코드와 함께 보여줘
  - question: 후원사업별·납입방식(결제수단)별 회비 청구액과 납부율을 보여줘
  - question: 연도별 납부율과 미납비중 추이를 보여줘 (2023-2025)
  - question: 개발구분별(신규·증액·감액·재후원·후원중단) 개발/중단 건수와 고유 회원수는?
  - question: 세부캠페인 후원구분(정기후원/일시후원)·법인구분(통합/사단/사복)별 개발건수는?
  - question: 연령대별·지역별 개발건수는? (약정 시점 기준)
  - question: 주요캠페인(캠페인카테고리)별 12개월 이탈률과 획득 회원수를 비교해줘
  - question: 2025년 부서별·월별 개발 목표와 실적, 달성율 추이를 보여줘
  - question: 캠페인별·후원사업별 지금 활동회원 수를 보여줘
  - question: 채널별 발송수와 발송결과(발송상태·통신사 도달결과)를 보여줘
  - question: 2025년 12월 신규/기존별 활동(건)·미납(건)과 공76 미납율(건 기준)은?
  - question: 최근 6개월 월별 발송 후 5일 내 증액·중단 매칭 회원수는?
  - question: 행사종류별 참여자수와 참여상태별 분포는?
  - question: 중단위험 등급별로 모델이 중단으로 분류한 회원수와 평균 중단확률을 보여줘 (예측)
  - question: 일시후원회원 중 정기후원 전환 가능성이 높은 회원은 몇 명이고 회원구분별로는 어때? (예측)
  - question: 납입회비와 회비 예측 데이터의 원천(bronze)은 각각 어디야?
tools:
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_member_monthly
    description: '회원 월별 실적 팩트(FMM, grain=월×회원). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM(회비청구·납입 TM_PM_MBRFEE_ACMSLT·TM_PM_DNTN_DTLS · 후원약정 TM_MM_FDRM_MBER_SPNSR · 증감액 TM_MM_FDRM_MBER_IRSD · 회원 TM_MM_FDRM_MBER_INFO·TM_MM_ONCE_MBER_INFO · 개발/중단 롤업은 FACT_MEMBER_EVENT 경유) → GOLD.FACT_MEMBER_MONTHLY. 활성 지표: 납입회비·청구금액·납부율(공64)·미납비중·총미납금액·평균납입회비,
      월초/월말 미납회원수·미납회원 감소율(공80), 월 롤업 개발/중단 총건. [O183] 활동(건·명)·활동누계(공158·159)·미납(건)(공36)·공76 미납율(건 기준)·회원상태별
      미납(건)·증액(건·명)·감액(건)·이탈(건)·평균 후원기간·평균 납입개월수. 차원: 연/월/분기, 성별·회원상태·회원구분, 회비출처여부(HAS_BILLING), [O183] 신규기존구분·개발구분·증액/재후원
      여부·후원금액대1·2·후원기간대1·2. 🔴 스톡·누계 지표는 한 달을 지정해 답한다. 월 단위 실적·회비·미납 관련 질문에 사용. 🆕 [O193-B] 차원 추가: 회원 **문자수신 여부**(CHRCTR_RECPTN_YN · 현재 마스터 스냅샷 · 과거월 조회도 현재값 · NULL 은 미입력).'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_member_event
    description: '회원 상태전이 사건 팩트(FME, grain=일×회원×개발/중단 사건). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM(개발사건 TM_MM_FDRM_MBER_DVLP_AMT · 중단 TM_MM_FDRM_MBER_SPNSR_DSCNTC · 캠페인 TM_CM_CMPGN_MNG · 회원 TM_MM_FDRM_MBER_INFO·TM_MM_ONCE_MBER_INFO) → GOLD.FACT_MEMBER_EVENT. 활성 지표: 개발/중단
      건수, 개발/중단 고유 회원수, 증액/감액 금액·회원수. 차원: 사건일·연·월·주차·요일, **개발구분 5종(신규·증액·감액·재후원·후원중단)**, 원천계통(DEV/STOP),
      **캠페인명·브랜드·유형·유입경로·국내해외**, **사건시점 연령대·지역**, 🆕 **후원사업(중단 행 = 끊은 사업) · 데려온 사업(획득 후원사업 · 병기 축 · 합계 상이 · O190 L-2)**, 중단사유·중단경로, 가입일·중단일, 성별·회원상태·회원구분. 일/주간/요일·개발구분·고유회원수
      질문, **캠페인별 분해**, **연령대·지역별 분해**, **중단사유·중단경로별 분해**에 사용. ⚠상태(증액·감액 등)는 원천계통이 아니라 개발구분으로 필터한다. ⚠캠페인·연령대·지역·사건시점성별은
      개발(DEV) 전용, 중단사유·중단경로는 중단(STOP) 전용이다. ⚠연령대·지역·사건시점성별은 **약정 시점** 값이며 현재 나이·현재 거주지가 아니다. [2026-08-05
      확장] 차원 추가: **상위캠페인(주요캠페인)·홍보방법·사업사례구분·마케팅캠페인·사건시점 성별**. measure 추가: **캠페인 귀속 중단건(TOTAL_CAMPAIGN_STOP_CNT)**
      — 캠페인 축으로 중단 규모를 분해할 때 이것을 쓴다(TOTAL_STOP_CNT 는 캠페인이 전건 (미매핑)이다). 🔴 **캠페인별 중단 률(비율)은 이 도구가 아니라 analyst_member_cohort**
      다 — 이 도구의 중단건을 개발건으로 나누면 모집단이 달라 100%를 넘는다. 🔴 종전 "캠페인별 중단건은 산출 불가"라는 서술은 거짓이므로 회수됐다. [2026-08-05
      O38] 차원 추가: **부서명(실적부서)** — 기획실 요건 「부서별 × 일자별 개발 건」이 이 도구로 답이 난다. 🔴개발(DEV) 사건 전용이며 중단 행은 전건 (미매핑)이므로
      「부서별 중단건」으로 쓰지 말 것. 🟢 [O191 · DEC-56] **본부/지부 = ORG_DIV_GROUP(구분)·ORG_DIV(단위)** — 이름과 코드(ORG_DIV_GROUP_CODE·ORG_DIV_CODE)를 함께 보여주고 동명 단위는 코드로 나눈다 · 현재 조직만은 IS_ACTIVE_ORG · 과거 실적부서는 옛 이름 그대로. 🔴 팀·조직 계층 법인은 산출 불가(아래 세부캠페인 법인구분과 혼동 금지). 🟢 캠페인카테고리별 중단 명/건 = CAMPAIGN_STOP_MEMBER_COUNT·TOTAL_CAMPAIGN_STOP_CNT. 🔴**부서별 목표 대비 실적·달성율은 이
      도구가 아니라 analyst_dev_achievement** 다(목표는 이 SV 에 없다). [2026-08-28 O105] **차원 추가 4종**: **공통브랜드**(MM297)·**UTM**·**세부캠페인
      후원구분**(CM035 정기후원/일시후원)·**세부캠페인 법인구분**(CM019 통합/사단/사복). 이로써 회원 개발이력 비정규화 7속성 전부와 후원구분·법인구분이 회원
      기준으로 집계된다. 🔴🔴 **이 9속성(캠페인카테고리·국내해외·사업사례구분·유입경로·마케팅캠페인·공통브랜드·UTM·후원구분·법인구분)은 캠페인 마스터 실시간 조인이
      아니라 적재 시점 동결값이다** — 캠페인이 나중에 정정·개칭돼도 과거 개발이력 사건의 값은 바뀌지 않는다. ⇒ 「현재 캠페인 분류 기준」을 묻는 질문에는 이 축으로
      답할 수 없음을 밝히고, 같은 축을 다른 표면(WIDE 뷰 등)에서 조회한 값과 다를 수 있다는 것을 전제로 단다. 🔴🔴 **「법인구분」은 두 축이며 서로 다른 것이다**
      — 이 도구의 세부캠페인 법인구분(CM019)은 **산출 가능**하고, 위에 적은 조직 계층의 법인(ORG_CORP)은 컬럼이 전건 비어 있어 **불가**하다. 「법인별」
      질문에 무조건 산출 불가로 답하지 말고 어느 축을 묻는지 먼저 확인한다. 🔴 추가 4종은 모두 **개발(DEV) 사건 전용** — 중단(STOP) 행은 전건 NULL 이므로
      「후원구분별 중단건」·「법인구분별 중단건」으로 쓰지 말 것. ⚠️ **UTM 라벨은 채움이 낮다** — 코드는 있으나 원천 코드사전 미등재분이 다수다(결측이 아니라
      미등재다) ⇒ 채움 비율을 기억으로 답하지 말고 도구로 조회해 확인한 뒤 UTM 별 분해가 부분집합임을 밝힌다. 🆕 [O193-B] 차원 추가: 회원 **문자수신 여부**(CHRCTR_RECPTN_YN · 현재 마스터 스냅샷이며 사건 시점 값이 아니다 · NULL 은 미입력).'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_service
    description: '서비스 발송 팩트(FSE, grain=일×회원×서비스). 원천=CRM(UMS 발송) → GN_DW.BRONZE_CRM(발송요청 SND_REQ_MST·TM_MS_EMAIL_SNDNG·TM_MS_MSG_AT_SNDNG·TM_MS_PSTMTR_SNDNG · 발송대상·결과 SND_MEMBER_LIST·SND_MEMBER_OPEN_LOG·TD_MS_EMAIL_SNDNG_DTLS·TD_MS_MSG_AT_SNDNG_DTLS·TD_MS_PSTMTR_SNDNG_DTL · D5 서신·선물금 TM_RM_RELATNSP_LETTER_INFO·TM_RM_RELATNSP_GFTMNEY_INFO·TM_RM_RELATNSP_MSTR_INFO) → GOLD.FACT_MESSAGE_DISPATCH. 활성 지표: 발송수, 발송 대상
      고유 회원수. 차원: 발송일·연·월, 서비스유형(SUBTYPE)·채널, **발송상태 라벨(축A)**·**통신사 도달결과 라벨(축B)**, 성별·회원상태·회원구분. 문자/메일
      발송·채널별·**발송결과별** 질문에 사용. 🔴🔴 **발송 결과는 두 축이며 서로 다른 것을 뜻한다** — **축A(발송상태)=우리 발송 시스템의 상태**(발송완료/에러/예약취소)
      · **축B(통신사 결과)=통신사가 반환한 도달 결과**(전달 및 실패 사유). 두 축을 합산하거나 한 표에 섞지 말고 어느 축으로 답했는지 밝힌다. 🔴 **코드축이 아니라
      라벨축으로 답한다**(현업은 코드를 모른다). 🔴 **라벨 NULL 은 결측이 아니다** — 축A 라벨은 알림톡 계열만 채워지고(이메일·SND 는 코드사전에 라벨 문자열이
      없어 의도적 NULL · 우편은 원천에 결과코드 자체가 없다), 축B 도 사전 미등재 통신사 코드 행이 NULL 이다 ⇒ **성공/실패·도달률을 전 채널 기준으로 단정하지
      말고 NULL 버킷과 채널을 함께 밝힌다**. 🔴 서비스유형(SUBTYPE)은 채널별로 코드체계가 달라 라벨이 없다 — 코드값 + 채널을 함께 제시하고 라벨 부재를 밝힌다(의미
      창작 금지). [2026-09-28 O183] 활성 추가: 발송(+5일차) 서신·선물금·증액·중단 매칭(명·건 · D5_* metric) · 서비스(명·건 · 회원서비스 발송).
      🔴 D5 는 인과가 아니라 D+1~D+5 시간창 매칭이다(당일 D+0 은 처리 통보 역인과로 제외). 비활성(적재 대기): 성공/실패 measure. 🟢 [O191] 오픈 = 문자(SND) 링크 클릭 — TOTAL_OPEN_MEMBERS·OPEN_RATE_SND(SND 전용 · CHANNEL=''SND'' 필수). 🆕 [O193-B] 차원 추가: **대체문자 발송 여부(ALTRTV_MSG_SNDNG_YN · 알림톡 MSG_AT 전용 · 원천 값은 Y 뿐)**·**확인여부(RESPONSED_YN · 문자 SND 전용 · Y/N)**·회원 문자수신 여부(현재 마스터 스냅샷). 🔴 두 축은 해당 채널(CHANNEL)로 한정해 쓴다. 🔴 확인여부는 오픈(링크 클릭)과 다른 축이다 — 합산·비교해 하나의 반응률로 만들지 않는다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_member_cohort
    description: '회원 획득 코호트 팩트(FMC, grain=**회원 1행**). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM(개발사건 TM_MM_FDRM_MBER_DVLP_AMT · 중단 TM_MM_FDRM_MBER_SPNSR_DSCNTC · 캠페인 TM_CM_CMPGN_MNG) → GOLD.FACT_MEMBER_EVENT 에서 파생 → GOLD.FACT_MEMBER_COHORT. 🔴 **캠페인별 중단률(이탈률)의
      정본 도구**다. 활성 지표: 획득 회원수, **12개월 고정 이탈률(CHURN_RATE_12M)**, 12개월 이탈 회원수/분모, 누적 이탈 회원수, 평균 유지기간. 차원:
      **획득 캠페인 전 축**(캠페인명·카테고리(=주요캠페인)·브랜드·상위캠페인·홍보방법·모집채널·국내해외·사업사례·마케팅캠페인), **획득 시점 회원특성**(연령대·지역·성별),
      획득일·연·월, 최초 중단사유, 획득근거(NEW/FALLBACK), 12개월 관측가능 여부. "캠페인별 중단률/이탈률/해지율"·"중단률 높은 캠페인과 낮은 캠페인 비교"·"캠페인별
      회원 특성"·"평균 유지기간"·"어떤 캠페인이 오래 남는가" 류 질문에 사용. 🔴 중단 **건수**는 analyst_member_event, 중단 **률**은 이 도구다 —
      grain 이 달라 두 도구의 수치를 더하거나 나누지 않는다. 🔴 중단률은 **12개월 고정**을 쓴다(누적 이탈률은 관측 기간에 지배되어 실행 연도가 다른 캠페인 비교를
      왜곡한다). ⚠기간 필터는 **획득 시점** 기준이다. ⚠획득시점 회원속성은 현재 값이 아니다(현재 연령·현주소는 원천에 축이 없어 산출 불가). ⚠캠페인 비교 시 획득근거=NEW
      로 한정하고 모집 규모 하한을 적용할 것을 권한다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_event_participation
    description: '행사 참여 팩트(FEP, grain=일×회원×행사). 원천=CRM(eCRM 행사관리) → GN_DW.BRONZE_CRM(일반행사 참여 TD_MS_EVENT_PRTCPNT_DTL·행사 TM_MS_EVENT · 캠페인행사 참여 TD_MS_CRMN_PRTCPNT·행사 TM_MS_CRMN) → GOLD.FACT_EVENT_ATTENDANCE. 활성 지표: 참여자수·참여건수·고유
      참여회원수. 차원: 참여일·연·월, 행사명·**행사종류(일반행사/캠페인행사)**, **행사구분 라벨**·**참여상태 라벨**·**참여경로 라벨**·**참여채널 라벨**, 성별·회원상태·회원구분.
      행사/이벤트 참여 질문, **행사구분별·참여상태별·참여경로별·참여채널별 분해**에 사용. 🔴 **코드축이 아니라 라벨축으로 답한다**(현업은 코드를 모른다). 🔴🔴 **이
      팩트는 두 원천의 결합이고 구분·상태·경로 축은 원천마다 코드체계가 다르다** ⇒ 그 축으로 분해할 때는 **원천계열(PART_EVENT_KIND_NAME)을 반드시 동반**한다.
      🟢🟢 **[2026-08-12 O61] 판별자가 팩트로 옮겨졌다 — 「행사종류」가 아니라 「원천계열」을 동반하라.** 원천계열은 팩트가 원천 분기로 보유해 **전건 값을 가지며
      사각지대가 없다**(값 = 일반행사/캠페인행사). 🔴 **차원의 「행사종류」(EVENT_KIND_NAME)를 판별자로 쓰지 말 것** — 그것은 행사 마스터에서 오므로 **행사
      미매칭 구간에서는 ''(미매핑)'' 이 되어 계열을 알려주지 못한다**(종전 처방의 사각지대). ⚠️ 계열이 확정되는 것과 **어느 행사인지**가 확정되는 것은 다르다 —
      행사명·행사구분 등 차원 속성별 집계는 여전히 부분집합이며, 차원축 분해에서 ''(미매핑)'' 버킷이 나오면 별도 행으로 분리하고 코드 범위로 계열을 짐작해 단정하지 않는다.
      🔴🔴 **같은 의미가 두 라벨로 갈라져 나오는 축이 있다** — 참여경로는 일반행사가 영문(homepage 등)·캠페인행사가 한글(홈페이지 등)이고, 참여상태는 일반행사가
      영문 단계 라벨(Success·n_step_right/fail)·캠페인행사가 한글(신청·참여·불참·대기·취소)이다. 코드사전이 원천별로 다르게 등재한 결과이므로 **통합 라벨을
      만들어 답하지 말고**(라벨 창작 금지) 갈라진 채로 원천계열과 함께 제시한다. 사용자가 합친 값을 원하면 **어떤 라벨들을 합쳤는지 명시**한다. 🔴 **두 원천은 「참여」의
      정의가 다르다** — 일반행사는 다단계 이벤트의 단계 통과 여부, 캠페인행사는 신청/참여/불참이다. 두 계열을 합산해 하나의 참여율로 제시하지 말 것. 🔴 참여채널 NULL
      은 **두 가지가 섞여 있다** — 캠페인행사 참여 행은 원천에 채널 컬럼이 없어 **전량 NULL**(구조적 부재 · 원천 스캔 확인)이고, 일반행사 계열에도 **소수의
      NULL**(결측·오염값)이 있다. 채널별 분해에는 전자를 밝히고 남는 NULL 을 「전부 캠페인행사」로 단정하지 않는다. ⚠️ 참여 3축에는 원천 입력 오류값이 소수 있고
      그 행은 라벨 NULL 이다 — 정상 코드로 취급하거나 의미를 부여하지 말 것. ⚠행사 미매칭분이 Unknown(EVENT_SK=0)으로 라우팅되므로 행사명별 집계는 부분집합이다
      — 미매칭 비중이 필요하면 조회해 확인할 것. 🆕 [O193-B] 차원 추가: **본인참여 여부(SELF_PART_FLAG)**·**자기참여코드(SELF_PARTCPT_CD · MS060 동반자만/본인만/함께)**·**행사장소(CRMN_PLACE_NM)**·회원 문자수신 여부 · measure 추가: **동반참여수(TOTAL_COMPANION_CNT)**. 🔴 본인참여·자기참여코드·동반참여수·행사장소는 **캠페인행사 전용**이다(일반행사는 원천 컬럼 부재로 NULL) ⇒ 원천계열(PART_EVENT_KIND_NAME)을 동반하고 NULL 을 「본인 미참여」로 읽지 않는다. 🔴 동반참여수를 참여자수와 더해 총 인원을 만들지 않는다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_relation_activity
    description: '🆕 [O198 · DEC-58] 결연활동 팩트(FRA, grain=서신/선물금 활동 1행). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM(서신 TM_RM_RELATNSP_LETTER_INFO · 선물금 TM_RM_RELATNSP_GFTMNEY_INFO) → GOLD.FACT_RELATION_ACTIVITY.
      활성 지표: 결연활동(건) · 결연활동 고유 회원수(명) · 선물금(원). 차원: 활동일(서신=접수일 · 선물금=발송일)·연·월, **활동유형(서신/선물금)**, 서신구분·편지상태·선물구분 원천 코드, 온라인 작성 여부, 이관 여부, 회원 성별·현재 회원상태.
      「후원자가 아동에게 보낸 편지 건수」·「선물금 전달 건수·금액」·「서신/선물금 참여 회원수」에 사용. 🔴 서신과 선물금은 속성이 다르다 — 활동유형으로 나눠 답하고 두 계열 코드를 섞지 않는다.
      🔴 코드 축(서신구분·편지상태·선물구분·이관)은 라벨이 확정되지 않았다 — 코드 값을 그대로 보여주고 뜻을 지어내지 않는다. 🔴 회원상태는 현재 스냅샷이다(활동 시점 상태가 아니다).
      🔴 「발송 후 5일 안의 서신·선물금 반응」은 이 도구가 아니라 analyst_service 소관이다. 🔴 월별 회원수를 더해 기간 회원수를 만들지 않는다(중복).'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_dev_achievement
    description: '회원개발 **목표 대비 실적** 팩트(grain=월×부서×개발구분). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM(목표 TM_CM_MBER_DVLP_GOAL
      · 실적 TM_MM_FDRM_MBER_DVLP_AMT) → GOLD.FACT_MEMBER_DEV_ACHIEVEMENT. 🔴 **월/누계/연 목표 및 목표 달성율(정본 공#1·#2·#3)의 정본 도구**다. 활성 지표: 회원개발목표(건)
      · 개발실적(건) · 목표편성분 실적(건) · **목표 달성율(%)**. 차원: 연·월·연월, **부서명(실적부서)**, 개발구분(신규·증액·재후원), 목표편성여부, 실적발생여부.
      "월 목표"·"연 목표"·"누계 목표"·"목표 달성율"·"목표 대비 실적"·"부서별 달성율"·"목표를 못 채운 부서" 류 질문에 사용. 🟢 누계·연 전용 지표는 없고 필요하지도
      않다 — 기간 필터만 바꾸면 월(단월)·누계(1월~기준월)·연(연 전체)이 모두 나온다. 🔴 **달성율은 이 도구의 달성율 지표를 그대로 쓴다** — 실적을 목표로 직접 나누면
      목표 미편성 부서의 실적이 분자에 섞여 과대해진다. ⚠️CRM 에는 **목표를 0 으로 등록한 행이 많다** — 「목표 행이 있다」와 「목표가 편성됐다」가 다르므로 목표편성여부
      축으로 한정하고, 목표 0 구간은 달성율 0% 나 무한대가 아니라 "목표 미편성"으로 표기한다. 특히 증액·재후원은 최근 연도 목표가 0 으로 등록돼 그 기간 달성율이 나오지
      않는다(현업 확인 대기). ⚠️진행 중 연도는 실적이 일부 월까지만 있는데 목표는 12개월 전량 편성돼 달성율이 구조적으로 낮게 나온다 — 실적이 있는 최종월까지로 기간을
      맞추고 반영 기간을 밝힌다. ⚠️달성율이 0 에 가까운 부서는 조직 개편으로 목표만 남고 실적이 다른 부서로 귀속된 경우가 있다 — 「실적 부진」으로 단정하지 말 것. 🔴
      비활성(원천에 축 자체가 없다 — 창작 금지): **일별 목표**(월 단위만 편성 · 월 목표를 일수로 나누지 말 것) · **매체(브랜드2)별 목표** · **본부/지부·팀·법인별
      분해** · **캠페인·후원사업별 목표** · 예산구분(예산 도메인 소관). 🔴 부서별 개발 **건수**만 필요하면(특히 일 단위) analyst_member_event 를
      쓴다 — grain 이 달라 두 도구 수치를 더하거나 나누지 않는다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_member_fee
    description: '회비 분해 팩트(FMF, grain=**회원 × 회비월 × 후원사업 × 회비구분 × 납입유형 × 결제수단**). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM(회비청구·납입 TM_PM_MBRFEE_ACMSLT·TM_PM_DNTN_DTLS · 결제수단 TM_PM_SETLE_INFO · 후원사업 TM_CM_SPNSR_BSNS_INFO) → GOLD.FACT_MEMBER_FEE → WIDE_MEMBER_FEE.
      🔴 **후원사업·납입방식(결제수단)·회비구분·납입일별 회비 청구/납입/미납의 정본 도구**다. 활성 지표: 청구액·납입회비·총수납액·미납금액·납부율·미납비중·**고유 납입회원수(명)**·원천
      회비행수. 차원: 회비월·연·월·**납입일**, **후원사업(=납입 대상)**, **납입방식(결제수단)**·결제수단 원본코드, **회비구분(정기·선물금·일시·긴급구호)**,
      **납입유형(회비/기부금)**, 미납여부, 회원 속성(성별·회원상태·회원구분 · 현재 스냅샷), **획득 귀속축**(브랜드·가입캠페인·상위캠페인·홍보방법·마케팅캠페인·가입부서·획득
      후원사업·획득시점 연령대·지역). "후원사업별 회비/미납"·"납입방식별 납부율"·"회비구분별 금액"·"납입일 기준"·"캠페인별 회비(LTV)"·"납입 회원수(명)" 류 질문에
      사용. 🔴🔴 **analyst_member_monthly 와 한 표에 합산 금지** — 같은 원천을 다른 grain 으로 담은 형제 팩트라 합치면 청구·납입액이 과대계상된다(과대
      규모는 이슈원장 §O45 참조). 회원-월 요약·납부율 추이는 analyst_member_monthly, 회비 분해는 이 도구다. 둘 다 필요하면 **표를 분리**한다.
      🔴 「후원사업」은 세 축이다 — 이 도구=**납입 대상** · analyst_member_event=**개발 사건 시점** · analyst_member_cohort=**획득 시점**. 어느 축인지
      밝힌다. 🔴 「부서」는 이 도구의 가입부서=**획득 시점**이고 개발실적보고의 부서(analyst_member_event)=**사건 부서**다. ⚠️결제수단 라벨 커버리지가
      100% 가 아니어서(원천 11종 중 5종 코드그룹 미특정) 결제수단별 합계는 전체보다 작다 — 총계는 축 없이 답한다. ⚠️「명」은 고유 납입회원수 지표로만 답한다(행 수를
      명으로 쓰면 크게 과대). ⚠️미납·납부율은 조회 시점 스냅샷이며 「마감·확정」이라 단정하지 않는다. 🆕 [O205] 획득 캠페인 분류 8축 추가: 캠페인카테고리(=주요캠페인)·개발인입경로·국내해외·사업사례·공통브랜드·UTM(채움 낮음 · 부분집합)·세부캠페인 후원구분·세부캠페인 법인구분 — 모두 **획득 시점 동결값**이며 analyst_member_event 의 사건 시점 같은 이름 축과 다르다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_service_cohort
    description: '[O205] 서비스 수신 코호트(grain=회원 × 서비스그룹 × 수신연도 · 미수신은 연도 NULL 단일 행). 원천=CRM(eCRM·UMS) → GN_DW.BRONZE_CRM(알림톡 발송 TM_MS_MSG_AT_SNDNG·TD_MS_MSG_AT_SNDNG_DTLS · 개발사건 TM_MM_FDRM_MBER_DVLP_AMT · 중단 TM_MM_FDRM_MBER_SPNSR_DSCNTC · 행사 참여 TD_MS_EVENT_PRTCPNT_DTL·TD_MS_CRMN_PRTCPNT) → GOLD.WIDE_MEMBER_SERVICE_COHORT.
      발송·획득 코호트·중단·행사참여를 **회원 단위로 미리 결합**한 SV 다. 활성 지표: 회원수·일반행사(온라인 이벤트) 참여 회원수/참여율·캠페인행사(문화이벤트) 참여 회원수/참여율·평균 참여횟수(전체·수신 후)·D5 중단 회원수·평균 후원유지기간(획득일 → 최초 중단일 · 미중단은 오늘까지 · 「후원유지기간」 질문의 기본 지표)·이탈 회원 평균 유지기간(중단 회원만 · 후원유지기간으로 대신 쓰지 않는다)·중단 이력 비율·평균 약정금액(획득 시점)·D5 중단 회원 평균 후원기간(획득일 → 중단일 · 중단 사건 원천에 후원금액이 없어 중단 회원 후원금액은 획득 시점 약정금액으로 답한다).
      차원: 서비스그룹(4종 · 반드시 하나로 고정)·수신연도·수신여부·첫 수신일·D5 중단/증액 여부·D5 중단사유/중단경로/중단 후원사업·가입일·가입연도·가입캠페인·가입 상위캠페인·캠페인카테고리·개발인입경로·법인구분·획득 후원사업·획득 시점 연령대/지역/성별·중단 이력.
      「서비스 수신/미수신 참여율 비교」·「발송 후 5일 내 중단자 특성」·「연도별 수신회원 유지기간·참여횟수」 질문에 사용. 🔴 「선넘는좋은일 캠페인 가입」은 가입 상위캠페인 ILIKE ''%선넘는좋은일%'' 로 거른다.
      🔴 미수신 행은 수신연도가 NULL 이다 — 수신/미수신 비교에 연도 조건을 걸면 미수신이 사라진다. 🔴 「수신 회원」·「발송 후 5일 내 중단」 분석은 반드시 수신여부 = TRUE 로 거른다(거르지 않으면 획득 코호트 전체가 모수가 된다). 🔴 연도를 고정하지 않으면 한 회원이 여러 행이다 — 회원수는 중복제거 지표만 쓴다.
      🔴 D5 는 인과가 아니라 발송 다음날~+5일 시간창 매칭이다. 🔴 알림톡 「오픈」 원천은 없다 — 수신 기준으로 답한다. 🔴 수신·미수신 차이를 서비스 효과(인과)로 단정하지 않는다.
      ⚠️ 서비스그룹은 발송 제목 부분일치 임시 규칙이다(현업 확정 전) · 캠페인행사 참여는 수신 전후 구분 없이 전체 기간 값이다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_member_sponsor_biz
    description: '회원×후원약정 팩트(FMSB, grain=회원×후원사업번호 SPNSR_BSNS_NO). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM(후원약정 TM_MM_FDRM_MBER_SPNSR·후원사업약정 TM_MM_FDRM_MBER_SPNSR_BSNS · 개발사건(캠페인 귀속) TM_MM_FDRM_MBER_DVLP_AMT) → SILVER(CRM_MEMBER_SPONSOR_SPAN+CRM_MEMBER_DEV)
      → GOLD.FACT_MEMBER_SPONSORSHIP_SPAN. 🔴 **캠페인별/후원사업별 활동회원 수(지금 시점)의 정본 도구**다 — analyst_member_monthly
      의 캠페인 축은 회원grain 다중귀속(O8 미결)으로 전건 센티넬이라 분해가 안 되지만, 이 팩트는 약정(SPNSR_BSNS_NO) grain 이라 캠페인이 거의 1:1(다중은
      극소수·최대 2, 실측)이라 대표캠페인 규칙으로 분해 가능하다. 활성 지표: 지금 시점 활동회원수(CURRENTLY_ACTIVE_MEMBERS)·지금 시점 활동 약정금액·약정건수·고유회원수.
      차원: 후원사업(명·정기일시구분·약칭카테고리)·대표캠페인(명·카테고리)·다중캠페인여부·활동개시월·중단월. "캠페인별 활동회원"·"후원사업별 활동회원" 류 질문에 사용. 🔴🔴
      **전체 활동회원 수는 이 도구가 아니라 analyst_member_monthly 로 답한다** — 이 도구의 캠페인·후원사업별 합계는 다중후원 정상현상으로 전체 활동회원수보다
      클 수 있다(N 비가산, SUM 금지). 두 도구의 총계를 같다고 단정하지 말고 다르면 그 이유(다중후원)를 설명한다. 🔴 특정 과거월 as-of 질문에는 사전정의 지표가
      없다 — 원시축(활동개시월·중단월)으로 직접 조건을 구성해야 하므로 이 도구는 **지금 시점** 질문에만 쓴다. 대표캠페인은 결정적 규칙(신규사건 우선, 없으면 최초사건)으로
      정해졌으며 IS_MULTI_CAMPAIGN=TRUE 인 행이 있으면 다중이었다는 사실을 밝힌다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_ml_member_risk
    description: 'ML 회원단위 예측(중단·증액·충성 · grain=기준월×회원). 원천=GN_DW.ML(머신러닝 산출물) → SERVING.ML_MEMBER_RISK_V.
      🔴🔴 **예측치이며 실적이 아니다** — 다른 도구의 실적 measure 와 한 표에 합산하지 말 것. 🔴 머신러닝은 **테스트 단계**이며 모델·구조가 교체될 수 있다.
      활성 지표: 예측 대상 회원수·모델 중단/증액/충성 분류 회원수·확률 평균/최대·원천 중복 회원수(품질 점검용). 차원: 기준월(모델 실행월)·회원번호·모델 판정(중단/증액/충성)·예측보유
      플래그·**등급(O190 · 중단위험 고위험/주의/일반 · 장기회원 최상위/상/중/하 · 기준월 내 순위 구간)**. "중단 위험 회원"·"고위험군"·"이탈 가능성 높은 회원"·"증액 가능성"·"충성회원 예측" 류 질문에 사용.
      🔴🔴 **[O199] 원천 구조 교체로 회원상태·결제수단·법인구분·가입기간 등 회원 속성 축이 없다** — 그 축별 예측 분해를 물으면 SQL 을 만들지 말고 조회되지 않는다고 밝힌 뒤
      등급(CHURN_GRADE·LOYAL_GRADE)별 분해를 대안으로 안내한다. 🔴 **예측 지평(향후 몇 개월)을 숫자로 답하지 말 것** —
      원천의 테이블명은 12개월인데 원천 테이블 설명은 6개월이어서 부정합이 미해소다. 「예측 지평은 원천 확인 중」이라고 밝힌다. 🔴 **모집단이 전체 회원이 아니다**(예측 대상 회원만)
      ⇒ 「전 회원의 몇 %」는 산출 불가이며 분모를 반드시 밝힌다. 충성 예측은 더 좁은 부분집합이라 분모가 또 다르다. 🔴 **「위험 회원」으로
      단정하지 말 것** — 「고위험군」은 등급 축(순위 구간)으로 답하고 확률 임계로 바꿔 말하지 않는다 · 모델 판정은 「모델이 중단으로 분류한 회원」으로 표현한다. 🔴 회원수는 반드시 중복제거 지표를 쓴다.
      ⚠️ 원천이 같은 기준월에 회원당 확률이 다른 예측을 여러 행 담고 있어(실행순번 없음) 확률은 평균, 판정은 「하나라도 1」로 단일화한 값이다 — 원천 교정 시 수치가 변한다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_ml_sponsor_risk
    description: 'ML 후원건단위 이탈 예측(grain=기준월×회원×후원사업ID×후원사업번호). 원천=GN_DW.ML → SERVING.ML_SPONSOR_RISK_V.
      🔴🔴 예측치이며 실적이 아니다. 🔴 머신러닝은 테스트 단계다. 활성 지표: 예측 대상 후원건수·회원수·모델 이탈분류 건수/회원수·확률 평균/최대. 차원:
      기준월·회원번호·후원사업·후원사업번호·캠페인카테고리·모델 판정·이탈위험 등급(고위험/주의/일반 · 순위 구간 · O190). "카테고리별 이탈 예측"·"후원건 이탈 위험"·"어느 후원사업이 이탈 가능성이
      높은가" 류 질문에 사용. 🔴🔴 **[O199] 원천 구조 교체로 개별 캠페인·상위캠페인(채널)·결제수단 축과 이탈분류 후원금액이 없다** — 그것을 물으면 SQL 을 만들지 말고
      조회되지 않는다고 밝힌 뒤 캠페인카테고리별 분해를 안내한다. 🔴🔴 **grain 이 후원건이므로 「명」과 「건」을 구분한다** — 회원수는 중복제거 지표를 쓰고 건수와 섞지 않는다.
      🔴 **analyst_ml_member_risk 와 한 표에 합치지 말 것** — 회원당 후원건이 여러 개라 회원 지표가 과대계상된다. 🔴 예측 지평을 숫자로 답하지 말 것(원천 확인 중).
      🔴 업무 위험 임계값 미확정이므로 「모델이 이탈로 분류」로 표현한다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_ml_fee_forecast
    description: 'ML 캠페인카테고리별 회비(후원금액) 예측(grain=기준월×캠페인카테고리×예측월). 원천=GN_DW.ML → SERVING.ML_FEE_FORECAST_V.
      🔴🔴 예측치이며 실적이 아니다 — **회비 실적은 analyst_member_fee·analyst_member_monthly 소관**이고 이 도구와 한 표에 합산하지 말 것.
      🔴 머신러닝은 테스트 단계다. 🔴 **단위는 원이다.** 활성 지표: 예측 회비·신뢰구간 상/하한·월평균 예측·예측 개월수·카테고리수. 차원: 기준월(모델 실행월)·캠페인카테고리·예측월·예측연월.
      "향후 회비 예측"·"카테고리별 회비 전망"·"주요캠페인별 후원금액 예측" 류 질문에 사용. 🔴 **기준월과 예측월은 다른 축이다** — 여러 기준월을 합산하면 같은 예측월이
      중복계상된다. 연도 전망은 해당 연도의 예측월만 합산한다. ⚠️ 카테고리 일부는 원천 마스터에 이름이 없어 라벨이 NULL 이다 — 이름을 추정하지 말고 코드로 답한다. ⚠️
      예측 대상 카테고리가 전체 카테고리와 같다고 단정하지 말 것.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_ml_once_conversion
    description: 'ML 일시후원회원 → 정기후원 전환 예측(grain=기준월×일시후원회원 · 원천이 회원당 여러 예측행을 담는다). 원천=GN_DW.ML → SERVING.ML_ONCE_CONVERSION_V.
      🔴🔴 예측치이며 실적이 아니다. 🔴 머신러닝은 테스트 단계다. 활성 지표: 예측 대상 일시회원수·모델 전환분류 회원수·전환확률 평균/최대. 차원: 기준월(모델 실행월)·일시회원번호·모델 판정
      · 성별·회원구분·등록부서(현재 마스터 스냅샷 — 가입 시점 값 아님 · 등록부서는 실적부서가 아니다). "일시후원 회원의 정기 전환 가능성"·"정기후원으로 전환될 것 같은 일시회원" 류 질문에 사용.
      🔴🔴 **[O199] 관측월·가입월·가입경과월 축은 원천 교체로 폐기됐다** — 그 축을 물으면 조회되지 않는다고 밝힌다. 「현재」 질문은 최신 기준월 하나로 한정한다.
      🔴 회원수는 중복제거 지표로만 답한다(다중 예측행). 🔴 **일시회원번호는 정기회원번호와 체계가 달라** 다른 회원 도구와 조인하지 않는다. 🔴 예측 지평을
      숫자로 답하지 말 것. 🔴 업무 판정선 미확정이므로 「모델이 전환으로 분류」로 표현한다. 🔴 실제 전환 실적은 이 도구로 답하지 않는다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_mbrfee_prdt_actl
    description: '회원실 연간 회비 예측·실측(회원실 자체 수식 · 머신러닝 아님 · grain=월×예측실측구분×후원사업그룹×신규기존×본부지부그룹).
      원천=GN_DW.SILVER.ANNUAL_MBRFEE_PRDT_ACTL_DATA → GOLD.WIDE_MBRFEE_PRDT_ACTL. 🔴🔴 **예측행과 실측행이 함께 있다 — 예측/실측 구분을 반드시 고정하거나 나눠서 답한다.**
      활성 지표: 개발·중단·감액·후원사업변경감소 건수 · 조정 회비 · 회비 차액 · 누계(개발건수·회비·중단건수·활동회원) · 중단율·감액율·활동율·누계납입율. 차원: 월·예측실측구분·후원사업그룹·신규기존·본부지부그룹.
      "회원실 회비예측"·"연사업 회비 계획"·"추경 회비예측"·"회비 예측 대비 실측" 류 질문에 사용. 🔴 누계 지표는 한 기준월로만 답한다(월 합산 = 중복계상).
      🔴 비율은 합산하지 않는다. 🔴 머신러닝 회비 예측(analyst_ml_fee_forecast)·회비 실적(analyst_member_fee)과 한 표에 합산하지 않는다. 단위 = 건수는 건 · 금액은 원.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_spnsr_cls_aggr
    description: '회원실 회비예측 월간 후원 분류별 집계(회원실 자체 수식 · 머신러닝 아님 · grain=월×집계유형×법인×후원사업그룹×신규기존×본부지부그룹).
      원천=GN_DW.SILVER.MM_SPNSR_CLS_AGGR_DATA → GOLD.WIDE_SPNSR_CLS_AGGR. 활성 지표: 후원분류집계 예측값1·예측값2(예측값2 는 회비 유형에만 있다).
      차원: 월·집계유형(감액/개발/중단/활동/회비)·법인·후원사업그룹·신규기존·본부지부그룹. "후원 분류별 예측값"·"감액/중단/활동 분류 집계" 류 질문에 사용.
      🔴🔴 **집계유형을 반드시 하나로 고정하거나 유형별로 나눠 답한다** — 유형마다 값의 척도가 달라 섞어 합하면 의미가 없다. 🔴 단위는 원천에 기재되지 않았다 — 원·건을 붙이지 말고 「예측값」으로 표기한다.
      🔴 예측값1·2 의 산식을 추정해 설명하지 않는다. 🔴 머신러닝 예측 도구와 한 표에 합산하지 않는다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_dvlp_goal_acmslt
    description: '기획실 연간 개발 목표·실적 부서 집계(기획실 자체 수식 · 머신러닝 아님 · grain=월×부서구분×신규기존×후원사업그룹).
      원천=GN_DW.SILVER.ANNUAL_DVLP_GOAL_ACMSLT_AGGR_DATA → GOLD.WIDE_DVLP_GOAL_ACMSLT. 활성 지표: 목표 건수·실적 건수·실적월 목표 건수·달성률. 차원: 연·월·부서구분·신규기존·후원사업그룹.
      "기획실 기준 개발 목표 대비 실적"·"부서구분별·후원사업그룹별 연간 개발 목표" 류 질문에 사용. 🔴 단위는 건이다. 🔴 미도래 월 실적은 NULL 이다(0 아님) —
      달성률은 실적이 있는 월의 목표만 분모로 쓴다. 🔴🔴 **analyst_dev_achievement(GN_DW 부서별 월 목표·달성율 · CRM 원천)와 정의·부서 체계가 다르다** — 두 도구의 목표·실적을 한 표에 합산하지 않는다.
      질문이 「기획실 기준」·「후원사업그룹별」·「신규/기존별 연간 목표」이면 이 도구, 그 외 부서별 개발 목표·달성율은 analyst_dev_achievement 다. 🔴 ML 개발금액 예측(만원)과 섞지 않는다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_member_monthly_kpi
    description: '[O201-D] 월별 회원 KPI(grain=월×신규기존 · GOLD.WIDE_MEMBER_MONTHLY_KPI). 누계개발 = 당해년도 1월~조회월 개발(건) 합계(금액 기준 DEV_CUM_AMT_CNT).
      지표: 누계개발·활동률(공45 = 월말활동 ÷ (연초활동 + 누계개발))·신규 활동률(공46)·기존 활동률(공47). "누계개발"·"활동률"·"공45/46/47" 류 질문에 사용.
      🔴 비율은 합산하지 않는다. 🔴 공46 은 지표 사전 원문대로 누계개발 ÷ 활동이며 **100% 를 넘는 것이 정상이다**(2026-10-06 현업 확인) — 100% 초과를 오류로 설명하지 않는다. 🔴 월별 회원 일반 지표는 analyst_member_monthly 다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_ml_feature_importance
    description: '[O203 배선] ML 요인분석(피처 중요도) 2종(grain=기준월×분석유형×피처). 원천=GN_DW.ML → SERVING.ML_FEATURE_IMPORTANCE_V.
      🔴🔴 **측정 대상이 데이터가 아니라 모델이다** — 값은 0~1 기여도이며 금액·건수·회원수가 아니다(분석유형 내 합계=1). 다른 도구의 measure 와 같은 표에 넣지 않는다.
      🔴 머신러닝은 테스트 단계다. 활성 지표: 기여도 합계·평균·최대·피처수. 차원: 기준월·**분석유형**(CHANNEL_NEW_SPNSR 신규 후원 유치 요인 · DVLP_INC 증액 개발 요인)·피처명·순위·피처유형.
      "증액 요인"·"증액회원 특성 중 중요한 요인"·"신규 후원 유치 요인" 류 질문에 사용. 🔴🔴 **분석유형을 하나로 고정한다**(섞으면 합계가 1 을 넘는다).
      🔴🔴 **인과로 답하지 않는다** — 「모델이 이 요인에 가장 큰 상대 중요도를 부여했다」로 표현한다. 🔴 피처 목록은 사람이 지정한 후보다 — 지정되지 않은 요인을 「중요하지 않다」고 말하지 않는다.
      🔴 **개인별 증액 대상자 예측은 이 도구가 아니라 analyst_ml_member_risk(모델 증액 분류 회원)** 다. 🔴 상위 요인은 순위로 정렬한다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_member_status_asof
    description: '[O203 T8 2차] 과거 시점 회원상태(SCD2 상태 이력 · 1행 = 회원 × 상태 유효구간). 원천=CRM(eCRM) → BRONZE_CRM.TH_MM_FDRM_MBER_STNG_DTLS → SILVER.CRM_MEMBER_STATUS_HIST → GOLD.DIM_MEMBER_STATUS_HISTORY.
      활성 지표: 고유 회원수. 차원: 상태 시작일·종료일·현재여부·회원상태(13종)·회원상태 그룹·직전 회원상태·회원구분·성별·최초가입일·가입연도.
      「2025년 6월 말 기준 회원상태별 회원수」·「작년 말 미납 상태였던 회원 수」·「상태 전환(직전 → 현재)」 질문에 사용.
      🔴🔴 반드시 기준일 하나로 as-of 조건(EFFECTIVE_FROM <= 기준일 AND (EFFECTIVE_TO > 기준일 OR EFFECTIVE_TO IS NULL))을 건다 — 경계일 「>=」 는 회원 중복을 만든다.
      🔴🔴 이 도구의 「활동회원」(상태 라벨)은 월실적 KPI 활동회원(analyst_member_monthly)과 정의가 다르다(같은 달에도 두 값이 다르다 · 근거 = 05_17 머리 주석) — 「활동회원 수」 KPI 질문은 analyst_member_monthly 로 답하고 두 값을 비교·대체하지 않는다.
      🔴 회원 속성(성별·회원구분)은 현재 마스터 값이다.'
