    type: cortex_analyst_text_to_sql
    name: analyst_mstr_spnsr_dvlp
    description: '🆕 [O207] MSTR 정기회원 후원개발(개발 실적의 정본 · 현업 검증 로직). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM → GN_DW.MSTR(MSTR
      이관 프로시저) → SERVING.MSTR_SPNSR_DVLP_V·MSTR_DVLP_GOAL_V·MSTR_DVLP_YE_TREND_V. 활성 지표: 개발(건)(= 후원금액 ÷ 10,000 ·
      소수 4자리) · 개발(명)(비가산) · 후원금액(원) · 월 목표(건)·실적·목표 달성률(%) · 연 목표·마감월 누적 실적·연도말 개발 추세 참고치(건 · 모델 예측 아님)·연 목표 대비
      추세(%). 차원: 기준년월·개발구분·법인·구분_팀·본부/지부·팀/지부·부서·브랜드·상위캠페인·캠페인·홍보방법·후원사업·후원사업2·성별·연령대·신규기존구분·후원기간대·후원금액대·결제수단·회원구분·시도·후원약칭·중단/감액
      사유·직전캠페인. 🔴 MSTR 기준이다 — GN_DW 도구 수치와 한 표에 합산하지 않는다. 🔴 실질 목표는 신규만 있다. 🔴 개발구분 미지정 시 신규·증액·재후원으로 한정한다. 「신규 개발」의
      「신규」는 기본적으로 개발구분 = 신규로 해석하고, 사용자가 「신규/기존」을 명시할 때만 신규기존구분 축을 쓴다(O209).'
- tool_spec:
    description: '사업목표 팩트(WIDE_TARGET_BIZ, grain=월×목표유형×법인×팀×후원사업×원천 구분). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM(TM_CM_MBER_DVLP_GOAL_DIV)
      → SILVER.CRM_BIZ_TARGET → GOLD.FACT_TARGET_PROJECT. 활성 지표(단위별 · O190): 개발 목표 건수 · 월말활동회원 목표(명) · 정기회비 목표(원)
      · 목표율(비율). 차원: 연·월·연월, **목표유형(9종)**, 법인구분, 원천 팀명, 조직 경로, 후원사업(그룹), 신규/기존, 조직구분, 세부구분. "사업목표"·"후원사업 목표"·"회원개발
      목표"·"정기회비 목표"·"활동율/납입율 목표" 류 질문에 사용. 🔴🔴 **목표유형마다 단위가 다르다(건·명·원·비율) · 후원사업과 회원개발은 같은 개발 목표의 다른 분해다 — 두 유형을
      합산하지 말고 하나로 필터하거나 나란히 보여준다.** 🔴 추경 목표는 원천에 없다. 🔴 실적 대비 달성률은 이 도구로 만들지 않는다(실적 팩트와 교차 집계 불가 · 부서별 회원개발 달성률은
      회원 도메인 어시스턴트 소관).'
    name: analyst_target_biz
    type: cortex_analyst_text_to_sql
- tool_spec:
    description: '예산 팩트(FBD, grain=월×세세목). 원천=ERP 예산·실적 원장(GN_DW.BRONZE_ERP.BDGT_ACMSLT_LEDGER, 파일 업로드 적재). 활성 지표:
      편성예산(월)·집행예산(ERP)·집행율. 차원: 연/월, 세세목명·예산구분 · 🆕 예산단위(ERP 팀 6종 · CRM 조직과 다른 체계) · 개발인입경로(7종)(O198). 예산 편성/집행/집행율
      질문의 기본 도구. ⚠집행예산은 적재가 진행된 월까지만 값이 있어 연 합계 집행율은 분모 과대 — 집행 존재 월만 분모에 포함할 것. 비활성(적재 대기): 연 편성예산, 조직/캠페인별, ROI.
      🟢 [O191 · 현업 회신 42] 모금성비용은 **직접모금비1·직접모금비2 두 지표를 이름 그대로 나란히** 보여준다(하나로 단정 금지 · DIRECT_FUNDRAISING_COST_1·_2).'
    name: analyst_budget
    type: cortex_analyst_text_to_sql
- tool_spec:
    description: '광고 실적 팩트(WIDE_AD_COMBINED = FAP 코어 + 디지털·방송 위성 1:1 pre-join). 원천=대행사 일별 리포트(GN_DW.BRONZE_AGENCY:
      DGT_AD_CMPGN_DTLS·VIDEO_AD_CMPGN_DTLS·REBRDC_AD_CMPGN_DTLS) + GA4(외부 Python 적재로 GN_DW.SILVER.BIGQUERY_REFINED_DATA
      에 직접 적재된다 — BRONZE_BIGQUERY 는 테이블이 없다). 활성 지표: 광고비·노출수·클릭수·CTR(공9)·CVR(공10)·CRM개발건·개발단가(공7, 디지털)·조회수·매체잠재고객수
      / 인바운드콜·방송횟수·방송개발건·방송개발회원(방송 · VIDEO 는 일부 행) / GA 개발단가(공8, DIGITAL) · 재방송 개발단가(참고, REBROADCAST 전용). 차원: 실적일·연/월/분기,
      출처유형(DIGITAL/VIDEO/REBROADCAST)·기기유형(M/PC/(해당없음))·광고유형·소재유형·페이지유형·광고그룹(디지털)·채널사·시간대(VIDEO=구간 라벨·REBROADCAST=시각)·프로그램·스팟유형·CM위치·재방유형(REBROADCAST).
      ⚠디지털/방송 measure 상호배타 — AD_SOURCE_TYPE 필터 필수. ⚠개발단가(공7)는 원천 포맷 변경 이후 구간 산출 불가(경계 연월은 조회로 확인). ⚠재방송 개발단가(참고
      · 공8 아님)는 REBROADCAST 전용 — 방송 전체 지표 아님(개발건수는 O184 정정: VIDEO 도 보고). ⚠전환콜은 원천이 전건 비어 미노출. ⚠예산(analyst_budget)과
      원천이 달라 교차 집계 불가. [2026-08-06 O45] 차원 추가: **마케팅캠페인명 · 개발캠페인 수(팬아웃 경고축)** — 🔴 **마케팅캠페인별 광고비·노출·클릭·CTR·개발단가 분해가
      가능해졌다**(종전 "캠페인별 분해 불가" 서술은 회수됐다). ⚠️ 마케팅캠페인 축으로 그루핑하면 미도달 광고행이 (미매핑)으로 모여 **캠페인별 합계 < 전체 합계**다 — 총계는 축 없이
      답한다. 🔴 여전히 불가: **소재별 분해**(소재 연결키 부재) · **개발캠페인(개별 캠페인명)별 분해**(광고비 배분 규칙 부재 — 「개발캠페인 수」 축이 그 배수를 보여준다). 🔴 광고비
      ÷ CRM 개발실적(회원 팩트) 형태의 개발단가는 cross-fact 라 불가하며 이 도구의 개발단가는 **대행사 리포트 기준**이다. 🟢 [O191 · 현업 회신 46] **전년 대비 가능**
      — 디지털 광고는 2024-01 부터 연속 적재(「이전 데이터 없음」으로 답하지 말 것) · 월 집계를 전년 동월과 자기조인한다.'
    name: analyst_ad
    type: cortex_analyst_text_to_sql
- tool_spec:
    description: '회원 월별 실적 팩트(FMM, grain=월×회원). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM(회비청구·납입 TM_PM_MBRFEE_ACMSLT·TM_PM_DNTN_DTLS
      · 후원약정 TM_MM_FDRM_MBER_SPNSR · 증감액 TM_MM_FDRM_MBER_IRSD · 회원 TM_MM_FDRM_MBER_INFO·TM_MM_ONCE_MBER_INFO · 개발/중단
      롤업은 FACT_MEMBER_EVENT 경유) → GOLD.FACT_MEMBER_MONTHLY. 전사 요약용: 납입회비·청구금액·납부율·미납비중·평균납입회비, 월 롤업 개발/중단 총건, 미납회원수.
      차원: 연/월/분기, 성별·회원상태·회원구분. 전사 회비/실적 요약 질문에 사용. 🔴 [2026-08-05] **이 도구에는 개발 목표가 없다**(실적만 있다) — 개발건을 목표로 나눠 달성율을
      만들지 말 것. 부서별 월 목표 대비 실적·달성율은 **회원 도메인 어시스턴트(AGENT_MEMBER)** 의 전용 도구가 답한다. 🆕 [O193-B] 차원 추가: 회원 **문자수신 여부**(CHRCTR_RECPTN_YN
      · 현재 마스터 스냅샷 · 과거월 조회도 현재값 · NULL 은 미입력).'
    name: analyst_member_monthly
    type: cortex_analyst_text_to_sql
- tool_spec:
    description: '서비스 발송 팩트(FSE, grain=일×회원×서비스). 원천=CRM(UMS 발송) → GN_DW.BRONZE_CRM(발송요청 SND_REQ_MST·TM_MS_EMAIL_SNDNG·TM_MS_MSG_AT_SNDNG·TM_MS_PSTMTR_SNDNG
      · 발송대상·결과 SND_MEMBER_LIST·SND_MEMBER_OPEN_LOG·TD_MS_EMAIL_SNDNG_DTLS·TD_MS_MSG_AT_SNDNG_DTLS·TD_MS_PSTMTR_SNDNG_DTL
      · D5 서신·선물금 TM_RM_RELATNSP_LETTER_INFO·TM_RM_RELATNSP_GFTMNEY_INFO·TM_RM_RELATNSP_MSTR_INFO) → GOLD.FACT_MESSAGE_DISPATCH.
      전사 요약용: 발송수, 발송 대상 고유 회원수. 차원: 발송일·연·월, 서비스구분·채널, **발송상태 라벨(축A)**·**통신사 도달결과 라벨(축B)**. 전사 발송 규모 요약 질문에 사용.
      🔴 발송결과를 물으면 **코드축이 아니라 라벨축**으로 답하고, **두 축을 섞거나 합산하지 않는다**(축A=우리 발송 시스템 상태 · 축B=통신사 도달 결과). 🔴 라벨 NULL 은 결측이
      아니라 채널별 사전 라벨 부재·원천 부재이므로 **성공/실패·도달률을 전 채널 기준으로 단정하지 말고 채널과 NULL 버킷을 함께 밝힌다**. 🆕 [O193-B] 차원 추가: **대체문자 발송
      여부(ALTRTV_MSG_SNDNG_YN · 알림톡 MSG_AT 전용 · 원천 값은 Y 뿐)**·**확인여부(RESPONSED_YN · 문자 SND 전용 · Y/N)**·회원 문자수신 여부(현재
      마스터 스냅샷). 🔴 두 축은 해당 채널(CHANNEL)로 한정해 쓴다. 🔴 확인여부는 오픈(링크 클릭)과 다른 축이다 — 합산·비교해 하나의 반응률로 만들지 않는다.'
    name: analyst_service
    type: cortex_analyst_text_to_sql
- tool_spec:
    description: 'ML 개발금액 예측 2종 통합(전사·캠페인 · grain=기준월×계열유형×계열×예측월). 원천=GN_DW.ML → SERVING.ML_DVLP_FORECAST_V. 🔴🔴
      **예측치이며 실적이 아니다** — 예산·광고·회원 실적 measure 와 한 표에 합산하지 말 것. 🔴 머신러닝은 **테스트 단계**다. 🔴🔴 **단위는 만원이다** — 예산·회비 등 원
      단위 지표와 섞으면 10,000배 오차가 난다. 활성 지표: 예측 개발액·신뢰구간 상/하한·월평균 예측액·예측 개월수·계열수. 차원: 기준월(모델 실행월)·**계열유형(TOTAL 전사·CAMPAIGN
      캠페인)**·계열코드·계열명·예측월. "전사 개발금액 예측"·"캠페인별 월별 개발액 예측"·"연도말 개발 예측" 류 질문에 사용. 🔴🔴 **계열유형을 반드시 고정하거나 그룹에 넣는다** —
      넣지 않으면 전사와 캠페인을 겹쳐 세어 과대가 된다. 🔴🔴 **유형별 합계는 서로 일치하지 않는다**(계열별 독립 예측) — 캠페인 합이 전사 예측과 다르다(캠페인은 일부 계열). 한 유형으로
      다른 유형을 검산하지 말고, 불일치 지적에는 이 구조를 설명하며 임의로 비례배분해 맞추지 않는다. 🔴 부서별·후원사업별·신규/기존별 개발 예측 요청에는 원천 삭제로 미제공이라고 밝히고 다른
      값을 추정하지 않는다. 🔴 기준월과 예측월은 다른 축이며 여러 기준월 합산은 중복계상이다. ⚠️ 음수 예측치가 존재한다(감액·해지 반영) — 오류로 처리하거나 0 으로 바꾸지 말 것. ⚠️
      캠페인 계열은 일부 캠페인만 예측 대상이다. 🔴 **개발 목표·달성율은 이 도구에 없다** — 목표는 회원 도메인 어시스턴트(AGENT_MEMBER) 소관이며 예측을 목표로 나눠 달성율을 만들지
      말 것.'
    name: analyst_ml_dvlp_forecast
    type: cortex_analyst_text_to_sql
- tool_spec:
    description: 'ML LTV 월별 예측 2종(grain=기준월×LTV유형×계열×예측월). 원천=GN_DW.ML → SERVING.ML_LTV_FORECAST_V. 🔴🔴 예측치이며 실적이
      아니다. 🔴 머신러닝은 테스트 단계다. 🔴 단위는 원이다(개발금액 예측의 만원과 다르다). 활성 지표: 예측 평균·합계·신뢰구간·예측 개월수·계열수. 차원: 기준월·**LTV유형**·계열코드·계열명·예측월.
      "마케팅채널별 회원평균 후원금액 예측"·"채널별 LTV 예측"·"캠페인별 월간 후원금액 예측" 류 질문에 사용. 🔴🔴 **LTV유형을 반드시 하나로 고정한다** — ''MKTG_CHANNEL_AVG_MEMBER''는
      **마케팅채널의 회원 1인당 평균 후원금액** 예측이고 ''CMPGN_TOTAL''은 **캠페인의 월간 후원금액 총액** 예측이다. 의미·자리수·계열 축(마케팅채널 ↔ 캠페인)이 달라 두 유형을
      한 표에 섞거나 순위를 함께 매기면 반드시 틀린다. 🔴 「채널별」 질문은 MKTG_CHANNEL_AVG_MEMBER, 「캠페인별」 질문은 CMPGN_TOTAL 로 답한다(원천은 두 테이블 모두
      계열 컬럼을 채널로 이름 붙였으나 CMPGN_TOTAL 쪽 값은 캠페인코드다 · 원천 확인 중). 🔴 **회원평균 유형에서는 합산하지 않는다**(1인당 평균의 합은 의미가 없다) — 평균 지표를
      쓴다. 🔴 LTV 스코어·과거 누적 LTV·상위캠페인 LTV 는 원천 폐기(O198)로 제공하지 않는다 — 수치를 만들지 말고 이 도구의 월별 예측을 대안으로 안내한다.'
    name: analyst_ml_ltv_forecast
    type: cortex_analyst_text_to_sql
- tool_spec:
    description: 'ML 요인분석(피처 중요도) 2종(grain=기준월×분석유형×피처). 원천=GN_DW.ML → SERVING.ML_FEATURE_IMPORTANCE_V. 🔴🔴 **측정
      대상이 데이터가 아니라 모델이다** — 값은 0~1 기여도이며 금액·건수·회원수가 아니다(분석유형 내 합계=1). 다른 도구의 measure 와 같은 표에 넣으면 업무 수치로 오독된다. 🔴
      머신러닝은 테스트 단계다. 활성 지표: 기여도 합계·평균·최대·피처수. 차원: 기준월·**분석유형**(CHANNEL_NEW_SPNSR 신규 후원 유치 요인 · DVLP_INC 증액 개발 요인)·피처명·순위·피처유형.
      "신규 후원 유치 요인"·"증액 개발 요인"·"어떤 요인이 중요한가" 류 질문에 사용. 🔴🔴 **분석유형을 하나로 고정한다** — 유형 내 기여도 합계가 1 이므로 섞으면 합계가 1 을 넘고
      순위가 뒤섞인다. 🔴🔴 **인과로 답하지 않는다** — 「이 요인을 늘리면 신규 후원이 늘어난다」가 아니라 「모델이 이 요인에 가장 큰 상대 중요도를 부여했다」로 표현한다. 🔴🔴 **피처 목록은
      사람이 지정한 후보다**(피처유형 ''user_provided'' · 신규 후원 유치 요인은 원천에서 유형 컬럼이 제거돼 비어 있다 · O199) — 「데이터 분석으로 발견한 요인」이라 답하지
      말고, 지정되지 않은 요인을 「중요하지 않다」고 말할 수 없음을 밝힌다. 🔴 상위 요인은 순위로 정렬한다.'
    name: analyst_ml_feature_importance
    type: cortex_analyst_text_to_sql
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_budget_yearly
    description: '[O203 T8 2차] 연 예산 편성·집행(grain=연×부서×예산과목×예산절차). 원천=ERP → GN_DW.BRONZE_ERP.BDGT_ACMSLT_LEDGER →
      SILVER.ERP_BUDGET_YEARLY → GOLD.FACT_BUDGET_YEARLY. 활성 지표: 연 편성예산·연 집행예산·연 집행율(%). 차원: 예산연도(2024·2025·2026)·예산절차(2024·2025
      추가경정 · 2026 연사업)·세세목·예산단위. 「2024 연 편성예산」·「연도별 편성 대비 집행」 질문에 사용 — 🟢 2024 편성은 월 예산 도구(analyst_budget)에는 0 이고
      이 도구에만 있다. 🔴 연도를 고정하거나 연도별로 나눈다(연도 합산 금지). 🔴 2026 은 진행 중 연도라 집행·집행율이 부분 연도다. 🔴 월 예산 도구(analyst_budget)와 한
      표에 합산하지 않는다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_member_event
    description: '🆕 [O207] 개발 실적·목표·연도말 전망의 정본은 analyst_mstr_spnsr_dvlp(MSTR 기준)다 — 이 도구의 개발 지표는 MSTR 에 없는 축(캠페인카테고리·개발인입경로
      등)과 교차 분석용 보조이며 답변에 「GN_DW 기준」을 단다. 회원 상태전이 사건 팩트(FME, grain=일×회원×개발/중단 사건). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM(개발사건
      TM_MM_FDRM_MBER_DVLP_AMT · 중단 TM_MM_FDRM_MBER_SPNSR_DSCNTC · 캠페인 TM_CM_CMPGN_MNG · 회원 TM_MM_FDRM_MBER_INFO·TM_MM_ONCE_MBER_INFO)
      → GOLD.FACT_MEMBER_EVENT. 활성 지표: 개발/중단 건수, 개발/중단 고유 회원수, 증액/감액 금액·회원수. 차원: 사건일·연·월·주차·요일, **개발구분 5종(신규·증액·감액·재후원·후원중단)**,
      원천계통(DEV/STOP), **캠페인명·브랜드·유형·유입경로·국내해외**, **사건시점 연령대·지역**, 🆕 **후원사업(중단 행 = 끊은 사업) · 데려온 사업(획득 후원사업 · 병기 축
      · 합계 상이 · O190 L-2)**, 중단사유·중단경로, 가입일·중단일, 성별·회원상태·회원구분. 일/주간/요일·개발구분·고유회원수 질문, **캠페인별 분해**, **연령대·지역별 분해**,
      **중단사유·중단경로별 분해**에 사용. ⚠상태(증액·감액 등)는 원천계통이 아니라 개발구분으로 필터한다. ⚠캠페인·연령대·지역·사건시점성별은 개발(DEV) 전용, 중단사유·중단경로는 중단(STOP)
      전용이다. ⚠연령대·지역·사건시점성별은 **약정 시점** 값이며 현재 나이·현재 거주지가 아니다. [2026-08-05 확장] 차원 추가: **상위캠페인(주요캠페인)·홍보방법·사업사례구분·마케팅캠페인·사건시점
      성별**. measure 추가: **캠페인 귀속 중단건(TOTAL_CAMPAIGN_STOP_CNT)** — 캠페인 축으로 중단 규모를 분해할 때 이것을 쓴다(TOTAL_STOP_CNT 는 캠페인이
      전건 (미매핑)이다). 🔴 **캠페인별 중단 률(비율)은 이 도구가 아니라 analyst_member_cohort** 다 — 이 도구의 중단건을 개발건으로 나누면 모집단이 달라 100%를 넘는다.
      🔴 종전 "캠페인별 중단건은 산출 불가"라는 서술은 거짓이므로 회수됐다. [2026-08-05 O38] 차원 추가: **부서명(실적부서)** — 기획실 요건 「부서별 × 일자별 개발 건」이
      이 도구로 답이 난다. 🔴개발(DEV) 사건 전용이며 중단 행은 전건 (미매핑)이므로 「부서별 중단건」으로 쓰지 말 것. 🟢 [O191 · DEC-56] **본부/지부 = ORG_DIV_GROUP(구분)·ORG_DIV(단위)**
      — 이름과 코드(ORG_DIV_GROUP_CODE·ORG_DIV_CODE)를 함께 보여주고 동명 단위는 코드로 나눈다 · 현재 조직만은 IS_ACTIVE_ORG · 과거 실적부서는 옛 이름
      그대로. 🔴 팀·조직 계층 법인은 산출 불가(아래 세부캠페인 법인구분과 혼동 금지). 🟢 캠페인카테고리별 중단 명/건 = CAMPAIGN_STOP_MEMBER_COUNT·TOTAL_CAMPAIGN_STOP_CNT.
      🔴**부서별 목표 대비 실적·달성율은 이 도구가 아니라 analyst_dev_achievement** 다(목표는 이 SV 에 없다). [2026-08-28 O105] **차원 추가 4종**:
      **공통브랜드**(MM297)·**UTM**·**세부캠페인 후원구분**(CM035 정기후원/일시후원)·**세부캠페인 법인구분**(CM019 통합/사단/사복). 이로써 회원 개발이력 비정규화
      7속성 전부와 후원구분·법인구분이 회원 기준으로 집계된다. 🔴🔴 **이 9속성(캠페인카테고리·국내해외·사업사례구분·유입경로·마케팅캠페인·공통브랜드·UTM·후원구분·법인구분)은 캠페인 마스터
      실시간 조인이 아니라 적재 시점 동결값이다** — 캠페인이 나중에 정정·개칭돼도 과거 개발이력 사건의 값은 바뀌지 않는다. ⇒ 「현재 캠페인 분류 기준」을 묻는 질문에는 이 축으로 답할 수
      없음을 밝히고, 같은 축을 다른 표면(WIDE 뷰 등)에서 조회한 값과 다를 수 있다는 것을 전제로 단다. 🔴🔴 **「법인구분」은 두 축이며 서로 다른 것이다** — 이 도구의 세부캠페인 법인구분(CM019)은
      **산출 가능**하고, 위에 적은 조직 계층의 법인(ORG_CORP)은 컬럼이 전건 비어 있어 **불가**하다. 「법인별」 질문에 무조건 산출 불가로 답하지 말고 어느 축을 묻는지 먼저 확인한다.
      🔴 추가 4종은 모두 **개발(DEV) 사건 전용** — 중단(STOP) 행은 전건 NULL 이므로 「후원구분별 중단건」·「법인구분별 중단건」으로 쓰지 말 것. ⚠️ **UTM 라벨은 채움이
      낮다** — 코드는 있으나 원천 코드사전 미등재분이 다수다(결측이 아니라 미등재다) ⇒ 채움 비율을 기억으로 답하지 말고 도구로 조회해 확인한 뒤 UTM 별 분해가 부분집합임을 밝힌다. 🆕
      [O193-B] 차원 추가: 회원 **문자수신 여부**(CHRCTR_RECPTN_YN · 현재 마스터 스냅샷이며 사건 시점 값이 아니다 · NULL 은 미입력).'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_dev_achievement
    description: '🆕 [O207] 개발 실적·목표·연도말 전망의 정본은 analyst_mstr_spnsr_dvlp(MSTR 기준)다 — 이 도구의 개발 지표는 MSTR 에 없는 축(캠페인카테고리·개발인입경로
      등)과 교차 분석용 보조이며 답변에 「GN_DW 기준」을 단다. 회원개발 **목표 대비 실적** 팩트(grain=월×부서×개발구분). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM(목표
      TM_CM_MBER_DVLP_GOAL · 실적 TM_MM_FDRM_MBER_DVLP_AMT) → GOLD.FACT_MEMBER_DEV_ACHIEVEMENT. 🔴 **월/누계/연 목표 및 목표
      달성율(정본 공#1·#2·#3)의 정본 도구**다. 활성 지표: 회원개발목표(건) · 개발실적(건) · 목표편성분 실적(건) · **목표 달성율(%)**. 차원: 연·월·연월, **부서명(실적부서)**,
      개발구분(신규·증액·재후원), 목표편성여부, 실적발생여부. "월 목표"·"연 목표"·"누계 목표"·"목표 달성율"·"목표 대비 실적"·"부서별 달성율"·"목표를 못 채운 부서" 류 질문에 사용.
      🟢 누계·연 전용 지표는 없고 필요하지도 않다 — 기간 필터만 바꾸면 월(단월)·누계(1월~기준월)·연(연 전체)이 모두 나온다. 🔴 **달성율은 이 도구의 달성율 지표를 그대로 쓴다** —
      실적을 목표로 직접 나누면 목표 미편성 부서의 실적이 분자에 섞여 과대해진다. ⚠️CRM 에는 **목표를 0 으로 등록한 행이 많다** — 「목표 행이 있다」와 「목표가 편성됐다」가 다르므로
      목표편성여부 축으로 한정하고, 목표 0 구간은 달성율 0% 나 무한대가 아니라 "목표 미편성"으로 표기한다. 특히 증액·재후원은 최근 연도 목표가 0 으로 등록돼 그 기간 달성율이 나오지 않는다(현업
      확인 대기). ⚠️진행 중 연도는 실적이 일부 월까지만 있는데 목표는 12개월 전량 편성돼 달성율이 구조적으로 낮게 나온다 — 실적이 있는 최종월까지로 기간을 맞추고 반영 기간을 밝힌다. ⚠️달성율이
      0 에 가까운 부서는 조직 개편으로 목표만 남고 실적이 다른 부서로 귀속된 경우가 있다 — 「실적 부진」으로 단정하지 말 것. 🔴 비활성(원천에 축 자체가 없다 — 창작 금지): **일별 목표**(월
      단위만 편성 · 월 목표를 일수로 나누지 말 것) · **매체(브랜드2)별 목표** · **본부/지부·팀·법인별 분해** · **캠페인·후원사업별 목표** · 예산구분(예산 도메인 소관).
      🔴 부서별 개발 **건수**만 필요하면(특히 일 단위) analyst_member_event 를 쓴다 — grain 이 달라 두 도구 수치를 더하거나 나누지 않는다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_ml_fee_forecast
    description: 'ML 캠페인카테고리별 회비(후원금액) 예측(grain=기준월×캠페인카테고리×예측월). 원천=GN_DW.ML → SERVING.ML_FEE_FORECAST_V. 🔴🔴 예측치이며
      실적이 아니다 — **회비 실적은 analyst_member_fee·analyst_member_monthly 소관**이고 이 도구와 한 표에 합산하지 말 것. 🔴 머신러닝은 테스트 단계다.
      🔴 **단위는 원이다.** 활성 지표: 예측 회비·신뢰구간 상/하한·월평균 예측·예측 개월수·카테고리수. 차원: 기준월(모델 실행월)·캠페인카테고리·예측월·예측연월. "향후 회비 예측"·"카테고리별
      회비 전망"·"주요캠페인별 후원금액 예측" 류 질문에 사용. 🔴 **기준월과 예측월은 다른 축이다** — 여러 기준월을 합산하면 같은 예측월이 중복계상된다. 연도 전망은 해당 연도의 예측월만
      합산한다. ⚠️ 카테고리 일부는 원천 마스터에 이름이 없어 라벨이 NULL 이다 — 이름을 추정하지 말고 코드로 답한다. ⚠️ 예측 대상 카테고리가 전체 카테고리와 같다고 단정하지 말 것.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_mbrfee_prdt_actl
    description: '회원실 연간 회비 예측·실측(회원실 자체 수식 · 머신러닝 아님 · grain=월×예측실측구분×후원사업그룹×신규기존×본부지부그룹). 원천=GN_DW.SILVER.ANNUAL_MBRFEE_PRDT_ACTL_DATA
      → GOLD.WIDE_MBRFEE_PRDT_ACTL. 🔴🔴 **예측행과 실측행이 함께 있다 — 예측/실측 구분을 반드시 고정하거나 나눠서 답한다.** 활성 지표: 개발·중단·감액·후원사업변경감소
      건수 · 조정 회비 · 회비 차액 · 누계(개발건수·회비·중단건수·활동회원) · 중단율·감액율·활동율·누계납입율. 차원: 월·예측실측구분·후원사업그룹·신규기존·본부지부그룹. "회원실 회비예측"·"연사업
      회비 계획"·"회비 예측 대비 실측" 류 질문에 사용(「추경」은 구분 축이 없어 계산 전 확인 대상 · O207-C). 🔴 누계 지표는 한 기준월로만 답한다(월 합산 = 중복계상). 🔴 비율은
      합산하지 않는다. 🔴 머신러닝 회비 예측(analyst_ml_fee_forecast)·회비 실적(analyst_member_fee)과 한 표에 합산하지 않는다. 단위 = 건수는 건 · 금액은
      원.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_spnsr_cls_aggr
    description: '회원실 회비예측 월간 후원 분류별 집계(회원실 자체 수식 · 머신러닝 아님 · grain=월×집계유형×법인×후원사업그룹×신규기존×본부지부그룹). 원천=GN_DW.SILVER.MM_SPNSR_CLS_AGGR_DATA
      → GOLD.WIDE_SPNSR_CLS_AGGR. 활성 지표: 후원분류집계 예측값1·예측값2(예측값2 는 회비 유형에만 있다). 차원: 월·집계유형(감액/개발/중단/활동/회비)·법인·후원사업그룹·신규기존·본부지부그룹.
      "후원 분류별 예측값"·"감액/중단/활동 분류 집계" 류 질문에 사용. 🔴🔴 **집계유형을 반드시 하나로 고정하거나 유형별로 나눠 답한다** — 유형마다 값의 척도가 달라 섞어 합하면 의미가
      없다. 🔴 단위는 원천에 기재되지 않았다 — 원·건을 붙이지 말고 「예측값」으로 표기한다. 🔴 예측값1·2 의 산식을 추정해 설명하지 않는다. 🔴 머신러닝 예측 도구와 한 표에 합산하지 않는다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_dvlp_goal_acmslt
    description: '🆕 [O207] 개발 실적·목표·연도말 전망의 정본은 analyst_mstr_spnsr_dvlp(MSTR 기준)다 — 이 도구의 개발 지표는 MSTR 에 없는 축(캠페인카테고리·개발인입경로
      등)과 교차 분석용 보조이며 답변에 「GN_DW 기준」을 단다. 기획실 연간 개발 목표·실적 부서 집계(기획실 자체 수식 · 머신러닝 아님 · grain=월×부서구분×신규기존×후원사업그룹).
      원천=GN_DW.SILVER.ANNUAL_DVLP_GOAL_ACMSLT_AGGR_DATA → GOLD.WIDE_DVLP_GOAL_ACMSLT. 활성 지표: 목표 건수·실적 건수·실적월 목표
      건수·달성률. 차원: 연·월·부서구분·신규기존·후원사업그룹. "기획실 기준 개발 목표 대비 실적"·"부서구분별·후원사업그룹별 연간 개발 목표" 류 질문에 사용. 🔴 단위는 건이다. 🔴 미도래
      월 실적은 NULL 이다(0 아님) — 달성률은 실적이 있는 월의 목표만 분모로 쓴다. 🔴🔴 **analyst_dev_achievement(GN_DW 부서별 월 목표·달성율 · CRM 원천)와
      정의·부서 체계가 다르다** — 두 도구의 목표·실적을 한 표에 합산하지 않는다. 질문이 「기획실 기준」·「후원사업그룹별」·「신규/기존별 연간 목표」이면 이 도구, 그 외 부서별 개발 목표·달성율은
      analyst_dev_achievement 다. 🔴 ML 개발금액 예측(만원)과 섞지 않는다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_member_monthly_kpi
    description: '[O201-D] 월별 회원 KPI(grain=월×신규기존 · GOLD.WIDE_MEMBER_MONTHLY_KPI). 누계개발 = 당해년도 1월~조회월 개발(건) 합계(금액
      기준 DEV_CUM_AMT_CNT). 지표: 누계개발·활동률(공45 = 월말활동 ÷ (연초활동 + 누계개발))·신규 활동률(공46)·기존 활동률(공47). "누계개발"·"활동률"·"공45/46/47"
      류 질문에 사용. 🔴 비율은 합산하지 않는다. 🔴 공46 은 지표 사전 원문대로 누계개발 ÷ 활동이며 **100% 를 넘는 것이 정상이다**(2026-10-06 현업 확인) — 100% 초과를
      오류로 설명하지 않는다. 🔴 월별 회원 일반 지표는 analyst_member_monthly 다.'
