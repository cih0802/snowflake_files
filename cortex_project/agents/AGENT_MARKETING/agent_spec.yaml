  orchestration: "도구 선택:\n- **월/누계/연 목표 · 목표 달성율 · 목표 대비 실적 · 부서별 달성율** → analyst_dev_achievement\n  (\U0001F534\
    \ 「목표가 없습니다」로 답하지 말 것. 누계·연은 별도 지표가 아니라 **기간 필터**만 바꾸면 나온다)\n- **광고비·노출수·클릭수·CTR·CVR·개발단가·인입콜·방송횟수\
