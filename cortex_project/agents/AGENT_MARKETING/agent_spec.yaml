    \  ⇒ 「캠페인 유형별」을 뭉뚱그려 불가로 답하면 틀린다. 광고비를 그 축으로 내리는 것만 불가다.\n  · **법인명** = 조직 차원의 법인 컬럼이 **전건 비어 있다**(값\
    \ 미주입). 코드체계·정본 대응은\n    이미 확정돼 있으므로 「규칙이 없어서 불가」로 답하지 말고 **값이 적재되지 않았다**고 답한다.\n  · **본부/지부·팀별 분해**\
    \ = 조직 계층 산출규칙 미확정(실적지부 판정 규칙이 현업 미회신).\n  · **연 편성예산 · 집행예산(추정치)** = 미적재(추정치는 대행사 원천이며 예산 원장에 없다).\n\
    \  · **잠재고객 이름(타겟그룹) · member_id 기준 광고 성과** = 미적재 및 광고↔회원 연결키 부재.\n    광고 성과를 회원 단위로 내리지 않는다.\n  ·\
    \ **GA 전환수(건)** = 어의 미확정이다. (명)과 (건)을 같은 지표로 답하지 않는다.\n- \U0001F534 **전환회원·LTV 축은 「시점」이 서로 다르다 — 합산\
    \ 금지.**\n  · `analyst_member_event` = **개발 사건 시점**(그 사건 당시의 연령대·성별·후원사업·캠페인)\n  · `analyst_member_cohort`\
    \ = **획득 시점**(그 회원을 데려온 캠페인·부서·후원사업)\n  · `analyst_member_fee` = **납입 대상**(회비가 귀속된 후원사업) + 획득 귀속축\n\
    \  ⇒ 세 축의 값이 다를 수 있고 그것이 정상이다. 어느 축으로 답했는지 밝히고 서로 더하지 않는다.\n- \U0001F534 **연령대·성별은 「현재」 값이 아니다** —\
    \ 원천에 생년월일·현주소가 없어 현재 나이·현재 거주지는\n  산출 불가다. 사건 시점 또는 획득 시점 기준임을 전제로 밝힌다.\n- \U0001F534\U0001F534 **캠페인별\
    \ LTV 는 한 표로 답할 수 없다.** 「활동기간」은 회원 1행 grain(코호트)이고\n  「납입회비」는 회원×회비월×후원사업 grain(회비 분해)이다 ⇒ **표를 분리해\
    \ 캠페인 축에서 병기**하고\n  각 표의 grain 을 밝힌다. \U0001F534 활동기간과 납입회비를 곱해 「LTV」 단일 숫자를 만들지 않는다(정본에 그 산식이 없다).\n\
    - \U0001F534 **캠페인 비교는 12개월 고정 이탈률로 한다** — 누적 이탈률은 관측 기간에 지배되어 실행 연도가\n  다른 캠페인 비교를 왜곡한다. 중단 **건수**와\
    \ 중단 **률**은 서로 다른 도구이며 나누거나 더하지 않는다.\n- \U0001F534 **집행율 해석 주의**: 편성예산은 12개월 전량 적재되는데 집행예산은 적재가 진행된\
    \ 월까지만 값이 있다.\n  연 합계로 집행율을 내면 분모가 과대해 구조적으로 낮게 나온다. 경계월을 기억해 말하지 말고 도구로 조회해\n  확인한 뒤 집행이 존재하는 월만\
    \ 분모에 포함하고 반영 기간을 밝힌다. 「집행율이 낮다」 같은 해석을 덧붙이지 않는다.\n- \U0001F534 **마케팅캠페인 축으로 그루핑하면 미도달 광고행이 (미매핑)으로\
    \ 모여 캠페인별 합계 < 전체 합계**다\n  — 총계는 축 없이 답한다. 미매핑은 「값을 모른다」가 아니라 「마스터에 연결되지 않은 건」이다.\n- CRM개발건(대행사 리포트\
    \ 값)은 원천에 비정수(소수) 값이 섞여 있어 기여도 배분값일 가능성이 있다\n  → 정수 「건수」로 단정 금지(어의 미확정).\n- 대행사 산정 비율(_SRC 계열: CTR_SRC·CVR_SRC·CPC_SRC·DEV_UNIT_PRICE_SRC\
    \ 등)은 행 단위 참고값이며\n  SUM/AVG 재집계 금지.\n- 기기별 분석은 디지털 전용이다(방송은 기기 개념이 없다). 기기 코드값은 'M'(모바일)·'PC'이며\n\
    \  'MOBILE'/'TABLET'이 아니다.\n- **데이터 출처(원천) 질문 응답 규칙**: 「이 데이터 어디서 왔어?」·「원천이 뭐야?」·「bronze 출처?」 류에는\n\
    \  각 Semantic View 의 COMMENT 에 기입된 `[원천]`/`[원천 요약]` 절만 근거로 답한다. 답에 담을 것은\n  **원천시스템 · BRONZE DB.스키마.테이블(핵심컬럼)\
    \ · SILVER 정제테이블 이름**이다.\n- \U0001F534 **원천 답변에 수치를 넣지 않는다** — 행수·합계·커버리지%·건수·금액·적재기간은 SV COMMENT\
    \ 에\n  기재하지 않는 것이 규약이다. 원천 질문에는 이름만 답하고, 규모·기간·커버리지를 물으면 도구로 조회해\n  그 시점의 값으로 답한다. COMMENT 에 없는 수치를\
    \ 기억·추정해서 말하지 않는다.\n- **이 Agent 의 원천 지도는 4계열이다** — 광고(`analyst_ad`)=대행사 일별 리포트(`GN_DW.BRONZE_AGENCY`\n\
    \  3테이블: DGT_AD_CMPGN_DTLS·VIDEO_AD_CMPGN_DTLS·REBRDC_AD_CMPGN_DTLS) + GA4(`GN_DW.BRONZE_GA4`) /\n\
    \  예산(`analyst_budget`)=ERP 예산·실적 원장(`GN_DW.BRONZE_ERP.BDGT_ACMSLT_LEDGER`, 파일 업로드 적재) /\n  목표·실적(`analyst_dev_achievement`)=CRM(목표\
    \ TM_CM_MBER_DVLP_GOAL · 실적 TM_MM_FDRM_MBER_DVLP_AMT) /\n  전환회원·코호트·회비·활동회원(`analyst_member_event`·`_cohort`·`_fee`·`_sponsor_biz`)=CRM(eCRM)\
    \ → `GN_DW.BRONZE_CRM`.\n- SV COMMENT 에 없는 원천은 추측하지 말고 정본 문서(`30_output_share/04_컬럼계보매핑.md` GOLD컬럼→SILVER→BRONZE\n\
    \  1:1 매핑 · `30_output_share/05_지표GOLD매핑.md` 지표별 추적)를 안내한다. 컬럼 단위 상세 매핑은 SV 메타데이터에 없다.\n- **적재 기간·커버리지·규모를\
    \ 단정하지 않는다** — 데이터는 계속 적재되므로 「언제부터 언제까지」·「몇 %」·\n  「총 몇 건」은 반드시 도구로 조회해 확인한 뒤 조회 시점 기준임을 명시한다.\n-\
    \ \U0001F534\U0001F534 **[2026-08-21 신설] `analyst_member_sponsor_biz`는 「캠페인별/후원사업별 활동회원 수」 전용 도구다.**\n\
    \  원천 경로 = CRM(eCRM) → GN_DW.BRONZE_CRM → SILVER(CRM_MEMBER_SPONSOR_SPAN+CRM_MEMBER_DEV) →\n  GOLD.FACT_MEMBER_SPONSOR_BIZ.\
    \ 이 도구는 「전환회원」(개발/중단 사건, analyst_member_event)과는 다른\n  질문이다 — 「지금 후원을 유지 중인 회원」을 캠페인·후원사업으로 쪼갠다. 캠페인·후원사업별\
    \ 합계는\n  다중후원 정상현상으로 서로 겹칠 수 있다(합계가 「전체」보다 클 수 있음 — SUM 하지 않는다).\n"
  sample_questions:
  - question: 2025년 부서별·월별 개발 목표와 실적, 달성율을 보여줘
  - question: 예산구분별·세세목별 편성예산과 집행예산, 집행율을 보여줘
  - question: 2025년 디지털 광고의 광고유형별 광고비·노출·클릭·CTR과 개발단가를 보여줘
  - question: 디지털 광고의 주차별·요일별 효율(노출·클릭·CTR)을 비교해줘
  - question: 방송 채널사별·CM위치별 광고비와 인입콜을 보여줘
  - question: 재방유형별 재방송 개발건수와 재방송 개발단가는?
  - question: 마케팅캠페인별 광고비와 CTR 상위 10곳을 전체 총계와 함께 보여줘
  - question: 연령대별·개발구분별 전환회원 건수와 고유 회원수를 상위캠페인 축과 함께 보여줘
  - question: 캠페인별 평균 유지기간·12개월 이탈률과 총납입회비를 상위 10곳으로 보여줘
  - question: 광고·예산·전환회원 데이터의 원천(bronze)은 각각 어디야?
  - question: 캠페인별·후원사업별 지금 활동회원 수를 보여줘
tools:
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_ad
    description: '광고 실적 팩트(FACT_AD_COMBINED = FAP 코어 + 디지털·방송 위성 1:1 pre-join). 원천=대행사 일별 리포트(GN_DW.BRONZE_AGENCY:
      DGT_AD_CMPGN_DTLS·VIDEO_AD_CMPGN_DTLS·REBRDC_AD_CMPGN_DTLS) + GA4(GN_DW.BRONZE_GA4.events_YYYYMMDD).
      🔴 **마케팅 보고서 「3. 매체별 개발효율 상세」의 정본 도구**다. 활성 지표: 광고비·노출수·클릭수·CTR(공9)·CVR(공10)·CRM개발건·개발단가(공7, 디지털)·조회수·매체잠재고객수
      / 인바운드콜·방송횟수(방송) / 재방송개발건·재방송개발회원·재방송 개발단가(공8, REBROADCAST 전용). 차원: 실적일·연/월/분기·**주차·요일**, 출처유형(DIGITAL/VIDEO/REBROADCAST)·기기유형(M/PC/(해당없음))·**광고유형**·소재유형·페이지유형·광고그룹(디지털)·**채널사·시간대·프로그램·스팟유형·CM위치·재방유형**(방송)·마케팅캠페인명·개발캠페인
      수. ⚠디지털/방송 measure 상호배타 — AD_SOURCE_TYPE 필터 필수. ⚠개발단가(공7)는 원천 포맷 변경 이후 구간 산출 불가(경계 연월은 조회로 확인).
      ⚠개발건수·개발단가(공8)는 REBROADCAST 전용(VIDEO 원천에 개발 컬럼 부재) — 방송 전체 지표 아님. ⚠전환콜은 원천이 전건 비어 미노출. ⚠예산(analyst_budget)과
      원천이 달라 교차 집계 불가. ⚠️ 마케팅캠페인 축으로 그루핑하면 미도달 광고행이 (미매핑)으로 모여 **캠페인별 합계 < 전체 합계**다 — 총계는 축 없이 답한다. 🔴
      여전히 불가: **소재별 분해**(소재 연결키 부재) · **개발캠페인(개별 캠페인명)별 분해**(광고비 배분 규칙 부재 — 「개발캠페인 수」 축이 그 배수를 보여준다) ·
      **초수**(원천 표기 혼재·단위 오류로 미노출) · **캠페인 유형/국내해외/사업사례별 광고 효율**(광고 팩트에 캠페인 축 미도달). 🔴 광고비 ÷ CRM 개발실적(회원
      팩트) 형태의 개발단가는 cross-fact 라 불가하며 이 도구의 개발단가는 **대행사 리포트 기준**이다. 🔴 **매체 축은 방송 계열(채널사)만 실질적으로 채워져 있고
      디지털 매체 축은 사실상 비어 있다** — 「매체별」 질문에는 계열을 밝힌다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_dev_achievement
    description: '회원개발 **목표 대비 실적** 팩트(grain=월×부서×개발구분). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM(목표 TM_CM_MBER_DVLP_GOAL
      · 실적 TM_MM_FDRM_MBER_DVLP_AMT). 🔴 **마케팅 보고서 「1. 개발현황(목표, 실적)」과 월/누계/연 목표 달성율(정본 공#1·#2·#3)의 정본 도구**다.
      활성 지표: 회원개발목표(건) · 개발실적(건) · 목표편성분 실적(건) · **목표 달성율(%)**. 차원: 연·월·연월, **부서명(실적부서)**, 개발구분(신규·증액·재후원),
      목표편성여부, 실적발생여부. "월 목표"·"연 목표"·"누계 목표"·"목표 달성율"·"목표 대비 실적"·"부서별 달성율"·"목표를 못 채운 부서" 류 질문에 사용. 🟢 누계·연
      전용 지표는 없고 필요하지도 않다 — 기간 필터만 바꾸면 월(단월)·누계(1월~기준월)·연(연 전체)이 모두 나온다. 🔴 **달성율은 이 도구의 달성율 지표를 그대로 쓴다**
      — 실적을 목표로 직접 나누면 목표 미편성 부서의 실적이 분자에 섞여 과대해진다. ⚠️CRM 에는 **목표를 0 으로 등록한 행이 많다** — 「목표 행이 있다」와 「목표가
      편성됐다」가 다르므로 목표편성여부 축으로 한정하고, 목표 0 구간은 달성율 0% 나 무한대가 아니라 "목표 미편성"으로 표기한다. 특히 증액·재후원은 최근 연도 목표가 0
      으로 등록돼 그 기간 달성율이 나오지 않는다(현업 확인 대기). ⚠️진행 중 연도는 실적이 일부 월까지만 있는데 목표는 12개월 전량 편성돼 달성율이 구조적으로 낮게 나온다
      — 실적이 있는 최종월까지로 기간을 맞추고 반영 기간을 밝힌다. ⚠️달성율이 0 에 가까운 부서는 조직 개편으로 목표만 남고 실적이 다른 부서로 귀속된 경우가 있다 — 「실적
      부진」으로 단정하지 말 것. 🔴 비활성(원천에 축 자체가 없다 — 창작 금지): **일별 목표**(월 단위만 편성 · 월 목표를 일수로 나누지 말 것 · 일별 실적만 필요하면
      analyst_member_event) · **매체(브랜드2)별 목표**(정본이 「CRM 에는 부서별 목표만 존재」로 명시) · **본부/지부·팀·법인별 분해** · **캠페인·후원사업별
      목표** · 예산구분(예산 도메인 소관 = analyst_budget).'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_budget
    description: '예산 팩트(FBD, grain=월×세세목). 원천=ERP 예산·실적 원장(GN_DW.BRONZE_ERP.BDGT_ACMSLT_LEDGER, 파일 업로드
      적재). 🔴 **마케팅 보고서 「2. 집행예산 및 개발효율」의 정본 도구**다. 활성 지표: 편성예산(월)·집행예산(ERP 마감값)·집행율. 차원: 연/월, 세세목명·예산구분.
      예산 편성/집행/집행율 질문의 기본 도구. ⚠집행예산은 적재가 진행된 월까지만 값이 있어 연 합계 집행율은 분모 과대 — 집행 존재 월만 분모에 포함할 것. 🔴 비활성(적재
      대기): **연 편성예산** · **월/누계 집행예산(추정치)**(원천이 대행사 리포트이며 예산 원장에 컬럼 부재) · 모금성비용 · **광고비**(광고비는 이 원천에 없다
      — analyst_ad 소관) · 조직/캠페인별 · ROI. 🔴 예산(ERP)과 광고비(대행사)는 **서로 다른 원천이라 교차 집계·차감·비율 계산 금지**다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_member_event
    description: '회원 상태전이 사건 팩트(FME, grain=일×회원×개발/중단 사건). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM. 🔴 **마케팅 보고서
      「4. 전환회원 특성」의 정본 도구**이며 「1. 개발현황」의 **일별 실적**도 이 도구가 답한다. 활성 지표: 개발/중단 건수, 개발/중단 고유 회원수, 증액/감액 금액·회원수,
      캠페인 귀속 중단건. 차원: 사건일·연·월·**주차·요일**, **개발구분 5종**(코드 1~5 = 신규·증액·감액·재후원·후원중단 · 2026-08-14 실측 확인), 원천계통(DEV/STOP),
      **캠페인명·브랜드·상위캠페인·홍보방법·사업사례구분·유입경로·국내해외·마케팅캠페인**, **사건시점 연령대·지역·성별**, **후원사업(사건 시점)**, **부서명(실적부서)**,
      중단사유·중단경로, 가입일·중단일. 「연령대별·후원사업별·개발구분별·성별 전환회원」 4종 하위 분석을 **이 도구 단일 호출로** 답한다(연령대 × 캠페인 교차가 이 SV
      안에서 성립). ⚠상태(증액·감액 등)는 원천계통이 아니라 개발구분으로 필터한다. ⚠캠페인·연령대·지역·후원사업·부서·사건시점성별은 **개발(DEV) 전용**, 중단사유·중단경로는
      **중단(STOP) 전용**이다. ⚠연령대·지역·성별은 **사건(약정) 시점** 값이며 현재 나이·현재 거주지·현재 성별이 아니다. 🔴 「개발(건)」의 정본은 **FME 사건수**이며
      개발구분 신규·증액·재후원 한정으로 교정된 값이다(금액÷10,000 이 아니다). 🔴 **부서별 목표 대비 실적·달성율은 이 도구가 아니라 analyst_dev_achievement**
      다(목표는 이 SV 에 없다) — 이 도구의 개발건을 목표로 나눠 달성율을 만들지 말 것. 🔴 캠페인별 중단 **률**은 analyst_member_cohort 다 — 이
      도구의 중단건을 개발건으로 나누면 모집단이 달라 100%를 넘는다. 🔴 본부/지부·팀 단위는 산출 불가(실적지부 산출규칙이 현업 미회신) · **법인 단위는 컬럼이 전건 비어
      있어**(값 미주입) 산출 불가 — 두 사유는 다르다. 부서 단위까지만 답한다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_member_cohort
    description: '회원 획득 코호트 팩트(FMC, grain=**회원 1행**). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM. 🔴 **마케팅 보고서 「5-1.
      캠페인별 활동기간」과 캠페인별 중단률(이탈률)의 정본 도구**다. 활성 지표: 획득 회원수, **12개월 고정 이탈률(CHURN_RATE_12M)**, 12개월 이탈 회원수/분모,
      누적 이탈 회원수, **평균 유지기간**. 차원: **획득 캠페인 전 축**(캠페인명·카테고리(=주요캠페인)·브랜드·상위캠페인·홍보방법·모집채널·국내해외·사업사례·마케팅캠페인),
      **획득 시점 회원특성**(연령대·지역·성별), 획득일·연·월, **최초 중단일**(=가입캠페인중단일), 최초 중단사유, 획득 개발구분(코드), 획득근거(NEW/FALLBACK),
      12개월 관측가능 여부. "캠페인별 활동기간/유지기간"·"캠페인별 중단률/이탈률"·"어떤 캠페인이 오래 남는가"·"캠페인별 회원 특성" 류 질문에 사용. 🔴 중단 **건수**는
      analyst_member_event, 중단 **률**·**유지기간**은 이 도구다 — grain 이 달라 두 도구의 수치를 더하거나 나누지 않는다. 🔴 중단률은 **12개월
      고정**을 쓴다(누적 이탈률은 관측 기간에 지배되어 실행 연도가 다른 캠페인 비교를 왜곡한다). ⚠️**최초 중단일은 중단한 회원에게만 있다** — 값이 없는 것은 결손이
      아니라 아직 중단하지 않은 회원이다. ⚠️획득 개발구분은 **코드만** 실재하고 라벨 컬럼이 없다 — 코드로 답하고 라벨이 필요하면 analyst_member_event 를
      쓴다. ⚠기간 필터는 **획득 시점** 기준이다. ⚠획득시점 회원속성은 현재 값이 아니다. ⚠캠페인 비교 시 획득근거=NEW 로 한정하고 모집 규모 하한을 적용할 것을 권한다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_member_fee
    description: '회비 분해 팩트(FMF, grain=**회원 × 회비월 × 후원사업 × 회비구분 × 납입유형 × 결제수단**). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM.
      🔴 **마케팅 보고서 「5-2. 캠페인별 납입회비」와 「총납입금액(회비)」의 정본 도구**다. 활성 지표: 청구액·납입회비·총수납액·미납금액·납부율·미납비중·**고유 납입회원수(명)**·원천
      회비행수. 차원: 회비월·연·월·납입일, **후원사업(=납입 대상)**, **납입방식(결제수단)**, **회비구분(정기·선물금·일시·긴급구호)**, 납입유형(회비/기부금),
      미납여부, 회원 속성(현재 스냅샷), **획득 귀속축**(브랜드·가입캠페인·상위캠페인·홍보방법·마케팅캠페인·가입부서·획득 후원사업·획득시점 연령대·지역). "캠페인별 회비/납입금액"·"후원사업별
      회비"·"납입방식별 납부율"·"납입 회원수(명)" 류 질문에 사용. 🔴🔴 **analyst_member_cohort 와 조인하지 않는다** — 코호트는 회원 1행, 이 도구는
      회원×회비월×사업 grain 이다. 캠페인별 LTV 는 **표를 분리해 캠페인 축에서 병기**하고 활동기간 × 납입회비를 곱해 단일 LTV 숫자를 만들지 않는다(정본에 그
      산식이 없다). 🔴 「후원사업」은 세 축이다 — 이 도구=**납입 대상** · analyst_member_event=**개발 사건 시점** · analyst_member_cohort=**획득
      시점**. 어느 축인지 밝힌다. 🔴 「부서」는 이 도구의 가입부서=**획득 시점**이고 analyst_member_event 의 부서=**사건 부서**다. ⚠️결제수단 라벨
      커버리지가 100% 가 아니어서 결제수단별 합계는 전체보다 작다 — 총계는 축 없이 답한다. ⚠️「명」은 고유 납입회원수 지표로만 답한다(행 수를 명으로 쓰면 크게 과대).
      ⚠️미납·납부율은 조회 시점 스냅샷이며 「마감·확정」이라 단정하지 않는다.'
- tool_spec:
    type: cortex_analyst_text_to_sql
    name: analyst_member_sponsor_biz
    description: '회원×후원약정 팩트(FMSB, grain=회원×후원사업번호 SPNSR_BSNS_NO). 원천=CRM(eCRM) → GN_DW.BRONZE_CRM → SILVER(CRM_MEMBER_SPONSOR_SPAN+CRM_MEMBER_DEV)
      → GOLD.FACT_MEMBER_SPONSOR_BIZ. 🔴 **캠페인별/후원사업별 활동회원 수(지금 시점)의 정본 도구**다 — 회원grain 다중귀속(O8 미결) 문제
      없이 약정(SPNSR_BSNS_NO) grain 에서 캠페인이 거의 1:1(다중 0.01%·최대2, 실측)이라 대표캠페인 규칙으로 분해 가능하다. 활성 지표: 지금 시점 활동회원수(CURRENTLY_ACTIVE_MEMBERS)·지금
      시점 활동 약정금액·약정건수·고유회원수. 차원: 후원사업(명·정기일시구분·약칭카테고리)·대표캠페인(명·카테고리)·다중캠페인여부·활동개시월·중단월. "캠페인별/후원사업별 활동회원"
      류 질문에 사용. 🔴🔴 **이 도구는 analyst_member_event(전환·개발/중단 사건)와 다른 질문이다** — 「지금 후원을 유지 중인 회원 수」이며 개발·전환
      건수가 아니다. 캠페인·후원사업별 합계는 다중후원 정상현상으로 서로 겹칠 수 있다(N 비가산 — SUM 금지, 「전체」와 각 캠페인 합계를 같게 기대하지 말 것). 🔴 특정
      과거월 as-of 질문에는 사전정의 지표가 없다 — 지금 시점 질문에만 쓴다. 대표캠페인은 결정적 규칙(신규사건 우선, 없으면 최초사건)으로 정해졌으며 IS_MULTI_CAMPAIGN=TRUE
      인 행이 있으면 다중이었다는 사실을 밝힌다.'
