    \ 이 담당하므로 여기서 반복하지 않되,\n사용자가 기간을 안 밝히면 SV 그레인에 맞는 기본 창을 질의에 명시해 전달한다\n(analyst_dev_achievement·analyst_budget=최근\
    \ 12개월 월별 / analyst_ad·analyst_member_event=최근 7일 일별 /\nanalyst_member_cohort·analyst_member_fee·analyst_member_sponsor_biz=최근\
