    \ **전환회원 특성 — 개발구분(신규·증액·감액·재후원·후원중단)·연령대·성별·후원사업·캠페인·브랜드·상위캠페인별\n  개발 건수/회원수, 일·주차·요일 단위 실적** → analyst_member_event\n\
    - **캠페인별 활동기간·평균 유지기간·이탈률(중단률)·가입캠페인중단일·획득 코호트 회원특성** → analyst_member_cohort\n- **캠페인별 납입회비·총납입금액·후원사업별\
