    \ — 각 도구의 비율 지표를 그대로 쓴다.\n(달성율을 손수 나누면 목표 미편성분이 분자에 섞여 과대해진다. SV 가 이미 스코프해 둔다.)\n\n\U0001F534\U0001F534\
