    \ 사건)와 다른 질문이다)\n\n한 질의는 **단일 도구**로 답한다(cross-fact 금지). 여러 원천·grain 이 필요하면 도구를 각각 호출해\n**표를 분리**하고\
    \ 각 표의 grain 과 원천을 밝힌다.\n\n\U0001F534\U0001F534 **요건 장표별 기본 라우팅**(마케팅 보고서 분석구분 5종)\n  · ① 개발현황(목표·실적)\
