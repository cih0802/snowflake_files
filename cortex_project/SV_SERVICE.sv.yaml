name: SV_SERVICE
description: 'Phase-1 서비스 발송 SV(base FSE). 활성: 발송수·고유 발송회원수, 서비스구분/발송상태/발송일별. 시간=전체가능.
  비활성(적재 대기): 수신/성공/실패/오픈(SUCCESS/FAIL/OPEN=0), 서신/선물금/증액 참여·+5일 코호트(D5_*=0, 신31~53),
  캠페인별(CAMPAIGN_SK=0).'
tables:
  - name: DATE
    synonyms:
      - 날짜
      - 발송일
    description: 일 차원.
    base_table:
      database: GN_DW
      schema: GOLD
      table: DIM_DATE
    primary_key:
      columns:
        - DATE_SK
    dimensions:
      - name: CAL_MONTH
        synonyms:
          - 월
        description: 월(1~12)
        expr: date.MONTH
        data_type: "NUMBER(2,0)"
      - name: CAL_YEAR
        synonyms:
          - 연도
          - 년
        description: 연도
        expr: date.YEAR
        data_type: "NUMBER(4,0)"
      - name: SEND_DATE
        synonyms:
          - 발송일
          - 일자
        description: 발송일
        expr: date.FULL_DATE
        data_type: DATE
  - name: FSE
    synonyms:
      - 발송
      - 서비스 발송
      - 문자메일 발송
    description: "서비스 발송 팩트(38.47M). ⚠(DATE_SK,MEMBER_DK,SERVICE_SK) 실측 비유일(distinct\
      \ 36,651,766) → PK 미선언(기저 FACT·집계 무해, 2026-07-22)."
    base_table:
      database: GN_DW
      schema: GOLD
      table: FACT_SERVICE_EVENT
    dimensions:
      - name: SEND_STATUS
        synonyms:
          - 발송상태
        description: 발송 상태
        expr: fse.SEND_STATUS
        data_type: VARCHAR(16777216)
    metrics:
      - name: DISTINCT_SEND_MEMBERS
        synonyms:
          - 발송 고유회원수
          - 수신 대상 회원수
        description: 발송 대상 고유 회원수. D(distinct). 다기간 중복 방지.
        expr: COUNT(DISTINCT fse.MEMBER_DK)
        access_modifier: public_access
      - name: TOTAL_SEND_MEMBERS
        synonyms:
          - 발송수
          - 발송 건수
          - 발송 회원수
        description: 발송수 합계. F(가산).
        expr: SUM(fse.SEND_MEMBERS)
        access_modifier: public_access
  - name: MEMBER
    synonyms:
      - 회원
    description: 회원 현재 스냅샷. fan-out 차단용 helper 뷰.
    base_table:
      database: GN_DW
      schema: SERVING
      table: DIM_MEMBER_CURRENT
    primary_key:
      columns:
        - MEMBER_DK
    dimensions:
      - name: GENDER
        synonyms:
          - 성별코드
        description: 성별 원천 코드값(F/M/U). 표기·집계는 GENDER_NAME(여성/남성) 사용 권장.
        expr: member.GENDER
        data_type: VARCHAR(16777216)
      - name: MEMBER_STATUS
        synonyms:
          - 회원상태코드
          - 상태코드
        description: 회원상태 원천 코드값(1~12). 표기·집계는 MEMBER_STATUS_NAME/MEMBER_STATUS_GROUP
          사용 권장.
        expr: member.MEMBER_STATUS
        data_type: VARCHAR(16777216)
      - name: MEMBER_TYPE
        synonyms:
          - 회원구분코드
          - 구분코드
        description: 회원구분 원천 코드값(1/2/3). 표기·집계는 MEMBER_TYPE_NAME(개인/기업/단체) 사용 권장.
        expr: member.MEMBER_TYPE
        data_type: VARCHAR(16777216)
      - name: MEMBER_TYPE_NAME
        synonyms:
          - 회원구분
          - 구분
          - 회원유형
          - 개인기업단체
        description: '회원구분명(한글): 개인/기업/단체. 원천 코드 MM018. 코드가 아닌 이 라벨로 집계·표기.'
        expr: member.MEMBER_TYPE_NAME
        data_type: VARCHAR(16777216)
      - name: MEMBER_STATUS_NAME
        synonyms:
          - 회원상태
          - 상태
          - 회원현황
        description: '회원상태명(한글): 활동회원/신규미납1~5/장기미납1~5/후원중단. 현재 스냅샷 기준. 원천 코드 MM010.
          코드가 아닌 이 라벨로 집계·표기.'
        expr: member.MEMBER_STATUS_NAME
        data_type: VARCHAR(16777216)
      - name: MEMBER_STATUS_GROUP
        synonyms:
          - 회원상태분류
          - 상태분류
          - 상태대분류
          - 정상미납중단
        description: '회원상태 대분류: 정상(활동)/미납(신규·장기미납)/중단(후원중단)/미상. 요약 집계용.'
        expr: member.MEMBER_STATUS_GROUP
        data_type: VARCHAR(16777216)
      - name: GENDER_NAME
        synonyms:
          - 성별
          - 성
          - 남녀
        description: '성별명(한글): 여성/남성/미상. 코드가 아닌 이 라벨로 집계·표기.'
        expr: member.GENDER_NAME
        data_type: VARCHAR(16777216)
  - name: SERVICE
    synonyms:
      - 서비스
      - 서비스구분
      - 발송채널
    description: 서비스 차원(A3 SERVICE_SK 99.97% 커버). 미매칭=Unknown(SK=0).
    base_table:
      database: GN_DW
      schema: GOLD
      table: DIM_SERVICE
    primary_key:
      columns:
        - SERVICE_SK
    dimensions:
      - name: CHANNEL
        synonyms:
          - 채널
          - 발송채널
        description: 발송 채널(CRM_UMS/ADMIN 등)
        expr: service.CHANNEL
        data_type: VARCHAR(16777216)
      - name: SUBTYPE
        synonyms:
          - 서비스유형
          - 발송소분류
        description: 서비스 subtype
        expr: service.SUBTYPE
        data_type: VARCHAR(16777216)
relationships:
  - name: FSE_TO_DATE
    left_table: FSE
    right_table: DATE
    relationship_columns:
      - left_column: DATE_SK
        right_column: DATE_SK
  - name: FSE_TO_MEMBER
    left_table: FSE
    right_table: MEMBER
    relationship_columns:
      - left_column: MEMBER_DK
        right_column: MEMBER_DK
  - name: FSE_TO_SERVICE
    left_table: FSE
    right_table: SERVICE
    relationship_columns:
      - left_column: SERVICE_SK
        right_column: SERVICE_SK
