# cortex_project 매니페스트 — Cortex Agent 아티팩트 등록
#
# 🔴 **정본 경로는 `agents/<AGENT>/agent_spec.yaml` 하나다** (2026-08-05 O38 정리).
#    이유: 실제 배포가 `05_SV-Agent_ai/09_2_AGENT_버전업.sql` 의
#      ALTER AGENT … ADD VERSION FROM 'snow://…/cortex_project/agents/<AGENT>'
#    로 이 **디렉터리**를 stage 에서 직접 읽기 때문이다. 라이브 Agent 가 되는 파일이 정본이다.
#    · 파일명은 반드시 `agent_spec.yaml` (공식 문서의 `agent.yaml` 예시는 부정확 — 틀리면
#      "No spec file present for the agent" 로 실패한다. 2026-07-31 실측)
#
# ⚠️ 종전에 루트에 있던 `AGENT_MEMBER.agent.yaml` · `AGENT_OVERALL.agent.yaml` 은
#    **`_archive/` 로 이관됐다**(2026-08-05). 정본이 아니다 — 복원하지 말 것.
#    · `AGENT_MEMBER.agent_STALE_20260804.yaml` = 도구 4개·샘플 8개로 **O33 이전 판본**
#      (정본은 도구 6개·샘플 19개). 이 파일을 근거로 재배포하면 O33·O35·O37·O38 규칙이 전부 소실된다.
#    · `AGENT_OVERALL.agent_DUPLICATE_20260804.yaml` = `agents/AGENT_OVERALL/agent_spec.yaml` 과
#      **byte-identical 중복**이었다(내용 손실 없음).
#    → 정본이 두 경로로 선언돼 서로 모순이던 상태를 해소했다. 인용처는 P62-B 로 전수 회수했다.
#
# 🔴 **배포는 이 매니페스트로 하지 않는다.** 아래 경로는 `cortex_agent_read`(source=workspace)
#    같은 **조회** 편의를 위한 등록이다. `cortex_agent_save`/`cortex_agent_deploy` 는
#    **live 버전**을 만드는데, 이 프로젝트는 **명명 버전 방식**(VERSION$n)이고
#    `ADD VERSION FROM` 은 live 가 존재하면 **거부**된다.
#    → Agent 스펙 변경 시 절차: ① `agents/<AGENT>/agent_spec.yaml` 갱신
#       ② `ALTER WORKSPACE … COMMIT`(stage 노출) ③ `09_2_AGENT_버전업.sql` 실행
#       ④ `ALTER AGENT … SET DEFAULT_VERSION = 'VERSION$n'` (발행만으로 default 가 되지 않는다 — P66)
version: 1
artifacts:
  - path: agents/AGENT_MEMBER/agent_spec.yaml
    type: cortex_agent
    targets:
      default:
        object: GN_DW.SERVING.AGENT_MEMBER
  - path: agents/AGENT_OVERALL/agent_spec.yaml
    type: cortex_agent
    targets:
      default:
        object: GN_DW.SERVING.AGENT_OVERALL
