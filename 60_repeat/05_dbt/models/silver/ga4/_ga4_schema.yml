version: 2

# SILVER GA4 모델 — PK 정의 + inter-model relationships (DBTERD ERD 생성용 포함)
# 실행: dbt test --select silver.ga4
#
# 🔄 [2026-08-19 O87] 계열 구조가 바뀌었다 — BIGQUERY_REFINED_DATA(기반) + GA4_* 5(파생).
#    · 종전 머리말 「GA4_IDENTITY 는 enabled=false (비활성)」은 **stale** 이었다 —
#      2026-07-15(ID-활성)에 활성화·배선 완료됐고 dbt_project.yml 에 enabled:false 가 없다.
#      그 문장만 남아 있어 다음 작업자가 「비활성이니 안 봐도 된다」고 오독할 수 있었다 ⇒ 삭제.
#    · GA4-PK-1 해소로 GA4_EVENT PK 4번째 키가 BATCH_ORDERING_ID → EVENT_SEQ 로 교체됐다.
#
# 🔴🔴 [2026-08-19 O88] **PK 조합 유일성은 이 파일이 검사하지 않는다** — singular test 소관이다.
#    왜 여기 적어 두나: 아래 `not_null` 4개를 보고 「PK 가 검사되고 있다」고 오독할 수 있다.
#    `not_null` 4개는 **조합 유일성을 전혀 증명하지 않는다.** Snowflake 는 `08` DDL 의
#    `PRIMARY KEY` 선언도 강제하지 않으므로(informational) 그 축은 게이트가 **없었다**.
#    ⇒ 신설 = `tests/assert_ga4_pk_unique.sql`(ERROR · 두 테이블 4키 조합).
#    ⇒ 신설 = `tests/warn_ga4_base_row_reconciliation.sql`(WARN · BRONZE↔기반 접힌 양 노출
#       = `GA4-SEQ-1` ① 선결의 기계 구현).
#    ⚠️ 둘 다 **재실행 간 순번 안정성**(`GA4-SEQ-1` 본체)은 잡지 못한다 — 그것은 두 run 의
#       결과 대조가 필요하고 단일 시점 테스트의 범위가 아니다. 통과를 해소로 읽지 말 것.
#
# 🔄 [2026-08-21] BIGQUERY_REFINED_DATA 는 이제 dbt 모델이 아니다(외부 Python 이 GN_DW.SILVER.
#    BIGQUERY_REFINED_DATA 를 118컬럼 평탄화만으로 직접 적재) — 신설 `GA4_BASIC`(dbt) 이 그 파생
#    (EVENT_DT·EVENT_SEQ·ID_SCHEME·DEVICE_TYPE·UTM/XCHAN 등)을 되살린다. GA4_* 5종은 다시
#    ref('GA4_BASIC') 으로 읽는다. 원천 not_null 테스트(USER_PSEUDO_ID/EVENT_TIMESTAMP/
#    EVENT_NAME)는 `_sources.yml` silver_external 소관, 파생 컬럼 테스트는 아래 GA4_BASIC 소관.
models:
  # ── 재파생 기반 1종 (유일 입력 = source('silver_external', 'BIGQUERY_REFINED_DATA')) ──
  - name: GA4_BASIC
    columns:
      - name: USER_PSEUDO_ID
        tests: [not_null]
      - name: EVENT_TIMESTAMP
        tests: [not_null]
      - name: EVENT_NAME
        tests: [not_null]
      - name: EVENT_SEQ
        tests: [not_null]
      - name: EVENT_DT
        tests: [not_null]
      - name: ID_SCHEME
        description: >
          🔴 매칭 분모의 정본 — MBER_NO·ONCE_MBER_NO 만 CRM 조인 대상이고
          APP·EMAIL·INVALID·UNCLASSIFIED 는 회원번호가 아니다(GA4-LEN-1).
        tests:
          - accepted_values:
              values: ['MBER_NO','ONCE_MBER_NO','APP','EMAIL','INVALID','UNCLASSIFIED']
              config: { where: "ID_SCHEME IS NOT NULL", severity: warn }

  # ── 파생 5종 (유일 입력 = ref('GA4_BASIC')) ──────────────────────────────
  - name: GA4_EVENT
    columns:
      - name: USER_PSEUDO_ID
        tests: [not_null]
      - name: EVENT_TIMESTAMP
        tests: [not_null]
      - name: EVENT_NAME
        tests:
          - not_null
          - relationships: { to: ref('GA4_EVENT_DIM'), field: EVENT_NAME }
      # 🔄 [O87] BATCH_ORDERING_ID not_null 제거 — 그 컬럼은 원천 events_20240719 부터 생겼고
      #    2024-01-01~07-18(199일 · 48,862,926행 = 17.10%)에는 없다. not_null 을 유지하면
      #    전 기간 적재가 그 구간에서 실패한다(GA4-PK-1 의 발화 지점). PK 는 EVENT_SEQ 가 받는다.
      - name: EVENT_SEQ
        tests: [not_null]
      - name: EVENT_DT
        tests: [not_null]

  - name: GA4_EVENT_DIM
    columns:
      - name: EVENT_NAME
        tests: [not_null]   # unique 제거(순서9-C): grain=(event_name×cat×label×action) 브리지 → event_name 다중행 정상. GOLD DIM_GA_EVENT 가 (cat,label,action) distinct 추출. GA4_EVENT relationships 는 존재성만 요구.

  - name: GA4_DEVICE
    columns:
      - name: DEVICE_TYPE
        tests: [not_null]

  - name: GA4_TRAFFIC_SOURCE
    # grain = 세션 last-click 트래픽소스 DISTINCT. 안정적 단일 not_null 자연키 없음(모든 UTM/XCHAN NULL 가능) → 컬럼 테스트 없음.

  - name: GA4_IDENTITY
    columns:
      - name: USER_PSEUDO_ID
        tests: [not_null]
      - name: ID_SCHEME
        description: >
          🔴 이 컬럼이 매칭 분모의 정본이다 — MBER_NO·ONCE_MBER_NO 만 CRM 조인 대상이고
          APP·EMAIL·INVALID 는 회원번호가 아니다(GA4-LEN-1). 채움률을 계산할 때
          분모에 뒤 3종을 넣으면 조용히 과소 보고된다.
        tests: [not_null]
      - name: MBER_NO
        tests:
          - relationships:
              to: ref('CRM_MEMBER')
              field: MEMBER_DK
              config: { where: "MBER_NO IS NOT NULL", severity: warn }   # 순서9-B: 회원 마스터 미완전 고아 정책 일관(warn). 전량입고 후 제거
