version: 2

# BRONZE 원천 선언 (순서 7, 2026-07-14 실측: CRM/ERP/AGENCY 전량 적재 완료).
#
# 🔴🔴 [2026-08-19 O87] GA4 source 선언이 신설됐다 — 종전 「동적조회라 선언하지 않음」은 폐기.
#    종전 기재(역사 기록): *"GA4(BRONZE_BIGQUERY.events_YYYYMMDD 샤드)는 ga4_union_shards 매크로가
#    INFORMATION_SCHEMA 로 동적 조회하므로 source() 로 선언하지 않음"*.
#    무엇이 바뀌었나 = BRONZE 가 **일별 샤드가 아니라 통합 1테이블**로 적재됐다(G-5 해소 · O86).
#      `GN_DW.BRONZE_BIGQUERY.EVENTS` = 285,676,588행 / 911일 · 통제총계 911건 전수 일치.
#    ⇒ 샤드를 열거할 이유가 사라졌으므로 **정식 source 로 선언**한다. 그 결과 리니지·`dbt docs`·
#      `source freshness` 축이 GA4 에도 생긴다(동적조회 방식에서는 불가능했던 것).
#    ⚠️ `macros/ga4_union_shards.sql` 은 **폐기**됐다 — 어느 모델도 참조하지 않는다.
#
# 🔄 [2026-08-14 스키마 개명] `GN_DW.BRONZE_GA4` → `GN_DW.BRONZE_BIGQUERY`.
#    왜: 원천이 GA4 제품이 아니라 **BigQuery export** 이고, GA4 외 BigQuery 유입도 수용하기 위해
#        원천 시스템 기준 명명으로 통일했다. 개명 대상은 **스키마명뿐** — `GA4_*` 모델명은 불변이다.
#    🆕 [O87] 그 분리 원칙은 유지되며, **기반 테이블 1종만 원천 접두**를 쓴다(`BIGQUERY_REFINED_DATA`).
#        근거·경계 = `20_issue/30_설계_의사결정.md` **DEC-38**.
#    이력 정본: `10_dbt_pipeline/README.md` §5 스키마 개명 이력.
sources:
  # 🔴🔴 [2026-08-21] `bronze_bigquery.EVENTS` 소스 선언을 폐기했다 — build ERROR 유발 확인됨.
  #    실측: 현 계정에는 `GN_DW.BRONZE_BIGQUERY.EVENTS` 통합 테이블이 **없다**(SHOW TABLES 0행).
  #    존재하는 것은 일별 샤드 `events_YYYYMMDD`뿐이다. 위 O87 주석의 "통합 1테이블 적재 완료"는
  #    구 계정(UA93987) 기준 기록이며 현 계정에는 재현되지 않았다(`tests/warn_ga4_null_user_pseudo_id.sql`
  #    2026-08-21 주석과 동일 실측). `macros/ga4_union_shards.sql`도 이미 폐기 상태이므로 되살리지 말 것.
  #    GA4 계열은 이제 `silver_external.BIGQUERY_REFINED_DATA`(외부 Python 직접 적재)만 원천으로 쓴다.
  # - name: bronze_bigquery
  #   database: GN_DW
  #   schema: BRONZE_BIGQUERY
  #   tables:
  #     - name: EVENTS
  #       columns:
  #         - name: EVENT_DT
  #           tests: [not_null]
  #         - name: SRC_FILE_NAME
  #           tests: [not_null]

  # 🆕 [2026-08-21] BIGQUERY_REFINED_DATA 는 더 이상 dbt 모델이 아니다 — 외부 Python 파이프라인이
  #    GN_DW.SILVER.BIGQUERY_REFINED_DATA 를 직접 적재한다(118컬럼 평탄화만 · 파생 0).
  #    🔴 이 source 의 유일한 소비자는 신설 dbt 모델 `GA4_BASIC` 이다 — GA4_* 5종은 더 이상
  #    이 source 를 직접 읽지 않는다(ref('GA4_BASIC') 로 읽는다). EVENT_SEQ·EVENT_DT·ID_SCHEME·
  #    SRC_FILE_NAME 은 원천에 없는 파생/계보 컬럼이라 여기서 테스트하지 않는다
  #    (그 컬럼들의 not_null/accepted_values 테스트는 `_ga4_schema.yml` GA4_BASIC 항목으로 이전).
  - name: silver_external
    database: GN_DW
    schema: SILVER
    description: >
      SILVER 계층 내 dbt 밖에서(외부 Python) 적재되는 테이블의 원천 선언.
    tables:
      - name: BIGQUERY_REFINED_DATA
        description: >
          BRONZE_BIGQUERY.EVENTS 평탄화 통합 테이블(파생 없음 · 118컬럼). `GA4_BASIC`(dbt) 의
          유일한 입력. grain = 1행 / (USER_PSEUDO_ID, EVENT_TIMESTAMP, EVENT_NAME) — 3키 중복
          8.66%(2025-06 실측) 잔존, GA4_BASIC 이 ROW_NUMBER 로 EVENT_SEQ 를 부여해 흡수한다.
          🔄 [2026-08-21] dbt 모델에서 외부 Python 적재로 전환(원천 접두 명명 근거 = DEC-38).
        columns:
          - name: USER_PSEUDO_ID
            tests:
              # DEC-40(2026-08-20): USER_PSEUDO_ID NULL 은 grain 구성 컬럼이라 GA4_BASIC 에서
              # 필터 제외(센티넬 아님). 기지 창 = EVENT_DATE 20240605~20240610(6일·111행·구
              # 계정 UA93987 원본, user_id 도 전건 NULL). 이 필터는 build ERROR 방지용 —
              # 창 밖 신규 사고는 여전히 error 로 감지된다. 창 안 규모 변화 감시는
              # `tests/warn_ga4_null_user_pseudo_id.sql`(warn) 이 전담.
              - not_null:
                  config:
                    where: "NOT (EVENT_DATE BETWEEN '20240605' AND '20240610')"
          - name: EVENT_TIMESTAMP
            tests: [not_null]
          - name: EVENT_NAME
            tests: [not_null]

  - name: bronze_crm
    database: GN_DW
    schema: BRONZE_CRM
    description: "CRM 원천 적재 레이어 — SILVER CRM 21객체의 원천(정본 09 STEP 3)."
    tables:
      - name: TC_CMMN_DTL_CD                # 공통 코드상세 → CRM_CODE
      - name: TM_CM_DEPT_INFO               # 부서(조직) 마스터 → CRM_ORG
      - name: TM_CM_SPNSR_BSNS_INFO         # 후원사업 마스터 → CRM_SPONSORSHIP
      - name: TM_CM_MBER_DVLP_GOAL          # 회원개발 목표 → CRM_DEV_TARGET
      - name: TM_CM_CMPGN_MNG               # 캠페인 관리 → CRM_CAMPAIGN
      - name: TM_CM_BRND_MNG                # 브랜드 관리 (CRM_CAMPAIGN join)
      - name: TM_CM_MKTNG_CMPGN_MNG         # 마케팅 캠페인 (CRM_CAMPAIGN join)
      - name: TM_CM_MKTNG_UTM               # [2026-08-25 신설] UTM 코드사전(MK_UTM/MK_UTM_NM) → CRM_CAMPAIGN join
      - name: TM_MM_FDRM_MBER_DVLP_AMT      # 개발약정 실적 → CRM_MEMBER_DEV
      - name: TM_MM_FDRM_MBER_IRSD          # 증액/감액 → CRM_MEMBER_AMT_CHANGE
      - name: TM_MM_FDRM_MBER_SPNSR_DSCNTC  # 후원중단 → CRM_MEMBER_DISCONTINUE
      - name: TM_MM_FDRM_MBER_RE_SPNSR      # 재후원 → CRM_MEMBER_RESPONSOR
      - name: TM_MM_FDRM_MBER_SPNSR_BSNS    # 회원×후원사업 → CRM_MEMBER_SPONSOR_BIZ
      # [2026-08-20 O93] 후원 마스터 — 종전 dbt 계보 0회(미사용 BRONZE 3종의 하나).
      #   활동회원 as-of 판정에 필요한 **후원 등록일**(FRST_REGIST_DT)과 SPNSR_NO→MBER_NO 연결을 가진
      #   유일한 원천이다. TM_MM_FDRM_MBER_SPNSR_BSNS 에는 MBER_NO 도 시작일도 없다.
      - name: TM_MM_FDRM_MBER_SPNSR         # 후원 마스터(SPNSR_NO→MBER_NO·등록일) → CRM_MEMBER_SPONSOR_SPAN
      - name: TM_RM_RELATNSP_MSTR_INFO      # 결연(아동) → CRM_SPONSOR_RELATION
      - name: TM_PM_SETLE_INFO              # 결제수단(현재) → CRM_PAYMENT_METHOD
      - name: TM_MS_EVENT                   # 행사 마스터 → CRM_EVENT
      - name: TM_MS_CRMN                    # 캠페인행사 마스터 → CRM_EVENT
      - name: TD_MS_EVENT_PRTCPNT_DTL       # 행사 참여자 상세 → CRM_EVENT_PARTICIPATION
      - name: TD_MS_CRMN_PRTCPNT            # 캠페인행사 참여자 → CRM_EVENT_PARTICIPATION
      - name: TM_RM_RELATNSP_LETTER_INFO    # 결연 서신 → CRM_RELATION_ACTIVITY
      - name: TM_RM_RELATNSP_GFTMNEY_INFO   # 결연 선물금 → CRM_RELATION_ACTIVITY
      - name: TH_MM_FDRM_MBER_STNG_DTLS     # 회원 상태이력(SCD2) → CRM_MEMBER_STATUS_HIST
      - name: TM_PM_MBRFEE_ACMSLT           # 회비 납입/청구 → CRM_PAYMENT_BILLING
      - name: TM_PM_DNTN_DTLS               # 기부금 → CRM_PAYMENT_BILLING
      - name: TM_MM_FDRM_MBER_INFO          # 정기 회원 마스터 → CRM_MEMBER
      - name: TM_MM_ONCE_MBER_INFO          # 일시 회원 마스터 → CRM_MEMBER
      - name: TM_MS_EMAIL_SNDNG             # 이메일 발송 → CRM_SEND_REQUEST
      - name: TM_MS_MSG_AT_SNDNG            # 문자(알림톡) 발송 → CRM_SEND_REQUEST
      - name: TM_MS_PSTMTR_SNDNG            # 우편 발송 → CRM_SEND_REQUEST
      - name: SND_REQ_MST                   # 발송요청 마스터(SND) → CRM_SEND_REQUEST/RESULT
      - name: TD_MS_EMAIL_LQY_SNDNG         # 이메일 성과 → CRM_SEND_RESULT
      - name: TD_MS_MSG_AT_LQY_SNDNG        # 문자 성과 → CRM_SEND_RESULT
      - name: TD_MS_PSTMTR_LQY_SNDNG        # 우편 성과 → CRM_SEND_RESULT
      - name: TD_MS_EMAIL_SNDNG_DTLS        # 이메일 발송 상세 → CRM_SEND_MEMBER
      - name: TD_MS_MSG_AT_SNDNG_DTLS       # 문자 발송 상세 → CRM_SEND_MEMBER
      - name: TD_MS_PSTMTR_SNDNG_DTL        # 우편 발송 상세 → CRM_SEND_MEMBER
      - name: SND_MEMBER_LIST               # 발송 회원 리스트(SND) → CRM_SEND_MEMBER

  - name: bronze_erp
    database: GN_DW
    schema: BRONZE_ERP
    description: "ERP 원천 — 예산 원장(정본 09 STEP 4). TOTAL 요약행 제외, 월 wide→long 언피벗."
    tables:
      - name: BDGT_ACMSLT_LEDGER            # 예산집행 원장 → ERP_BUDGET_ITEM, ERP_BUDGET

  - name: bronze_agency
    database: GN_DW
    schema: BRONZE_AGENCY
    description: "AGENCY 광고대행 원천 3종(정본 09 STEP 5). AGENCY_COST는 GOLD 이관(SILVER 미생성)."
    tables:
      - name: DGT_AD_CMPGN_DTLS             # 디지털 광고 → AGENCY_AD_PERFORMANCE/CREATIVE
      - name: REBRDC_AD_CMPGN_DTLS          # 재방송 광고 → AGENCY_AD_PERFORMANCE/CREATIVE
      - name: VIDEO_AD_CMPGN_DTLS           # 영상 광고 → AGENCY_AD_PERFORMANCE/CREATIVE
