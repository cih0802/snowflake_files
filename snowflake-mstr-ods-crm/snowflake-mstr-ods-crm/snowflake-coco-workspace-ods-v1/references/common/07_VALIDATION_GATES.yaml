validation_version: '1.0'

gates:
  - id: SOURCE_SCOPE
    required: true
    rule: 승인된 GN_DW.BRONZE_CRM 테이블만 사용한다.
  - id: COLUMN_EXISTENCE
    required: true
    rule: 실제 Snowflake 컬럼과 타입을 확인한다.
  - id: GRAIN
    required: true
    rule: 모든 원천과 결과의 1행 의미를 명시한다.
  - id: JOIN_KEY
    required: true
    rule: 전체 복합키, NULL, 중복, 미매칭, 카디널리티를 검증한다.
  - id: JOIN_MULTIPLICATION
    required: true
    rule: JOIN 전후 행 수와 고유 업무키 수를 비교한다.
  - id: METRIC_DEFINITION
    required: true
    rule: 수·건·금액·비율의 Grain, 상태, 날짜, 중복 제거를 명시한다.
  - id: RATE_RECALCULATION
    required: true
    rule: 전체 비율은 전체 분자와 분모로 다시 계산한다.
  - id: UI_EXPORT_PARITY
    required: true
    rule: 화면, KPI, 표, 차트, 다운로드가 동일한 조건과 APP 결과를 사용한다.
  - id: REPRESENTATIVE_PERIODS
    required: true
    rule: 서로 다른 대표 기간 2개를 검증한다.
  - id: PRIVACY
    required: true
    rule: 개인정보와 기술키를 기본 UI와 다운로드에 노출하지 않는다.
  - id: SNAPSHOT_DISCLOSURE
    required: true
    rule: 현재 ODS 재계산과 월마감 Snapshot 차이를 표시한다.

completion_rule:
  completed: 모든 required Gate 통과
  validation_required: 하나 이상의 Gate 미통과 또는 증거 부족

