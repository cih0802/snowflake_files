# Snowflake 세션 인증 사용 — password/authenticator/env_var 금지
# 대상 스키마(GN_DW.SILVER)는 사전 존재해야 함(DDL 배포 완료)
# 실행 role = GN_DW_ENGINEER (최소권한): dbt는 06/08 DDL 테이블에 적재만(dim merge / fact·silver append+TRUNCATE),
#   WIDE view 생성. CREATE TABLE 불요·구조 OWNERSHIP은 GN_DW_ADMIN. 권한 근거: 02_GN_DW_building/07_ENVIRONMENT_RBAC_setup.sql D.5.
default:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: ""
      user: ""
      role: GN_DW_ENGINEER
      database: GN_DW
      warehouse: GN_DW_ETL_WH
      schema: SILVER
      threads: 4
    # 🆕 [11_일적재pipeline 구성] 일배치 테스트 target — bronze_crm_2 기반.
    #   role/warehouse는 dev와 동일(기존 role 재사용 결정). 산출 스키마 분기는
    #   target.name=='dev2' 를 보고 macros/generate_schema_name.sql · models/silver/_sources.yml 이 처리한다.
    #   실행: dbt build --target dev2  (또는 EXECUTE DBT PROJECT ... ARGS='build --target dev2')
    dev2:
      type: snowflake
      account: ""
      user: ""
      role: GN_DW_ENGINEER
      database: GN_DW
      warehouse: GN_DW_ETL_WH
      schema: SILVER_2
      threads: 4
    prod:
      type: snowflake
      account: ""
      user: ""
      role: GN_DW_ENGINEER
      database: GN_DW
      warehouse: GN_DW_ETL_WH
      schema: GOLD
      threads: 4
