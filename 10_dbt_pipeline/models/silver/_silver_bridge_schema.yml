version: 2

# SILVER Bridge / Agency / ERP 모델 — relationships (DBTERD ERD 생성용)
models:
  - name: IDENTITY_MEMBER_XREF
    columns:
      - name: USER_PSEUDO_ID
        tests: [not_null]
      - name: MATCH_METHOD
        tests:
          - not_null
          - accepted_values: { values: ['MEMBER_ID_EXACT', 'UNMATCHED'] }
      - name: MEMBER_DK
        tests:
          # ⚠️ [2026-07-29 교정] 종전 무조건 `not_null`(error) 은 **설계와 모순**이었다.
          #   본 브리지는 미매칭 GA 신원을 MATCH_METHOD='UNMATCHED' + MEMBER_DK=NULL 로 **의도적으로 보존**한다
          #   (08_SILVER_테이블DDL: "매칭된 CRM 불변회원키(미매칭 NULL)" · "미매칭 보존" / 02 master §6).
          #   PoC 데이터가 우연히 100% 매칭(1,348행)이라 통과하던 잠재결함 →
          #   GA4 신규 샤드(events_20260719) 입고로 UNMATCHED 186행 발생하자 ERROR 로 표면화,
          #   하류 18노드가 SKIP 되어 FACT_GA_BEHAVIOR·DIM_MEMBER_IDENTITY 가 스테일로 남았다.
          #   → 진짜 불변식은 "**매칭된 행**은 MEMBER_DK 를 가진다" 이므로 where 로 스코프를 좁힌다(error 유지).
          - not_null:
              config: { where: "MATCH_METHOD = 'MEMBER_ID_EXACT'" }
          - relationships:
              to: ref('CRM_MEMBER')
              field: MEMBER_DK
              config: { severity: warn }   # 순서9-B: 회원 마스터 미완전 고아 정책 일관(warn). 전량입고 후 제거→error 복귀

  - name: AGENCY_AD_CREATIVE
    columns:
      - name: CREATIVE_DK
        tests: [not_null]

  # ─── AGENCY staging (DEC-11) — BRONZE 전컬럼 무손실 보존 + AD_PERF_DK 발급 단일지점 ───
  # AD_PERF_DK 유일성은 위성 팩트 1:1 조인의 전제조건이므로 error 로 강제한다.
  # 실측(2026-07-28): DGT 197,686 · VIDEO 35,822 · REBRDC 2,064 = 235,572 전건 유일(충돌 0).
  - name: AGENCY_AD_ROW_DGT
    columns:
      - name: AD_PERF_DK
        tests: [not_null, unique]
  - name: AGENCY_AD_ROW_VIDEO
    columns:
      - name: AD_PERF_DK
        tests: [not_null, unique]
  - name: AGENCY_AD_ROW_REBRDC
    columns:
      - name: AD_PERF_DK
        tests: [not_null, unique]

  # ─── AGENCY 파생 (DEC-8 위성 원천) ───
  - name: AGENCY_AD_DIGITAL
    columns:
      - name: AD_PERF_DK
        tests:
          - not_null
          - unique                       # 코어와 1:1 보장(실측 197,686행)
          - relationships:
              to: ref('AGENCY_AD_ROW_DGT')
              field: AD_PERF_DK
  - name: AGENCY_AD_BROADCAST
    columns:
      - name: AD_PERF_DK
        tests:
          - not_null
          - unique                       # 코어와 1:1 보장(VIDEO∪REBRDC 실측 37,886행)
  - name: AGENCY_AD_BROADCAST_CASE
    columns:
      - name: AD_PERF_DK
        tests:
          - not_null
          - relationships:
              to: ref('AGENCY_AD_ROW_REBRDC')
              field: AD_PERF_DK
      - name: CASE_SEQ
        tests: [not_null]
      # grain = AD_PERF_DK × CASE_SEQ (1:N — 사례 언피벗). 실측 5,327행(전NULL 사례 미적재).
      # ⚠️ dbt_utils 미설치(trial EAI 불가 → 자작 매크로로 대체)이므로 조합키 유일성은
      #    복합 표현식에 built-in unique 를 걸어 검사한다.
      - name: "AD_PERF_DK || '|' || CASE_SEQ"
        tests: [unique]

  - name: AGENCY_AD_PERFORMANCE
    columns:
      - name: AD_DATE
        tests:
          - not_null   # 순서9-D: 실측 널 0/235,572 확인 → error 승격(구조 불변식: 광고성과 행 날짜 필수). 순서9-C warn 은 실데이터 검증 전 보수적 조치였음.
      - name: AD_PERF_DK
        tests:
          - not_null
          - unique     # 순서9-I DEC-11: 코어 grain. 위성 3종 1:1/1:N 조인의 전제.
      - name: AD_SOURCE_TYPE
        tests:
          - not_null
          - accepted_values:
              values: ['DIGITAL', 'VIDEO', 'REBROADCAST']   # DEC-8 출처 명시축

  - name: ERP_BUDGET
    columns:
      - name: BUDGET_ITEM_DK
        tests: [not_null]

  - name: ERP_BUDGET_ITEM
    columns:
      - name: BUDGET_ITEM_DK
        tests: [not_null]

  - name: CRM_BIZ_TARGET
    columns:
      - name: BIZ_TARGET_DK   # 원천 0행(WHERE 1=0 스캐폴드) → 통과. 원천=CRM 확정(구 ERP_BIZ_TARGET).
        tests: [not_null]
