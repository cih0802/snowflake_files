  - name: CRM_SEND_MEMBER
    columns:
      - name: SNDNG_KEY
        tests:
          - not_null
          - relationships:
              to: ref('CRM_SEND_REQUEST')
              field: SNDNG_KEY
              config: { severity: warn }   # 고아 11,313 = PSTMTR 8,232(그 채널 고유키의 67%) + MSG_AT 3,081 · SND·EMAIL 0 (O116-B 실측 · 기간 산발 ⇒ 부분적재 아님 · 정본 문서50 §O116-3 ㉥)
      - name: MBER_NO
        tests:
          - not_null:
              config: { severity: warn }   # 🟢[2026-08-29 O117 규명] 745/38,467,887 = 0.00194% · 채널 분해 = MSG_AT 741(20,561,448행의 0.0036%) + EMAIL 4(7,811,125의 0.00005%) + SND 0 + PSTMTR 0. 🟢 **원천 직접 대조 완료** = BRONZE_CRM.TD_MS_MSG_AT_SNDNG_DTLS 20,561,448행 중 NULL 741 · TD_MS_EMAIL_SNDNG_DTLS 7,811,125 중 NULL 4 ⇒ 상·하류 동수이고 모델의 NULLIF(TRIM(),'') 가 만든 인공 NULL 은 **0건**이다(공백 유래 0) ⇒ **원천 NULL 전파**이지 채움률 결손이 아니다. 🔴 종전 「마스터 재추출/판정 후 error 복귀」는 축이 틀렸다 — 이 축은 마스터 고아(아래 relationships)가 아니라 **원천 값 부재**이므로 마스터 재추출로 해소되지 않는다 ⇒ 원천 소관. 정본 = 문서50 §O116-6 ㉡.
          - relationships:
              to: ref('CRM_MEMBER')
              field: MEMBER_DK
              config: { severity: warn }   # 고아 31,486 = 실제 고아(전량입고 확인됨 · O115-C) · 형식오류 아님(숫자 31,262 / 한글오염 139 / 기타 85 · O116-B) ⇒ 탈퇴·삭제 원천 대조 전까지 승격 보류
      # ── [2026-08-11 O59-N · DEC-35 1단계] 발송 결과 2축 코드군·라벨 (매핑 = 문서31 §1·§2 · 결정 = 문서30 §23-J) ──
      #   축A = 채널 상태(원천별 다체계) · 축B = 통신사 결과(신설 · 🟠 「conformed」는 O116-B 가 부분 부정 — 모델 헤더 참조).
      #   🔴 EMAIL·SND·PSTMTR 의 축A 라벨은 **의도적으로 NULL** 이다(§23-J 결정 3 — 사전에 라벨 문자열이 없다)
      #      ⇒ 축A 라벨 관측은 **MSG_AT 로 한정**한다. 전 채널에 걸면 의도된 NULL 이 매번 warn 을 내 게이트가 무시된다.
      #   🔴 축A MSG_AT 코드군(MS282)은 **등급 C 조건부 적용** — 문서20 §M-3 회신이 다르면 되돌린다.
      - name: SEND_STATUS_GROUP
        tests:
          - accepted_values:
              values: ['MS282']
              quote: true
              config: { where: "SEND_STATUS_GROUP is not null" }
      - name: SEND_STATUS_NAME
        tests:
          - not_null:
              config: { severity: warn, where: "SEND_CHANNEL = 'MSG_AT' and SNDNG_RST_CD is not null" }
      - name: SEND_RESULT_GROUP
        tests:
          - accepted_values:
              values: ['MS056', 'MS057', 'MS058', 'MS059']
              quote: true
              config: { where: "SEND_RESULT_GROUP is not null" }   # 🔴 코드군을 조인 결과에서 얻으므로, 사전에 새 그룹이 생기면 여기서 잡힌다
      - name: SEND_RESULT_NAME
        tests:
          - not_null:
              config: { severity: warn, where: "SEND_RESULT_CD is not null" }   # 사전 초과값 실재(DEC-17-B 관측 · 라벨 NULL 유지)

