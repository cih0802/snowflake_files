version: 2

# SILVER CRM 모델 — PK 정의 + inter-model relationships (DBTERD ERD 생성용 포함)
# 실행: dbt test --select tag:silver_crm
# MBER_NO 기반 FK는 CRM_MEMBER.MEMBER_DK 와 relationships 정의.
# NULL 허용 FK는 where 필터로 테스트 실패 방지.
# ⚠️ 순서9-C severity 정책 (메달리온 베스트 프랙티스):
#    Silver 참조무결성 실패가 "알려진 원천/마스터 미완전"에서 기인하면 severity:warn 으로 관측·추적(CI 미차단).
#    error 는 구조적 불변식(차원 PK not_null/unique 등)에만 예약. 아래 relationships/not_null(FK성) 은 전부 warn.
#    ▶▶ 마스터 전량입고·키체계 확정 후 warn 제거 → error 복귀 (후속조치, 누락 금지. 문서50 BLOCKING-1/2).
#    대상: MBER_NO/MEMBER_DK→CRM_MEMBER, EVENT_KEY→CRM_EVENT(이슈 E 263,611), SNDNG_KEY→CRM_SEND_REQUEST,
#          SPNSR_BSNS_ID→CRM_SPONSORSHIP, CMPGN_CD→CRM_CAMPAIGN, not_null(MBER_NO) 고아분.
models:
  # ─── PK 모델 (relationship 대상) ───
  - name: CRM_MEMBER
    columns:
      - name: MEMBER_DK
        tests: [not_null, unique]
      - name: MEMBER_TYPE
        tests:
          - not_null
          - accepted_values: { values: ['FDRM', 'ONCE'] }
      - name: CMPGN_CD
        tests:
          - relationships:
              to: ref('CRM_CAMPAIGN')
              field: CMPGN_CD
              config: { where: "CMPGN_CD IS NOT NULL", severity: warn }   # 순서9-C: 캠페인 마스터 소량 gap(고아 4). warn. 확정 후 error 복귀.
      - name: ACT_DEPT_CD
        tests:
          - relationships:
              to: ref('CRM_ORG')
              field: DEPT_ID
              config: { where: "ACT_DEPT_CD IS NOT NULL" }

  - name: CRM_EVENT
    columns:
      - name: EVENT_KEY
        tests: [not_null, unique]

  - name: CRM_CAMPAIGN
    columns:
      - name: CMPGN_CD
        tests: [not_null, unique]
      - name: SPNSR_BSNS_ID
        tests:
          - relationships:
              to: ref('CRM_SPONSORSHIP')
              field: SPNSR_BSNS_ID
              config: { where: "SPNSR_BSNS_ID IS NOT NULL", severity: warn }   # 순서9-C: 후원사업 마스터 미완전(50행, 고아 18,091). warn. 전량입고 후 error 복귀.
      # ─── 캠페인 분류 4축 라벨 (2026-07-16 BRONZE 재입고, Q2·Q3 해소) ───
      #   코드가 있으면 라벨도 있어야 한다(코드사전 MM293~MM296 조인). 라벨 NULL = 코드사전 미등재 = 고아.
      #   ⚠️ severity 정책(위 §헤더) 준수: 라벨은 코드사전 조인 산물(FK성)이므로 **전부 warn**.
      #      error 는 구조적 불변식(PK not_null/unique)에만 예약 — 원천 코드사전 보강은 우리 통제 밖이다.
      #      accepted_values 도 warn: 현업이 원천 라벨 문구를 바꾸면 값이 변하는 것이 정상이며, CI 차단 사유가 아니다.
      #      ▶▶ 기지 고아(카테고리 23행·유형1 740행) 해소 + 라벨 문구 확정 후 error 승격 검토.
      - name: CMPGN_CTGR_NM        # MM294 캠페인 카테고리(56)
        tests:
          - not_null:
              config: { where: "CMPGN_CTGR_CD IS NOT NULL", severity: warn }   # 기지 고아: CMPGN_CTGR_CD=58, 23행
      - name: CMPGN_TYPE1_NM       # MM295 국내/통합/해외 (⚠️사업/사례 아님)
        tests:
          - not_null:
              config: { where: "CMPGN_TYPE1_BSN IS NOT NULL", severity: warn } # 기지 고아: CMPGN_TYPE1_BSN=4, 740행
          - accepted_values:
              values: ['국내', '통합', '해외']
              config: { where: "CMPGN_TYPE1_NM IS NOT NULL", severity: warn }
      - name: CMPGN_TYPE2_NM       # MM296 굿즈/기타/사례/사업
        tests:
          - not_null:
              config: { where: "CMPGN_TYPE2_BSN IS NOT NULL", severity: warn }  # 실측 고아 0 — 회귀 감지용
          - accepted_values:
              values: ['굿즈', '기타', '사례', '사업']
              config: { where: "CMPGN_TYPE2_NM IS NOT NULL", severity: warn }
      - name: MBER_INFLOW_PATH_NM  # MM293 개발인입경로(16)
        tests:
          - not_null:
              config: { where: "MBER_INFLOW_PATH_CD IS NOT NULL", severity: warn } # 실측 고아 0 — 회귀 감지용
      - name: MK_CMPGN_NM          # Q16 마케팅캠페인 라벨(323종, 고아 0)
        tests:
          - not_null:
              config: { where: "MKTG_CMPGN_NM IS NOT NULL", severity: warn }       # 실측 고아 0 — 회귀 감지용

  - name: CRM_SPONSORSHIP
    columns:
      - name: SPNSR_BSNS_ID
        tests: [not_null, unique]

  - name: CRM_ORG
    columns:
      - name: DEPT_ID
        tests: [not_null, unique]

  - name: CRM_CODE
    columns:
      - name: CD_ID
        tests: [not_null]
      - name: DTL_CD_ID
        tests: [not_null]

  - name: CRM_SEND_REQUEST
    columns:
      - name: SNDNG_KEY
        tests: [not_null, unique]

  # ─── FK 모델 (relationships 정의) ───
  # 회원→CRM_MEMBER relationships = severity:warn (마스터 미완전 고아, 순서9-B). 마스터 전량입고 후 제거→error 복귀.
  - name: CRM_EVENT_PARTICIPATION
    columns:
      - name: EVENT_KEY
        tests:
          - not_null
          - relationships:
              to: ref('CRM_EVENT')
              field: EVENT_KEY
              config: { severity: warn }   # 순서9-C: 이슈 E 고아 263,611(23%) — 마스터 미완전/키체계 미확정. warn 관측(문서50 BLOCKING-2). 확정 후 error 복귀.
      - name: MBER_NO
        tests:
          - not_null
          - relationships:
              to: ref('CRM_MEMBER')
              field: MEMBER_DK
              config: { severity: warn }   # 순서9-B: 마스터 미완전 고아(warn). 전량입고 후 제거

  - name: CRM_MEMBER_DEV
    columns:
      - name: MBER_NO
        tests:
          - not_null
          - relationships:
              to: ref('CRM_MEMBER')
              field: MEMBER_DK
              config: { severity: warn }   # 순서9-B: 마스터 미완전 고아(warn). 전량입고 후 제거
      - name: SPNSR_BSNS_ID
        tests:
          - relationships:
              to: ref('CRM_SPONSORSHIP')
              field: SPNSR_BSNS_ID
              config: { where: "SPNSR_BSNS_ID IS NOT NULL" }
      - name: CMPGN_CD
        tests:
          - relationships:
              to: ref('CRM_CAMPAIGN')
              field: CMPGN_CD
              config: { where: "CMPGN_CD IS NOT NULL", severity: warn }   # 순서9-C: 캠페인 마스터 소량 gap(고아 18). warn. 확정 후 error 복귀.

  - name: CRM_MEMBER_DISCONTINUE
    columns:
      - name: MBER_NO
        tests:
          - not_null
          - relationships:
              to: ref('CRM_MEMBER')
              field: MEMBER_DK
              config: { severity: warn }   # 순서9-B: 마스터 미완전 고아(warn). 전량입고 후 제거

  - name: CRM_MEMBER_AMT_CHANGE
    columns:
      - name: MBER_NO
        tests:
          - not_null
          - relationships:
              to: ref('CRM_MEMBER')
              field: MEMBER_DK
              config: { severity: warn }   # 순서9-B: 마스터 미완전 고아 정책 일관(현재 고아 0, 예방적 warn). 전량입고 후 제거
      - name: CMPGN_CD
        tests:
          - relationships:
              to: ref('CRM_CAMPAIGN')
              field: CMPGN_CD
              config: { where: "CMPGN_CD IS NOT NULL" }

  - name: CRM_MEMBER_RESPONSOR
    columns:
      - name: MBER_NO
        tests:
          - not_null
          - relationships:
              to: ref('CRM_MEMBER')
              field: MEMBER_DK
              config: { severity: warn }   # 순서9-B: 마스터 미완전 고아(warn). 전량입고 후 제거

  - name: CRM_MEMBER_SPONSOR_BIZ
    columns:
      - name: SPNSR_BSNS_ID
        tests:
          - not_null
          - relationships: { to: ref('CRM_SPONSORSHIP'), field: SPNSR_BSNS_ID }

  - name: CRM_MEMBER_STATUS_HIST
    columns:
      - name: MBER_NO
        tests:
          - not_null
          - relationships:
              to: ref('CRM_MEMBER')
              field: MEMBER_DK
              config: { severity: warn }   # 순서9-B: 마스터 미완전 고아(warn). 전량입고 후 제거

  - name: CRM_PAYMENT_BILLING
    columns:
      - name: MBER_NO
        tests:
          - not_null:
              config: { severity: warn }   # 순서9-C: NULL 회원번호 고아 5(이슈 B/D). warn. 마스터 재추출/판정 후 error 복귀.
          - relationships:
              to: ref('CRM_MEMBER')
              field: MEMBER_DK
              config: { severity: warn }   # 순서9-B: 마스터 미완전 고아(warn). 전량입고 후 제거
      - name: SPNSR_BSNS_ID
        tests:
          - relationships:
              to: ref('CRM_SPONSORSHIP')
              field: SPNSR_BSNS_ID
              config: { where: "SPNSR_BSNS_ID IS NOT NULL", severity: warn }   # 순서9-C: 후원사업 마스터 미완전(고아 1). warn. 전량입고 후 error 복귀.
      # W1(DEC-17, 2026-07-31): 결제결과코드 = 사유축 전용. 판정축은 PAY_STAT_CD(DEC-3) 불변.
      - name: RQEST_RST_CD
        tests:
          # 사유 커버리지 회귀 감지: 미납(F) 행에 사유코드가 있어야 함. 실측 부재 1,096/6,262,245(0.018%) → warn.
          # ⚠️조인은 (코드그룹, 코드) 복합키 — 코드그룹 = SETLE_CD+자릿수. 코드 단독 relationships 테스트 금지('01'이 41개 코드그룹에 존재).
          - not_null:
              config: { where: "PAY_STAT_CD = 'F'", severity: warn }
      - name: PRCS_RST_CD
        # ⚠️PAY_STAT_CD 거울 컬럼(불일치 0.386%·7종). 판정·사유 분해에 사용 금지 → 테스트 미부여(원천 보존 목적).

  - name: CRM_PAYMENT_METHOD
    columns:
      - name: MBER_NO
        tests:
          - not_null
          - relationships:
              to: ref('CRM_MEMBER')
              field: MEMBER_DK
              config: { severity: warn }   # 순서9-B: 마스터 미완전 고아(warn, 고아 37). 전량입고 후 제거

  - name: CRM_SEND_MEMBER
    columns:
      - name: SNDNG_KEY
        tests:
          - not_null
          - relationships:
              to: ref('CRM_SEND_REQUEST')
              field: SNDNG_KEY
              config: { severity: warn }   # 순서9-C: 발송요청 마스터 미완전(고아 11,313). warn. 전량입고 후 error 복귀.
      - name: MBER_NO
        tests:
          - not_null:
              config: { severity: warn }   # 순서9-C: NULL 회원번호 고아 745(이슈 B/D). warn. 마스터 재추출/판정 후 error 복귀.
          - relationships:
              to: ref('CRM_MEMBER')
              field: MEMBER_DK
              config: { severity: warn }   # 순서9-B: 마스터 미완전 고아(warn, 고아 31,486). 전량입고 후 제거

  - name: CRM_SEND_RESULT
    columns:
      - name: SNDNG_KEY
        tests:
          - not_null
          - relationships:
              to: ref('CRM_SEND_REQUEST')
              field: SNDNG_KEY
              config: { severity: warn }   # 순서9-C: 발송요청 마스터 미완전(고아 9). warn. 전량입고 후 error 복귀.

  - name: CRM_SPONSOR_RELATION
    columns:
      - name: MBER_NO
        tests:
          - not_null
          - relationships:
              to: ref('CRM_MEMBER')
              field: MEMBER_DK
              config: { severity: warn }   # 순서9-B: 마스터 미완전 고아 정책 일관(현재 고아 0, 예방적 warn). 전량입고 후 제거
      - name: SPNSR_BSNS_ID
        tests:
          - relationships:
              to: ref('CRM_SPONSORSHIP')
              field: SPNSR_BSNS_ID
              config: { where: "SPNSR_BSNS_ID IS NOT NULL" }

  - name: CRM_DEV_TARGET
    columns:
      - name: DEPT_ID
        tests:
          - relationships:
              to: ref('CRM_ORG')
              field: DEPT_ID
              config: { where: "DEPT_ID IS NOT NULL" }
