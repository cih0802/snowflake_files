      #   축A = 채널 상태(원천별 다체계) · 축B = 통신사 결과(conformed · 신설).
      #   🔴 EMAIL·SND·PSTMTR 의 축A 라벨은 **의도적으로 NULL** 이다(§23-J 결정 3 — 사전에 라벨 문자열이 없다)
