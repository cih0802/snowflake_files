  - name: CRM_EVENT_PARTICIPATION
    columns:
      - name: EVENT_KEY
        tests:
          - not_null
          # 🔴 [2026-08-29 O116] 「키체계 미확정」 가설은 **기각**됐다 — 정본 = 문서50 §O116-3 ㉡.
          #   실측: 고아 263,611 = 참여 1,134,126 의 **23.24%** · 그 중 **99.5%가 키 2개**
          #   (`EVENT_105` 195,544 · `EVENT_106` 66,642) · 고유 고아 키 53.
          #   원천 `TM_MS_EVENT` 376행 · `EVENT_CD` 전건 수치·유일(1~431 · 결번 55) · **105·106 은 0건**이고
          #   인접 100~104·107~110 은 이름·기간까지 정상 ⇒ **키 생성식·배선은 정상이고 원천 마스터 결번**이다.
          #   ⇒ 남은 것은 현업 회신 1건(그 2개 행사의 정체·삭제 사유) · 🔴 회신 전 error 승격 금지.
          #   🟢 마스터 2행이 들어오면 이 23% 가 일괄 해소된다.
          - relationships:
              to: ref('CRM_EVENT')
              field: EVENT_KEY
              config: { severity: warn }   # 이슈 E 고아 263,611(23.24%) — 원천 마스터 결번(O116 실측). warn 관측(문서50 BLOCKING-2 · §O116-3 ㉡).
      - name: MBER_NO
        tests:
          - not_null
          - relationships:
              to: ref('CRM_MEMBER')
              field: MEMBER_DK
              config: { severity: warn }   # 순서9-B: 마스터 미완전 고아(warn). 전량입고 후 제거
      # ── [2026-08-11 O59-N · DEC-35 1단계] 참여 3축 코드군·라벨 (매핑 = 문서31 §3 · 결정 = 문서30 §23-J) ──
      #   🔴 원천별로 코드체계가 다르다(겹침 0) ⇒ 코드군은 EVENT_KEY 접두가 판별한다.
      #   ⚠️ 라벨 NULL 은 사전 미등재 + **O28 오염값 `)`** 두 원인이 섞인다 — warn 으로 관측만 한다(문서31 §6).
      #   🔴 PATH 2건(MS303·MS004)은 **등급 C 조건부 적용**이다 — 문서20 §M-3 회신이 다르면 되돌린다.
      - name: PARTCPT_STAT_GROUP
        tests:
          - accepted_values:
              values: ['MS304', 'MS006']
              quote: true
              config: { where: "PARTCPT_STAT_GROUP is not null" }
      - name: PARTCPT_PATH_GROUP
        tests:
          - accepted_values:
              values: ['MS303', 'MS004']
              quote: true
              config: { where: "PARTCPT_PATH_GROUP is not null" }
      - name: PARTCPT_CHNNL_GROUP
        tests:
          - accepted_values:
              values: ['MS302']
              quote: true
              config: { where: "PARTCPT_CHNNL_GROUP is not null" }
      # [2026-08-12 O61 · ②] 🔴 store_failures 확장 — 이 3건은 WARN 이라 종전에는 「Got N results」만 남고
      #   **어느 행이 라벨 NULL 인지** 사라졌다(사전 미등재 / O28 오염값 두 원인이 섞여 있다고만 적혀 있었다).
      #   🟢 **확장 즉시 규명됐다(실측)**: 3축의 라벨 NULL 은 **서로 다른 6행**이고 각 행에서 `)` 가 들어간
      #      축은 정확히 하나다(나머지는 정상값). 회원 2명 × 3행 = 문서20 §I-2 점검도구 유입과 일치
      #      ⇒ **원인은 오염값 단일**이고 **사전 미등재분은 0** 이다
      #      (캠페인행사 계열 MS006·MS004 는 라벨 커버리지 100%). 종전 「두 원인이 섞인다」 서술은 미실측이었다.
      #   ⚠️ 판정은 감사 테이블 **행수 = WARN 건수** 대조다(P33). 원천 충실 원칙상 삭제·치환하지 않는다(DEC-17-B).
      - name: PARTCPT_STAT_NM
        tests:
          - not_null:
              config: { severity: warn, where: "PARTCPT_STAT_CD is not null", store_failures: true, schema: OPS }
      - name: PARTCPT_PATH_NM
        tests:
          - not_null:
              config: { severity: warn, where: "PARTCPT_PATH_CD is not null", store_failures: true, schema: OPS }
      - name: PARTCPT_CHNNL_NM
        tests:
          - not_null:
              config: { severity: warn, where: "PARTCPT_CHNNL_CD is not null", store_failures: true, schema: OPS }

