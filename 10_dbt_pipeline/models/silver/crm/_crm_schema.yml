          # ⚠️조인은 (코드그룹, 코드) 복합키 — 코드그룹 = SETLE_CD+자릿수. 코드 단독 relationships 테스트 금지('01'이 41개 코드그룹에 존재).
          # 🟢[2026-08-29 O117 규명] 이 1,096 은 커버리지 결손이 아니라 **결제수단별 구조적 부재**다. 실측(F행 6,262,245 · 부재율 0.0175%):
          #   SETLE_CD 1(자동이체) 4,834,247행 NULL 0.000%·사유코드 25종 / 2(신용카드) 1,148,911 NULL 0.000%·47종 /
