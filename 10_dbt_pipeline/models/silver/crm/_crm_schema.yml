          #   기간은 2022~2026 산발(282/274/230/209/101)이라 부분적재가 아니다. 수단 라벨 근거 = CRM_CODE PM030·PM040(8=OCR).
          # ⇒ 🟢 warn 유지가 정당하고 🔴 사유코드 창작 금지(R2-7-1) · 「OCR 수납이 사유코드를 발행하지 않는 것이 정상인가」는 현업 질의다.
          #   🔴 where 에 SETLE_CD 제외를 넣지 마라 — 넣으면 이 1,096 이 관측에서 사라진다. 정본 = 문서50 §O116-6 ㉠.
