      - name: PERF_QUARTER
        description: "DIM_DATE.QUARTER — 실적일 분기"
      - name: PERF_IS_HOLIDAY
        description: "DIM_DATE.IS_HOLIDAY — 실적일 휴일여부 🔴🔴[O51-F 실측] **휴일축이 미주입이다 — 전건 `FALSE`.** `DIM_DATE.IS_HOLIDAY` 에 TRUE 가 하나도 없다. NULL 이 아니라 FALSE 라서 **집계가 성공한 것처럼 보이고**, 「휴일 대비 평일 성과」 질의가 **전건 평일**로 응답된다. ⇒ 이 컬럼으로 휴일 분석을 하지 말 것(기지 **HOL-1** — 공휴일 원천이 전 스키마에 없어 외부 입고 대기). 실측 규모는 이슈원장 §O51-F."
      - name: CAMPAIGN_NAME
        description: "DIM_CAMPAIGN.CAMPAIGN_NAME — 캠페인명 🔴🔴[O51-F 실측] **전건 `'(미매핑)'` 센티넬** — NULL 이 아니라 **문자열**이라 GROUP BY 하면 단일 그룹이 생겨 **집계에 성공한 것처럼 보인다.** 원인 = `FACT_AD_PERFORMANCE.CAMPAIGN_SK` 의 실측값이 센티넬 하나뿐이다. ⇒ 이 컬럼으로 분해를 시도하지 말 것 — 「캠페인별」·「부서별」 요구에 **조용히 총계 1행**이 돌아온다. 🟢대안 = 마케팅캠페인 축(`MKTG_CAMPAIGN_SK`)은 살아 있다(O45) — 광고↔개발 결합은 그 grain 에서 한다. 실측 규모는 이슈원장 §O51-F."
      - name: AD_MEDIA_NAME
        description: "DIM_AD_CREATIVE.MEDIA_NAME — 매체명 🔴🔴[O51-F 실측] **이 뷰에서 전건 NULL** — 원인은 차원이 아니라 **팩트 FK 가 전건 센티넬**이다: `FACT_AD_PERFORMANCE.AD_CREATIVE_SK` 의 실측값이 센티넬 하나뿐이다. ⇒ **이 축으로는 분해가 불가능하다.** 차원 자체는 채워져 있다. 🔴🔴 원천에는 있는 축이다 — SILVER `AGENCY_AD_PERFORMANCE.MEDIA_CHANNEL_NM`·`CREATIVE_NM` 과 BRONZE 매체명은 **전건 채워져 있다.** GOLD 에서만 소실됐다 — 팩트 FK 가 0 하드코딩이다(기지 **P52·O38-C**, 연결키는 **Q10** 소관). 실측 규모는 이슈원장 §O51-F."
      - name: AD_CREATIVE
        description: "DIM_AD_CREATIVE.CREATIVE — 소재 🔴🔴[O51-F 실측] **이 뷰에서 전건 NULL** — 원인은 차원이 아니라 **팩트 FK 가 전건 센티넬**이다: `FACT_AD_PERFORMANCE.AD_CREATIVE_SK` 의 실측값이 센티넬 하나뿐이다. ⇒ **이 축으로는 분해가 불가능하다.** 차원 자체는 채워져 있다. 🔴🔴 원천에는 있는 축이다 — SILVER `AGENCY_AD_PERFORMANCE.MEDIA_CHANNEL_NM`·`CREATIVE_NM` 과 BRONZE 매체명은 **전건 채워져 있다.** GOLD 에서만 소실됐다 — 팩트 FK 가 0 하드코딩이다(기지 **P52·O38-C**, 연결키는 **Q10** 소관). 실측 규모는 이슈원장 §O51-F."
  - name: WIDE_AD_DIGITAL
    description: "디지털광고 위성 팩트(FAD_D) 평탄화 — grain=AD_PERF_DK. 코어와 1:1 이라 코어 measure(AD_COST·IMPRESSIONS·CLICKS·GA_CONV_*) 동반 노출 → 비율 재계산 base 를 같은 뷰에서 확보한다. ⚠️코어 뷰와 함께 합산하면 디지털 행이 이중계상된다. _SRC 7종은 대행사 산정 **비가산(N)** — 집계는 base 재계산(예: CTR=SUM(CLICKS)/SUM(IMPRESSIONS))이고 _SRC 는 행 단위 대조용이다. DEVICE_TYPE 동반(디지털은 기기가 실존 · 실적재 PC·M). 🔴[O51-F] 매체·소재축과 캠페인명은 사용 불가 상태다(FK 미배선 = P52·O38-C·Q10) · 휴일축 미주입(HOL-1) · AD_SOURCE_TYPE 은 단일값이다. 🔴행수는 하드코딩하지 않는다(규칙 7)."
    # [O51-F] ✅ [2026-08-10] 컬럼 문안 전량 등재 — 종전 「DROP 예정」 결정을 철회하고 이관했다.
    # [O51-F]   철회 근거(실측): 이 뷰는 dbt 모델이므로 물리 DROP 은 다음 build 가 되살린다 · 모델 헤더가
    # [O51-F]   이미 gn_view_commented 이관을 처방하고 있었다 · DEC-8/DEC-10 이 위성 단독 완결을 설계 의도로 명시한다.
    # [O51-F]   ⚠️ CREATE VIEW 컬럼목록은 SELECT 전 컬럼과 **개수·순서가 정확히 일치**해야 한다 —
    # [O51-F]      모델 SELECT 를 바꾸면 이 블록도 동시에 재생성할 것(scripts/o51d_view_comments/build_ad_yml.py).
    # [O51-F]   문안 출처 = 03_top-down_gold/10_ §7-A·§7-B 이관 + O51-F 실측 경고 오버레이.
