  - name: WIDE_AD_BROADCAST
    description: "방송광고 위성 팩트(FAD_B) 평탄화 — grain=AD_PERF_DK. 코어와 1:1 이라 코어 measure(AD_COST·INBOUND_CALL) 동반 노출 → 방송 분석을 단일 뷰로 완결한다. ⚠️코어 뷰(WIDE_AD_PERFORMANCE)와 함께 합산하면 방송 행이 이중계상된다 — 전 유형 집계는 코어 뷰만. ⚠️컬럼 NULL 은 두 방송 원천(VIDEO·REBROADCAST) 중 한쪽 전용 속성이며 결측이 아니다. DVLP_MEMBER_CNT·DVLP_CNT = 재방송 개발실적(O16 분리 · GA 전환 아님). _SRC 는 대행사 산정 비가산(N). 🔴[O51-F] 매체·소재축과 캠페인명은 사용 불가 상태다(FK 미배선 = P52·O38-C·Q10) · 휴일축 미주입(HOL-1). 🔴행수는 하드코딩하지 않는다 — 재적재마다 변한다(규칙 7)."
    # [O51-F] ✅ [2026-08-10] 컬럼 문안 전량 등재 — 종전 「DROP 예정」 결정을 철회하고 이관했다.
    # [O51-F]   철회 근거(실측): 이 뷰는 dbt 모델이므로 물리 DROP 은 다음 build 가 되살린다 · 모델 헤더가
    # [O51-F]   이미 gn_view_commented 이관을 처방하고 있었다 · DEC-8/DEC-10 이 위성 단독 완결을 설계 의도로 명시한다.
    # [O51-F]   ⚠️ CREATE VIEW 컬럼목록은 SELECT 전 컬럼과 **개수·순서가 정확히 일치**해야 한다 —
    # [O51-F]      모델 SELECT 를 바꾸면 이 블록도 동시에 재생성할 것(scripts/o51d_view_comments/build_ad_yml.py).
    # [O51-F]   문안 출처 = 03_top-down_gold/10_ §7-A·§7-B 이관 + O51-F 실측 경고 오버레이.
