  - name: WIDE_MEMBER_FEE
    description: "회비 분해 팩트(FMF) 평탄화 — SPONSORSHIP·PAYMENT·DATE(최종납입일)·MEMBER[현재버전]·ACQUISITION[획득귀속]. grain = 회원 × 회비월 × 후원사업 × 회비구분 × 납입유형 × 결제수단. 계보(BRONZE 실측 2026-08-07): BRONZE_CRM.TM_PM_MBRFEE_ACMSLT(회비) ∪ TM_PM_DNTN_DTLS(기부금) → SILVER.CRM_PAYMENT_BILLING → GOLD.FACT_MEMBER_FEE. 🔴기부금 지류의 청구액·회비구분 NULL 은 결측이 아니라 **구조적 부재**다 — TM_PM_DNTN_DTLS 30컬럼 전수 확인 결과 RQEST_AMT·MBRFEE_DIV_CD·MBER_NO 컬럼이 **아예 없다**(회원키는 ONCE_MBER_NO). ⇒ 납부율·미납 분모는 회비로 스코프(O40) · 분자는 PAID_FEE_BILLABLE. 🔴🔴WIDE_MEMBER_MONTHLY 와 **같은 표에서 회비 measure 합산 금지** — 같은 원천을 다른 grain 으로 담은 형제 팩트이며 실측 청구액이 **두 자리 % 로 부풀어 오른다**(DEC-31·GATE-D · 기준값은 이슈원장 §O45). 🔴「후원사업」·「부서」는 축이 둘이다 — SPONSORSHIP_NAME/ACQ_DEPARTMENT=획득·납입 대상, 사건 축은 WIDE_MEMBER_EVENT 소관."
    # ✅ [2026-08-07 O51-D] 39/39 컬럼 문안 완성 — materialized='gn_view_commented' 전환 완료.
    #   ⚠️ 종전 O51-C 주석의 *"⛔ materialized 를 바꾸지 말 것 — 17/39 만 문안 보유"* 는 **해소돼 삭제했다**
    #      (경고문을 남겨두면 다음 세션이 이미 끝난 금지를 지킨다).
    #   경위: 이 뷰의 문안은 `10_WIDE VIEW 코멘트.sql`(13/16뷰)에 **없었고** post_hook 에만 있었으며
    #   그 post_hook 자신도 17/39(44%) 만 덮고 있었다 — 「post_hook 이 완전하다」는 O50 의 전제가 여기서도 거짓이었다.
    #   잔여 22컬럼은 O51-D 에서 **BRONZE 코드사전 × 실적재 distinct 전수 재스캔**을 근거로 신규 작성했다.
    #   🟢 부수 성과 — PAYMENT_METHOD_NAME·SETLE_CD 문안이 지목했던 **O45-B(결제수단 코드그룹 미특정)가 해소**됐다.
    #      SETLE_CD 실측 11종이 PM040(결제정보) 사전에 11/11 존재한다 ⇒ 미매핑 원인은 코드 미상이 아니라
    #      DIM_PAYMENT 를 결제수단 마스터(TM_PM_SETLE_INFO) distinct 로 만든 것이다(재배선은 별건).
    columns:
      - name: MONTH_KEY
        description: "회비월 YYYYMM (무효/NULL 이면 납입월 폴백, 둘 다 무효면 0=Unknown월 — FMM 과 동일 규칙)"
      - name: CAL_YEAR
        description: "FLOOR(MONTH_KEY/100) — 연도"
      - name: CAL_MONTH
        description: "MOD(MONTH_KEY,100) — 월"
      - name: MEMBER_DK
        description: "회원 자연키(= 팩트 조인키, FK→DIM_MEMBER.MEMBER_DK). 🔴VARCHAR(10) 규약(O12/AC-1) — 원천 MBER_NO 최대길이 9 실측. 🔴기부금 지류(BRONZE_CRM.TM_PM_DNTN_DTLS)에는 MBER_NO 컬럼이 **아예 없다**(회원키가 ONCE_MBER_NO) — 기부금 행의 회원 축은 구조적으로 부재하다. ⚠️FMM 규약과 일치시키기 위해 MBER_NO IS NOT NULL 을 적용한다(O45-C)."
      - name: SPONSORSHIP_SK
        description: "🔴**납입 대상** 후원사업 대리키(FK→DIM_SPONSORSHIP) ← 원천 SPNSR_BSNS_ID. 0=미매핑. [O51-D 실측] **거의 전건 채움**이며 후원사업 종류는 수십 개다. 🔴획득 후원사업 ACQ_SPONSORSHIP_SK 와 **의미가 다르다** — 같은 라벨로 두 축이 존재한다. 이 축이 grain 에 들어간 것이 이 팩트를 FMM 과 분리한 이유다 — [O51-D 실측] 이 축을 붙이면 **회원-월 조합 수가 늘어 grain 이 깨진다**(증가율은 이슈원장 §O45·§O51-D). ⚠️인용 시 스코프를 함께 적을 것 — 종전 수치는 **BRONZE 회비 지류만**(MBER_NO not null) 스코프여서 분모가 다르다."
      - name: SPONSORSHIP_NAME
        description: "🔴**납입 대상** 후원사업 — 회비 행에 붙은 값이다(원천 SPNSR_BSNS_ID · 거의 전건 채움). 획득 후원사업(ACQ_SPONSORSHIP_NAME)과 다르다: 한 회원이 여러 후원사업에 낸다. 🔴이 축을 grain 에 넣으면 회원-월 조합 수가 늘어난다 — 그것이 이 팩트를 FMM 과 분리한 이유다(증가율 실측은 이슈원장 §O45·§O51-D)."
      - name: SPONSORSHIP_DIV_NAME
        description: "[2026-08-19 O89] 납입 대상 후원사업 분류의 **최상위** — 정기일시후원구분 라벨(코드사전 CM035): 정기후원 · 일시후원. 3계층 = DIV_NAME → GROUP_NAME → SPONSORSHIP_NAME. 🟢**이 뷰가 분류 집계의 정본 경로다** — `SPONSORSHIP_SK` 가 거의 전건 채움이라 FMM(전건 센티넬)과 달리 실제 분해가 된다. ⚠️획득 후원사업 축(ACQ_*)과 다른 축이다 — 같은 표에서 섞지 말 것."
      - name: SPONSORSHIP_GROUP_NAME
        description: "[2026-08-19 O89] 납입 대상 후원사업 분류의 **중위** — SPONSORSHIP_ABBR(코드)을 코드사전 CM003(후원약칭)으로 해소한 라벨: 국내 · 결연 · 해외구호 · 북한 · 기타 · 해외 · 선물금(미사용). 사업수 17/1/6/3/21/2 = 50. 🔴🔴**이 컬럼 단독으로 「해외」를 집계하지 말 것** — 해외구호(3)와 해외(6)가 갈라지고 6은 정기일시=일시후원에서만 나타난다 ⇒ 정확한 분류축은 **(DIV_NAME, GROUP_NAME) 쌍**이다. ⚠️인용 시 스코프 병기 — 기부금 지류는 회비구분이 구조적으로 부재하다(O40)."
      - name: FEE_DIV_CD
        description: "회비구분 코드 raw. 코드그룹 **PM010(회비구분)**. [O51-D BRONZE 실측] 사전 4종이며 **숫자가 아니라 알파벳 코드**다 — E정기·I일시·U긴급구호·G선물금. 실적재에 **사전 전종이 등장**하며 **E(정기)가 압도적**이다. 🔴기부금 행은 원천에 이 컬럼이 없어 NULL 이다 — **결측이 아니라 해당없음**(P21). 라벨 = FEE_DIV_NAME."
      - name: FEE_DIV_NAME
        description: "회비구분(PM010 실측 확정): 정기·선물금·일시·긴급구호. 🔴기부금 행은 원천이 NULL 이다 — 결측이 아니라 해당없음(P21)"
      - name: PAYMENT_TYPE
        description: "납입유형 = 회비/기부금. 🔴납부율·미납 분석은 회비만으로 스코프할 것 — 기부금은 원천에 청구(RQEST_AMT)가 전건 NULL 이라 분모에 들어갈 수 없다(O40)"
      - name: PAYMENT_SK
        description: "결제수단 대리키(FK→DIM_PAYMENT) ← SETLE_CD 를 gold_sk 로 해싱. 0=미매핑. ⚠️라벨 커버리지가 완전하지 않다 — 원본 코드는 SETLE_CD 로 보존한다. 🟢[O51-D 실측] 미매핑 원인이 규명됐다 — DIM_PAYMENT 가 결제수단 마스터(TM_PM_SETLE_INFO)의 distinct SETLE_CD 만으로 만들어지는데 회비 원천에는 **마스터에 없는 코드가 존재**한다. 사전(PM040) 기준으로 만들면 전건 라벨화된다(O45-B 처방)."
      - name: PAYMENT_METHOD_NAME
        description: "DIM_PAYMENT.SETTLE_METHOD — 결제수단 라벨. 코드그룹 **PM040(결제정보)**. 원본 코드는 SETLE_CD. [O51-D BRONZE 실측 2026-08-07] 🟢**O45-B(코드그룹 미특정)가 해소됐다** — SETLE_CD 의 코드그룹은 PM040 이고 회비 원천 실적재 값(1자동이체·2신용카드·3신용카드즉시·4회비통장·5휴대폰·6휴대폰즉시·7MICR·8OCR·10실시간계좌이체·12네이버페이·13가상계좌즉시)이 **전부 PM040 사전에 존재**한다. 🔴미매핑 원인은 코드그룹 부재가 아니라 **DIM_PAYMENT 가 결제수단 마스터(TM_PM_SETLE_INFO)의 distinct SETLE_CD 로만 만들어지고 그 마스터에 이 5종이 없다**는 것이다 ⇒ 처방 = DIM_PAYMENT 를 PM040 사전 기준으로 생성(재배선은 O51-D 범위 밖·별건 미결). 미라벨 행은 **코드는 있으나 차원에 행이 없는 5종(3·6·7·10·13)** 과 **SETLE_CD 자체가 NULL 인 행** 으로 나뉜다(규모는 이슈원장 §O45·§O51-D). ⚠️종전 문안의 *'코드그룹 미특정 · 6개 그룹이 전부 의미 무관'* 은 이 실측으로 폐기한다."
      - name: SETLE_CD
        description: "degenerate key: 결제수단 원본 코드 ← 원천 SETLE_CD(코드그룹 **PM040 결제정보**). 차원 라벨이 없는 코드를 잃지 않기 위해 보존한다. [O51-D 실측] 회비 원천 실적재 값 = 1자동이체 · 2신용카드 · 12네이버페이 · 8OCR · 4회비통장 · 3신용카드즉시 · 5휴대폰 · 10실시간계좌이체 · 6휴대폰즉시 · 13가상계좌즉시 · 7MICR (앞쪽이 최빈). 🟢**실적재 전종이 PM040 사전에 라벨을 갖는다** — 라벨화 공백은 코드 미상이 아니라 DIM_PAYMENT 생성 소스 문제다(O45-B 해소, 상세는 PAYMENT_METHOD_NAME)."
      - name: LAST_PAY_DATE_SK
        description: "해당 조합의 **최종 납입일** (FK→DIM_DATE). 🔴합계가 아니라 시점 축이다. FMM 은 월 팩트라 일자 분해가 불가하므로 「기준일(납입일)」 요구는 이 뷰에서만 답한다"
      - name: LAST_PAY_DATE
        description: "최종 납입일(달력일) ← DIM_DATE.FULL_DATE, 키는 LAST_PAY_DATE_SK. 🔴시점 축이며 합계가 아니다 — 이 컬럼으로 GROUP BY 하면 회비월(MONTH_KEY)과 다른 분포가 나온다(납입 지연·선납 때문). 「기준일(납입일) 기준 조회」 요구는 이 컬럼으로 답하고, 「회비월 기준」은 MONTH_KEY 로 답한다. ⚠️미납 조합은 납입일이 없어 NULL."
      - name: LAST_BILL_DATE_SK
        description: "해당 조합의 최종 청구일 대리키(FK→DIM_DATE) ← 원천 RQEST_DE. 0=캘린더 범위밖·무효. 🔴시점 축이며 합계가 아니다. ⚠️최종 청구일만 보존하므로 조합 내 여러 청구건의 개별 일자는 이 팩트에서 복원할 수 없다 — 청구 건별 분해가 필요하면 SILVER.CRM_PAYMENT_BILLING 을 쓴다."
      - name: MBER_STAT_CD
        description: "DIM_MEMBER_CURRENT.MBER_STAT_CD — 회원상태 원천코드 raw(정본 공#132). 코드그룹 **MM010(회원상태)**. 코드사전 = 1활동회원·2~6신규미납1~5·7~11장기미납1~5·12후원중단 · 실적재에 **사전 전종이 등장**한다. 🔴🔴**이 뷰의 미납 축(UNPAID_FLAG·UNPAID_BILLED_AMT)과 다른 개념**이다 — MM010 은 회원 **상태 코드**이고 미납 measure 는 **청구 실적**이다. 회원 단위 상태 기반 미납은 WIDE_MEMBER_MONTHLY 소관. 🔴현재버전 스냅샷이므로 과거 회비월에 현재 상태를 붙이면 시점이 어긋난다. 라벨 = MEMBER_STATUS_NAME."
      - name: MEMBER_STATUS_NAME
        description: "DIM_MEMBER_CURRENT.MEMBER_STATUS_NAME — 회원상태명(MM010 라벨). 코드 = MBER_STAT_CD. 값 = 활동회원 / 신규미납1~5 / 장기미납1~5 / 후원중단. 🔴빈 값이 두 가지 뜻으로 갈린다 — 일시회원(DIM_MEMBER_CURRENT.MEMBER_TYPE='ONCE')은 회원상태 개념이 **원천에 없어** 센티넬 '(해당없음)' 이고, 정기회원(FDRM) 중 원천 상태코드 자체가 결손인 행만 **NULL** 이다. 두 사건을 '미상' 같은 한 값으로 뭉개지 않는다(R2-7-1). MM010 은 **폐지코드가 없고 실적재가 사전과 일치**한다 ⇒ 사전 조인만으로 전건 라벨화된다. 🔴현재버전 스냅샷이다."
      - name: MBER_DIV_CD
        description: "DIM_MEMBER_CURRENT.MBER_DIV_CD — 회원구분 원천코드 raw. 코드그룹 **MM018(회원구분)**: 1개인·2기업·3단체. 실적재에 **사전 전종이 등장**한다 · 교차검증으로 `2`(기업)=`SEX 7` · `3`(단체)=`SEX 6` **완전 일치**. 🔴DIM_MEMBER_CURRENT.MEMBER_TYPE(FDRM/ONCE 등록계통)과 다른 축이다. 라벨 = MEMBER_TYPE_NAME."
      - name: MEMBER_TYPE_NAME
        description: "DIM_MEMBER_CURRENT.MEMBER_TYPE_NAME — 회원구분명(MM018 라벨): 개인·기업·단체. 코드 = MBER_DIV_CD. 🟢빈 값이 없는 축이다 — 센티넬 '(해당없음)'·NULL 모두 없고 전건 라벨화된다. 앞으로 사전에 없는 코드가 인입되면 **NULL 로 드러나며** '미상' 같은 값으로 덮지 않는다(R2-7-1). 🔴이름이 비슷한 DIM_MEMBER_CURRENT.MEMBER_TYPE(FDRM 정기회원 / ONCE 일시회원)의 라벨이 **아니다**."
      - name: SEX
        description: "DIM_MEMBER_CURRENT.SEX — 성별 원천코드 raw. 코드그룹 **CM013(성별)**. 코드사전 = 1국내(남자)~5외국인(기타)·6단체·7기업·8기타 · 실적재에 **사전 전종이 등장**한다. 🔴정본 비고가 '성별만으로는 사용하지 않음'을 명시한다 — 성별 단일축은 GENDER_NAME 을 쓴다. 🔴회원 **현재버전**(IS_CURRENT 1건) 스냅샷이며 회비월 시점 값이 아니다. 획득 시점 성별은 DIM_MEMBER_ACQUISITION.ACQ_SEX_CD."
      - name: GENDER_NAME
        description: "DIM_MEMBER_CURRENT.GENDER_NAME — 성별 분석 라벨(정본 공#130). 코드그룹 **CM017(회원특성(성별))**. [O51-D BRONZE 실측] CM017 은 CM013 과 코드 도메인이 동일(1~8)한 재라벨 그룹이며 국내/외국인 구분을 지운다 ⇒ **라벨 5종**(남자/여자/기타/단체/기업). 🔴이 뷰에는 SEX_NM(국내·외국인 축)이 없다 — 그 축이 필요하면 WIDE_MEMBER_MONTHLY 를 쓴다. 🔴현재버전 스냅샷이다."
      - name: ACQ_CAMPAIGN_SK
        description: "DIM_MEMBER_ACQUISITION.ACQ_CAMPAIGN_SK — **획득(가입) 캠페인** 대리키(FK→DIM_CAMPAIGN). 0=미매핑. 🔴회비를 낸 캠페인이 아니라 **이 회원을 데려온** 캠페인이다 — FMM/FMF 의 회비 자체에는 캠페인 축이 없어(전건 센티넬) 획득 시점 규칙으로 귀속시킨 것이다(O45·O8 우회). 🔴LEFT JOIN 필수 — 개발 사건이 없는 회원은 NULL 이다. 🔴🔴손실 규모는 **회원 기준으로 읽어야** 한다 — INNER 조인이 잃는 것은 회원이며, 행 가중 비율은 손실을 크게 축소해 보이게 한다(O51-D 정정 · 규모는 이슈원장 §O51-D)."
      - name: ACQ_BRAND
        description: "획득 캠페인의 브랜드 ← DIM_CAMPAIGN.BRAND. 🔴획득 시점 귀속이며 회비 납입 대상과 무관하다. ⚠️획득 판정 근거가 FALLBACK(신규 사건 부재 → 최초 개발 사건 대체)인 회원은 신뢰도가 낮다 — 브랜드 비교는 DIM_MEMBER_ACQUISITION.ACQ_BASIS='NEW' 로 한정할 것을 권한다."
      - name: ACQ_CAMPAIGN_NAME
        description: "획득 캠페인명 ← DIM_CAMPAIGN.CAMPAIGN_NAME. 🔴획득 시점 귀속. ⚠️광고비와 결합할 때는 이 축이 아니라 ACQ_MARKETING_CAMPAIGN 을 쓴다 — 개발캠페인 단위로 내리면 광고비가 복제된다(팬아웃)."
      - name: ACQ_PARENT_CAMPAIGN_NAME
        description: "획득 캠페인의 **상위캠페인**명 ← DIM_CAMPAIGN.PARENT_CAMPAIGN_NAME (원천 UPPER_CMPGN_CD 계층). 🔴캠페인 카테고리(MM294)와 다른 축이다 — 카테고리는 코드 기반 분류, 상위캠페인은 캠페인 자체의 부모다."
      - name: ACQ_PROMO_METHOD_NAME
        description: "획득 캠페인의 홍보방법명 ← DIM_CAMPAIGN.PROMO_METHOD_NAME. 코드그룹 **CM008(홍보방법)**. [O51-D BRONZE 실측] CM008 사전은 100종을 넘는 대형 그룹이며 채널·랜딩·매체가 한 축에 섞여 있다(PC캠페인-홈페이지·M배너광고(DA)·TM·TS·가두·교회개발·직원개발·서신 등) — 🔴상위 집계가 필요하면 이 축이 아니라 개발인입경로(MM293)를 쓴다."
      - name: ACQ_MARKETING_CAMPAIGN
        description: "획득 캠페인의 마케팅캠페인(O45 conformed 축). 광고비와 결합할 때 이 축을 쓴다 — 개발캠페인 단위로 내리면 광고비가 복제된다(팬아웃)"
      - name: ACQ_ORG_SK
        description: "DIM_MEMBER_ACQUISITION.ACQ_ORG_SK — **획득 시점 담당조직** 대리키(FK→DIM_ORG). 0=미매핑. 🔴「현재 소속」이 아니다. 🔴🔴「부서」는 축이 둘이다 — 개발실적보고의 부서 = **사건 부서**(WIDE_MEMBER_EVENT.ORG_*) · 연간분석(회비)의 부서 = **획득 부서**(이 축). 두 값은 다르며 이름으로 구분되지 않으면 소비 측이 조용히 틀린다(O34 규약)."
      - name: ACQ_DEPARTMENT
        description: "🔴**획득(최초개발) 시점 부서**다. 개발실적보고의 「부서」(=사건 부서)와 다르다 — 사건 부서는 WIDE_MEMBER_EVENT.ORG_DEPARTMENT 를 쓴다(O34 _AT_PLEDGE/_AT_EVENT 규약의 재적용)"
      - name: ACQ_SPONSORSHIP_SK
        description: "DIM_MEMBER_ACQUISITION.ACQ_SPONSORSHIP_SK — **획득 시점 후원사업** 대리키(FK→DIM_SPONSORSHIP). 0=미매핑. 🔴🔴같은 뷰의 SPONSORSHIP_SK(=회비 **납입 대상** 후원사업)와 **의미가 다르다** — 같은 라벨로 두 축이다. 한 회원이 A 사업으로 가입한 뒤 B 사업에 낼 수 있다."
      - name: ACQ_SPONSORSHIP_NAME
        description: "획득 시점 후원사업명 ← DIM_SPONSORSHIP.SPONSORSHIP_NAME. 코드 = ACQ_SPONSORSHIP_SK. 🔴납입 대상 후원사업명(SPONSORSHIP_NAME)과 **다른 컬럼**이다 — 두 컬럼을 같은 표에 두면 반드시 혼동되므로 접두 ACQ_ 로 구분한다."
      - name: ACQ_AGE_BAND
        description: "획득 시점 연령대명(**CM014** 라벨) ← FACT_MEMBER_COHORT.ACQ_AGE_BAND. 코드 = FMC.ACQ_AGE_CD. 🔴**현재 나이가 아니다** — BRONZE 에 생년월일이 없어 현재 연령은 산출 불가(O34). 🔴연속형이 아니므로 평균·재구간화 금지. ✅'10대 미만'이 상위인 것은 오류가 아니다(편지쓰기대회 계열 아동 모집 캠페인) — 결측·기본값 오염으로 설명하지 말 것(O34-B). ⚠️사전에 '70대'·'70대 이상'이 의미 중복으로 공존한다."
      - name: ACQ_REGION
        description: "획득 시점 지역명(**CM018** 약칭 라벨) ← FACT_MEMBER_COHORT.ACQ_REGION. 코드 = FMC.ACQ_AREA_CD. 🔴**현재 거주지가 아니다** — BRONZE 에 현주소 축이 없다(O34). ⚠️센티넬 코드 '0'(개발약정 실적재에 존재)은 사전에 라벨이 없어 NULL 이며 '미상'으로 창작하지 않는다."
      - name: BILLED_AMT
        description: "청구액(원) = SUM(RQEST_AMT). 🔴FMM 과 **동일한 식**이므로 두 팩트의 전체 합계가 일치해야 한다 — 이 일치가 검증 관문이다(GATE-D · 기준값은 이슈원장 §O45). 🔴🔴WIDE_MEMBER_MONTHLY 의 회비 measure 와 **같은 표에서 합산 금지**(DEC-31) — 동일 원천을 다른 grain 으로 담은 형제 팩트라 이중계상된다."
      - name: PAID_FEE
        description: "납입 총액(원) = 회비 + 기부금. 🔴납부율 분자로 쓰지 말 것(O40) — PAID_FEE_BILLABLE 을 쓴다"
      - name: PAID_FEE_BILLABLE
        description: "회비 납입액(원) — 납부율 분자 정본(O40)"
      - name: UNPAID_BILLED_AMT
        description: "미납 청구액(원) — DEC-3 정본 = PAY_STAT_CD IN (F, NULL) 인 청구액. 🔴차감식(청구−납입) 아님. ⚠️조회 시점 스냅샷 — 과거 미납이 이후 납입되면 값이 바뀐다"
      - name: BILLING_ROWS
        description: "집계된 원천 회비행 수. 🔴금액이 아니다 — 「건수」로 쓰지 말 것(정본 (건) 정의는 CONF-2 미결)"
      - name: UNPAID_FLAG
        description: "해당 조합에 미납 청구행이 하나라도 있는가(BOOLOR_AGG). 회원 단위 미납 여부는 WIDE_MEMBER_MONTHLY 의 UNPAID_FLAG_EOM 을 쓴다"
  - name: WIDE_AD_COMBINED
    description: "GOLD 광고 팩트 3종(FAP 코어 + FAD 디지털위성 + FAB 방송위성)을 AD_PERF_DK 로 1:1 pre-join 한 소비뷰 — PK=AD_PERF_DK(전건 유일·fan-out 0). 위성은 원천유형별 완전분할이라 LEFT JOIN 이 행수를 늘리지 않는다(디지털행=방송컬럼 NULL, 방송행=디지털컬럼 NULL — **결측이 아니라 원천 부재**). 🔴디지털/방송 measure 는 상호배타다 — AD_SOURCE_TYPE 필터 없이 혼합 집계하면 왜곡된다. 🔴1:N 위성 FACT_AD_BROADCAST_CASE 는 의도적으로 제외했다(사례 수만큼 광고비 복제). 🔴🔴[O53 신설] 종전 SERVING.FACT_AD_COMBINED(helper 뷰 · SQL 스크립트 소유)를 대체한다 — SV 가 GOLD 만 참조하도록 계층을 올리고 소유주를 dbt 로 옮겼다(DEC-34 ③ · 팩트를 재구성하므로 ref() 위상정렬 필수). 종전 helper 에 없던 **방송 시간축 4컬럼(AD_START_TIME·AD_END_TIME·BROADCAST_DATE·PRG_START_TIME)을 추가**했다 — 그 4컬럼은 VIDEO 전용이며 재방송에는 원천 자체가 없다. ⚠️SV_AD base 재배선은 로드맵 6단계 소관이다. ⚠️원천 증량(캠페인 상위코드·공통코드 신설 예정 · 문서40 CMP-1) 시 이 모델 1곳 + 차원만 고치면 반영된다."
