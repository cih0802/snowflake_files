  - name: WIDE_TARGET_DEV
    description: "회원개발 목표 팩트(FTG_D) 평탄화 — ORG. 월 grain=MONTH_KEY. [2026-08-05 O38] MONTH_KEY 연도 복원으로 CAL_YEAR 가 유효해졌다(종전 1~12 라 FLOOR(MONTH_KEY/100)=0 전건). 목표 대비 실적은 `FACT_DEV_ACHIEVEMENT`(구 WIDE_DEV_ACHIEVEMENT · O53 개명) 소관이다. 🔴[O51-F 실측] 조직 상위 계층(ORG_CORP·ORG_DIVISION·ORG_TEAM)은 차원 자체가 비어 있어 **부서 단위까지만 분해된다**(CONF-4)."
    # 🔬 [2026-08-07 O51-C probe] 컬럼 COMMENT 를 물리로 넣는 유일 경로 = CREATE VIEW 인라인 컬럼목록.
