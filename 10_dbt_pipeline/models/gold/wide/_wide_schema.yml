    #   ✅ [O51-D-B] ORG_* 의 "(as-was)" 를 **전 뷰 16건 일괄 교정 완료**(`scripts/o51d_view_comments/fix_as_was.py`).
    #      DIM_ORG 는 DEC-2(2026-07-07)에서 SCD1 확정이라 as-was 는 거짓이고 실제 의미는 current-value 다.
    #      🔴 O51-C 가 이 잔재를 **3뷰(TARGET_DEV·TARGET_BIZ·BUDGET)의 물리 COMMENT 로 실제 배포**했다 — P62-B 의 물리 계층 실증.
    # [O51-F] ✅ [2026-08-10] 빈 축·희소축 경고 **오버레이 적용**(기존 문안 보존).
