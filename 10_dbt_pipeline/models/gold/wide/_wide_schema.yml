version: 2

# GOLD WIDE 소비뷰(순서9-D) — 팩트×차원 LEFT JOIN 평탄화 view. 물리저장 0.
#   ref() 로 GOLD 모델 참조 → 거버넌스·리니지·build 게이트(BLOCKING-4 해소).
#   컬럼/뷰 COMMENT 적용 = `materialized='gn_view_commented'`(O51-C) — 아래 정정 참조. post_hook 방식 폐기.
#   실행: dbt build --select tag:gold_wide   (또는 path:models/gold/wide)
#
# 🔴 [2026-08-07 O50 → **O51 에서 재정정**] COMMENT 정본 위상.
#   ⚠️⚠️ **O50 의 원 기술은 틀렸다.** 당시 *"dbt post_hook 16/16 = 물리 COMMENT 정본"* 이라고 적었으나
#   그것은 **파일에 문장이 있는지만 센 값**이고 **효과를 확인하지 않았다**(P33 위반 — 완료 판정은
#   `INFORMATION_SCHEMA` 스캔이다). 실측(2026-08-07): GOLD 뷰 **520컬럼 중 COMMENT 보유 0개(0.0%)**.
#   원인 = post_hook 의 `ALTER VIEW ... ALTER COLUMN ... COMMENT` 가 **Snowflake 에 없는 문법**(O51).
#   4변형 전부 실패: ALTER COLUMN COMMENT / ALTER COLUMN SET COMMENT / MODIFY COLUMN COMMENT /
#   COMMENT ON COLUMN(→ "type 'VIEW', not 'TABLE'"). ⇒ `09`(12) · `10`(13) · post_hook(16) 세 사본이
#   **모두 물리에 0 을 반영**했고, 사본 개수 비교 자체가 무의미한 지표였다.
#   ⇒ **물리 COMMENT 의 유일 경로 = `CREATE VIEW` 인라인 컬럼목록** → `macros/gn_view_commented.sql`.
#   ⇒ 컬럼 COMMENT 정본 = 아래 `columns[].description` · 뷰 COMMENT 정본 = `description`.
#      probe(WIDE_TARGET_DEV) 실측 **10/10 물리 반영 확인**. `09`·`10` 은 참고본 강등 유지(사유는 변경).
#
# 🔴 [2026-08-07 O50 · O51-D 갱신] GOLD dbt 뷰는 이 폴더에만 있지 않다 — 전량 **16개**다.
#   `models/gold/dim/DIM_MEMBER_CURRENT.sql` · `DIM_MEMBER_ACQUISITION.sql` 이 `materialized='view'` 오버라이드로
#   **dim/ 에 있다.** 따라서 `--select tag:gold_wide` 는 GOLD 뷰 전량을 덮지 않는다(`DIM_MEMBER_CURRENT` 는 태그 0).
#   ✅ [O51-D] 이 2종을 `_gold_ready_schema.yml` 에 `- name:` 등재하고 columns[] 45개를 부여했다(O50 잔여 해소).
# WIDE_TARGET_BIZ(9번째) 추가완료 — FACT_TARGET_BIZ(스키마-only, 원천=CRM 확정 CRM_BIZ_TARGET, E-6 입고 대기 0행) 참조. 차원 조인은 이름 크로스워크.
#   단위=건 확정(2026-07-20, #152~155): SILVER TARGET_CNT(건) → FACT TARGET_TYPE 피벗(당초→ANNUAL·추경→SUPP). 누계는 SV(P7). E-6 입고 시 채움.
models:
  - name: WIDE_MEMBER_MONTHLY
    description: "회원 월 팩트(FMM) 평탄화 — MEMBER[현재버전]·CAMPAIGN·SPONSORSHIP·PAYMENT·REASON. 월 grain=MONTH_KEY."
    # ✅ [2026-08-07 O51-D] 컬럼 문안 전량 등재 · ORDINAL_POSITION 순서로 기계 생성(손 이관 금지).
    #   ⚠️ Snowflake 제약: CREATE VIEW 컬럼목록은 SELECT 의 전 컬럼과 **개수·순서가 정확히 일치**해야 한다.
    #      모델 SELECT 순서를 바꾸면 이 블록도 동시에 재생성할 것(scripts 없이 손으로 고치지 말 것).
    #   문안 출처 = ① `03_top-down_gold/10_WIDE VIEW 코멘트.sql` 이관 ② O51-D BRONZE 전수 재스캔 신규.
    #   🔴 `10_` 의 컬럼명 20건은 O26 리네임 미반영 유령이라 폐기했다(MEMBER_GENDER→MEMBER_GENDER_NAME 등).
