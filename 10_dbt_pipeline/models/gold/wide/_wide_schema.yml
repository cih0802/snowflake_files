    # [O51-F]      136컬럼은 감사되지 않았다 → 재스캔에서 **전건 센티넬이 침묵 중**임이 드러났다(O51-F-B).
    # [O51-F]      전건 '(미매핑)' 은 문자열이라 GROUP BY 가 단일 그룹을 반환한다 = 오답이 에러 없이 나온다.
