  # ─── AGENCY 위성 팩트 3종 (순서9-I DEC-8) ───
  # 코어 FACT_AD_PERFORMANCE 와 AD_PERF_DK 로 조인. FAD_B·FAD_D 는 1:1, FAD_BC 는 1:N.
