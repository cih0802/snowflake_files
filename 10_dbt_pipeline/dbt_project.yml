# GN_DW SILVER dbt 파이프라인 — BRONZE 정제 → SILVER 적재 (순서 7, 정본 09_SILVER_적재쿼리_20260714)
# Co-authored with CoCo
name: 'gn_dw_silver'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# GA4 샤드 범위 var (전기간 입고 후 조정; PoC 기본 = 전범위 UNION).
vars:
  ga4_start: '20000101'
  ga4_end:   '99991231'
  # 순서9: GOLD 날짜차원(DIM_DATE) 고정 연속범위. date_sk 매크로가 이 범위 밖/NULL 을 NULL 로 클램프
  #   → fact 에서 COALESCE(date_sk(...),0) 로 Unknown 멤버(DATE_SK=0) 라우팅. 범위 변경 시 DIM_DATE 도 자동 반영.
  cal_start: '1991-01-01'
  cal_end:   '2035-12-31'

# ---------------------------------------------------------------------------
# materialization 방침
#   - SILVER (순서 8-B 개정): 구조 소유주 = 08_SILVER_테이블DDL. dbt = incremental +
#     pre-hook TRUNCATE + append + full_refresh:false → DDL 구조 보존하며 데이터만 전체 갱신(멱등).
#     (순서 7 의 materialized='table'/INSERT OVERWRITE 를 구조보존형으로 대체.)
#   - DW_LOAD_TS = CURRENT_TIMESTAMP() (재실행 시 갱신) — 프로젝트 관례, 변경 금지(7-E).
#   - GOLD (순서 8): dim=incremental(merge, DDL 보존) / fact=table. 상세는 아래 gold 블록 주석.
# ---------------------------------------------------------------------------
models:
  gn_dw_silver:
    silver:
      +database: GN_DW
      +schema: SILVER
      # 순서 8-B: 구조 소유주 = 04_silver_design/08_SILVER_테이블DDL_20260714.sql (33테이블 선생성).
      #   dbt 는 구조를 덮지 않고 데이터만 갱신 → INSERT OVERWRITE 동치를 구조보존형으로 구현.
      #   전략: incremental + pre-hook TRUNCATE + append + full_refresh:false.
      #     · 매 run: 기존 DDL 테이블 TRUNCATE(제약·주석·구조 보존) 후 전체 SELECT 재적재(append).
      #     · unique_key 불필요 → grain 비유일 모델 행소실 없음. 멱등(재실행 Δ0).
      #     · full_refresh:false → --full-refresh 시에도 CTAS 재생성 차단(DDL 구조 보호).
      #   ⚠️ 전제: 08 DDL 선행 실행(테이블 미존재 시 incremental 첫 run 이 CTAS 로 구조 없이 생성됨).
      +materialized: incremental
      +incremental_strategy: append
      +full_refresh: false
      +pre-hook: "TRUNCATE TABLE IF EXISTS {{ this }}"
    # GOLD: 순서 8 활성화 → 순서 9 개정. 구조는 03_top-down_gold/06_DDL.sql 소유(24테이블 선생성).
    #   - dim  = incremental(merge) + full_refresh:false → DDL 구조·제약·주석 보존, INSERT/UPSERT.
    #   - fact = incremental + append + pre-hook TRUNCATE + full_refresh:false (SILVER 동일 패턴)
    #            → DDL 구조·타입·주석·FK 보존하며 데이터만 전체 갱신(멱등 Δ0). table(CTAS) 폐기.
    #            (table 이 매 run DDL 을 덮어써 타입 소실·fact FK 23개 드롭하던 문제 = 순서9 G-1/G-2 해소.)
    #   - fact grain 비유일(스캐폴드 SK=0)이라 merge 대신 append(unique_key 불요·행소실 없음).
    #   ⚠️ 전제: 06_DDL 선행 실행(테이블 미존재 시 incremental 첫 run 이 CTAS 로 구조 없이 생성됨).
    gold:
      +database: GN_DW
      +schema: GOLD
      +enabled: true
      +full_refresh: false
      fact:
        +materialized: incremental
        +incremental_strategy: append
        +pre-hook: "TRUNCATE TABLE IF EXISTS {{ this }}"
        # [2026-08-05 O40-B] 🔴 신규 컬럼 무증상 폐기 차단 (P82)
        #   기본값 'ignore' 는 모델에 있고 대상 테이블에 없는 컬럼을 **에러·워닝 없이 버린다.**
        #   실제로 겪었다: O40 에서 컬럼 2종을 추가하고 build 가 ERROR=0 으로 끝났는데
        #   INSERT 가 대상 테이블의 56컬럼만 써서 신규 컬럼이 생기지 않았다(문서10 §24-H).
        #   ⚠️컬럼 추가 절차: ① 06_DDL.sql 수정 ② ALTER TABLE 실행 ③ INFORMATION_SCHEMA 로
        #   컬럼 존재 확인 ④ 모델 수정 ⑤ build ⑥ **신규 컬럼 비NULL 건수 검증**.
        #
        # 🔴 [2026-08-05 O42] 종전 'fail' 은 **파이프라인을 세웠다.** 그리고 그 자리 주석의
        #   *"13개 팩트 전량 컴파일 대조로 드리프트 0 확인"* 은 **거짓 안전 신호**였다 —
        #   그 대조는 **컬럼만** 봤는데 dbt 는 **컬럼 + 타입**을 함께 diff 하고 하나라도 있으면 던진다.
        #   결과: 도입 후 첫 build 부터 팩트 10종 ERROR · 145 SKIP(PASS=221). 3회 재시도 전부 동일.
        #   실패 10종 모두 컬럼 집합은 일치(추가 0·삭제 0)였고 발화 원인은 **타입 101컬럼**뿐이었다.
        #   타입 차이는 이 아키텍처의 **정상 상태**다(정본 DDL 이 의도한 폭을 선언 / 모델은 센티넬
        #   리터럴·HASH()·나눗셈을 낸다). 게다가 'fail' 의 해법 3개가 전부 금지다:
        #   자동 ALTER(기각) · full_refresh(CTAS 가 DDL·제약·주석·FK 파괴 → +full_refresh:false) ·
        #   수동 스키마 변경(정본을 추론 타입에 맞춰 넓히라는 뜻 = 거꾸로) ⇒ **해소 경로 없는 교착**.
        #
        # ✅ [2026-08-05 O42 조치] 'append_new_columns' 채택. dbt 원본 동작 확인:
        #   `sync_column_schemas('append_new_columns', …)` 는 **타입 변경을 아예 처리하지 않고**
        #   `source_not_in_target` 만 ALTER 한다 → 현재 그 집합이 **공집합**이라 **완전 no-op**이며
        #   타입 오탐이 사라진다. 그리고 'ignore' 가 아니므로 `process_schema_changes` 반환이
        #   **source_columns(=모델 컬럼)** 이고 그것이 INSERT 의 dest_columns 가 된다
        #   → **O40 무증상 폐기 차단은 그대로 유지된다**(이것이 'ignore' 로 되돌리지 않는 이유).
        #   ⚠️ 남는 대가 = 훗날 모델에만 있는 신규 컬럼이 생기면 dbt 가 **자동 ALTER** 하므로
        #      물리가 06_DDL.sql 보다 앞서 나갈 수 있다(O30 유형 드리프트) → 위 ①~⑥ 절차를
        #      반드시 지킬 것. 감시 항목으로 O42-C 등재.
        #   ⚠️ 시도했다가 철회한 안: `macros/gn_on_schema_change.sql` 로 전역 매크로
        #      `snowflake__process_schema_changes` 를 오버라이드해 「컬럼 전용 가드」로 좁히려 했으나
        #      **Snowflake 서버측 dbt 런타임에서 발화하지 않았다**(워크스페이스 실행·배포객체
        #      VERSION$2 양쪽 모두 dbt 원본 문구 그대로). 발화하지 않는 가드는 거짓 안전 신호이므로
        #      **파일을 삭제**했다. 근거·재현 = 20_issue/00_INDEX_이슈원장.md §O42
        +on_schema_change: append_new_columns
      # WIDE 소비뷰(순서9-D): 팩트×차원 LEFT JOIN 평탄화. 물리저장 0(view).
      #   ref() 로 GOLD 모델 참조 → 거버넌스·리니지·build 게이트 확보(BLOCKING-4 해소, 미거버넌스 객체 재발방지).
      #   컬럼/뷰 COMMENT 는 각 모델 post_hook 의 ALTER VIEW/COMMENT ON VIEW 로 적용(정본 03_top-down_gold/10_WIDE VIEW 코멘트.sql verbatim).
      wide:
        +materialized: view
        +tags: ['gold_wide']
