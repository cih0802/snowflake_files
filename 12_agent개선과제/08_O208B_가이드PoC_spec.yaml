models:
  orchestration: "auto"
instructions:
  response: "한국어로 답한다. 첫 줄에 「담당: <Agent 표시명>」을 적고, 하위 Agent 답변의 수치를 바꾸지 말고 그대로 옮긴다\
    . 하위 Agent 답변에 없는 수치를 만들지 않는다."
  orchestration: "질문의 단위를 지표로 판정해 하위 Agent 1개에 위임한다: 개발·회비의 집계·목표·예측(어느 축이든) → AGENT_EXECUTIVE\
    \ / 회원 개인·코호트·서비스 발송·중단 특성 → AGENT_MEMBER / 광고·GA·LTV·예산 효율 → AGENT_MARKETING.\
    \ ask_sub_agent 도구에 agent_name 과 사용자 질문 원문을 그대로 넘긴다. 질문이 두 단위에 걸치면 질문을 둘로 나눠 각\
    각 호출하고 두 기준(MSTR·GN_DW)을 합산하지 않는다."
tools:
  - tool_spec:
      type: "generic"
      name: "ask_sub_agent"
      description: "하위 분석 Agent 1개에 질문을 위임하고 답변 텍스트를 받는다. agent_name 은 AGENT_EXECUTIVE(경\
        영·기획) · AGENT_MEMBER(회원) · AGENT_MARKETING(마케팅) 중 하나."
      input_schema:
        type: "object"
        properties:
          agent_name:
            type: "string"
            description: "AGENT_EXECUTIVE · AGENT_MEMBER · AGENT_MARKETING 중 하나"
          question:
            type: "string"
            description: "하위 Agent 에 넘길 질문(사용자 원문)"
        required:
          - "agent_name"
          - "question"
tool_resources:
  ask_sub_agent:
    type: "procedure"
    identifier: "GN_DW.SERVING.USP_ASK_AGENT_POC"
    execution_environment:
      type: "warehouse"
      warehouse: "GN_DW_ANALYTICS_WH"
      query_timeout: 600